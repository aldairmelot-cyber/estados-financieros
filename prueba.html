          prov = { nit: t[0], nombre: t.slice(1).join(" "), cuenta: cuenta.codigo, facturas: [], totalReporte: null };

        }
        const iF = t.findIndex((x) => /^\d{2}\/\d{2}\/\d{2}$/.test(x));
        if (!prov || iF < 1 || iF > 2) continue;

        const resto = t.slice(iF + 1);

        if (/^\d{2}\/\d{2}\/\d{2}$/.test(resto[2])) { venc = fechaCorta(resto[2]); k = 3; }

    }
    const total = r2(proveedores.reduce((s, p) => s + p.saldo, 0));
    if (totalEmpresa && Math.abs(totalEmpresa.saldo - total) > 2) avisos.push(`La suma de los proveedores leídos (${total}) no coincide con el total de la empresa (${totalEmpresa.saldo}). Revise que el PDF esté completo.`);
    return { tipo: "prov-det", corte, nitEmpresa, cuenta, proveedores, totalEmpresa, total, avisos };
  }

  /** Acumulado por proveedor. */
  function leerAcumulado(paginas) {
    const todo = textoPDF(paginas);

    for (const pagina of paginas) {
      for (const f of renglones(pagina)) {
        const t = f.c.map((x) => x.t), linea = t.join(" ");
        if (/^Total Empresa/i.test(linea)) { const ns = t.map(num).filter((v) => v != null); if (ns.length >= 8) total = { saldo: ns[0], b: ns.slice(1, 8) }; continue; }

        const ns = [];
        let i = t.length - 1;
        while (i > 0 && num(t[i]) != null && ns.length < 8) ns.unshift(num(t[i--]));
        if (ns.length < 8) continue;
        filas.push({ nit: t[0], nombre: t.slice(1, i + 1).join(" "), saldo: ns[0], b: ns.slice(1) });
      }
    }

  }

  function leerPDF(paginas) {
    const todo = textoPDF(paginas);
    if (/Proveedores Detallado/i.test(todo)) return leerDetallado(paginas);

  }

  /** Compara el acumulado contra el detallado: saldos por proveedor y distribución por edades. */
  function validar(det, acum) {

      const prox30 = r2(pos.filter((x) => x.dias <= 0 && x.dias > -31).reduce((s, x) => s + x.saldo, 0));

      const prioridad = saldo <= 0 ? "favor" : b[4] + b[5] + b[6] > 0.5 ? "critica" : b[3] > 0.5 ? "alta" : vencido > 0.5 ? "media" : "aldia";
      return { nit: p.nit, nombre: p.nombre, cuenta: p.cuenta, facturas, b: b.map(r2), saldo, vencido, porVencer: r2(b[0]), creditos, maxDias, prox7, prox30, prioridad, nFact: pos.length };
    }).filter((p) => Math.abs(p.saldo) >= 0.5); // los proveedores cuyos documentos se anulan entre sí se informan en la validación
    const total = r2(provs.reduce((s, p) => s + p.saldo, 0));
    const b = sumarRangos(provs.map((p) => p.b));
    const vencido = r2(b.slice(1).reduce((s, v) => s + v, 0));

    if (E.ac.length) { filas.push({ tipo: "seccion", celdas: ["Activo corriente"] }); bloque(E.ac); l("subtotal", "Total activo corriente", "", E.t.ac); }
    if (E.anc.length) { filas.push({ tipo: "seccion", celdas: ["Activo no corriente"] }); bloque(E.anc); l("subtotal", "Total activo no corriente", "", E.t.anc); }
    l("total", "TOTAL ACTIVO", "", E.t.activo);
    filas.push({ tipo: "seccion", celdas: ["PASIVO"] });
    if (E.pc.length) { filas.push({ tipo: "seccion", celdas: ["Pasivo corriente"] }); bloque(E.pc); l("subtotal", "Total pasivo corriente", "", E.t.pc); }
    if (E.pnc.length) { filas.push({ tipo: "seccion", celdas: ["Pasivo no corriente"] }); bloque(E.pnc); l("subtotal", "Total pasivo no corriente", "", E.t.pnc); }
    l("total", "TOTAL PASIVO", "", E.t.pasivo);
    filas.push({ tipo: "seccion", celdas: ["PATRIMONIO", "3.0"] });
    bloque(E.pat);
    l("total", "TOTAL PATRIMONIO", "", E.t.pat);
    l("gran", "TOTAL PASIVO Y PATRIMONIO", "", E.t.pyp);
    const pie = [];
    const tol = Number(S.cfg.tolRedondeo ?? 10);
    if (E.t.dif.some((x) => x != null && Math.abs(x) > tol)) pie.push(`Control: el activo y el pasivo más patrimonio difieren en ${E.t.dif.map(fmt).join(" / ")}. Revise el mapeo.`);
    if (!fB) pie.push("No hay datos del 31 de diciembre anterior: cargue el archivo de enero o el de diciembre del año anterior.");
    return { clave: "esf", hoja: "ESF", titulo: "Estado de Situación Financiera", periodoTexto: fB ? `Al ${fechaLarga(fA)} y ${fechaLarga(fB)}` : `Al ${fechaLarga(fA)}`, cols, filas, pie, firmas: true };
  }

  /** ERI comparativo: acumulado del año frente al mismo período del año anterior, más el mes. */
  function modeloERI(D) {
    const { R, ctx } = D;
    const fA = finDeMes(ctx.periodo), [a, m] = anioMes(ctx.periodo);
    const fAnt = finDeMes(`${a - 1}-${String(m).padStart(2, "0")}`);
    const conAnt = R.T.neto[2] != null;
    const cols = [{ t: "Concepto", tipo: "txt" }, { t: "Nota", tipo: "nota" },
      { t: `Año ${a}`, tipo: "num" }, { t: "% sobre ingresos", tipo: "pct" },
      { t: `Año ${a - 1}`, tipo: "num" }, { t: "% sobre ingresos", tipo: "pct" },
      { t: "Variación absoluta", tipo: "num" }, { t: "Variación %", tipo: "pct" }];
    const ing = R.T.ingresos;
    const filas = R.lineas.map((l) => {
      if (l.tipo === "seccion") return { tipo: "seccion", celdas: [l.rubro] };
      const v = l.vals;
      return { tipo: l.tipo, celdas: [l.rubro, l.nota || "", v[0], ing[0] ? v[0] / ing[0] : null, v[2], v[2] != null && ing[2] ? v[2] / ing[2] : null,
        ...var_(v[0], v[2])] };
    });
    const pie = [];
    if (!conAnt) pie.push(`Para el comparativo con ${a - 1} cargue el balance de ${MESES[m - 1]} de ${a - 1} (mensual) o el acumulado de enero a ${MESES[m - 1]} de ${a - 1}. Mientras tanto la columna aparece como n.a.`);
    if (Math.abs(R.control) > 1) pie.push(`Control: el resultado del ERI difiere del resultado del balance en ${fmt(R.control)}. Revise el mapeo.`);
    return { clave: "eri", hoja: "ERI", titulo: "Estado de Resultado Integral", periodoTexto: `Del 1 de enero al ${fechaLarga(fA)} y del 1 de enero al ${fechaLarga(fAnt)}`, cols, filas, pie, firmas: true };
  }

  function modeloSede(D, vista) {
    const { ctx } = D;
    const S2 = Motor.eriSede(ctx, vista);
    const fA = finDeMes(ctx.periodo), [, m] = anioMes(ctx.periodo);
    const titulo = "Estado de Resultado Integral por Sede";
    const periodoTexto = vista === "mes" ? `Mes de ${MESES[m - 1]} – del 1 al ${fechaLarga(fA)}` : `Acumulado del 1 de enero al ${fechaLarga(fA)}`;
    if (S2.error) return { clave: "sede_" + vista, hoja: vista === "mes" ? "ERI sede mes" : "ERI sede acum", titulo, periodoTexto, cols: [{ t: "Concepto", tipo: "txt" }], filas: [], pie: [S2.error], firmas: false, error: S2.error };
    const cols = [{ t: "Concepto", tipo: "txt" }, ...S2.columnas.map((n) => ({ t: n, tipo: "num" }))];
    const filas = S2.lineas.map((l) => (l.tipo === "seccion" ? { tipo: "seccion", celdas: [l.rubro] } : { tipo: l.tipo, celdas: [l.rubro, ...l.vals] }));
    filas.push({ tipo: "seccion", celdas: ["INDICADORES POR SEDE"] });
    const n = S2.columnas.length - 1;
    const ind = (texto, f) => filas.push({ tipo: "rubro", formato: "pct", celdas: [texto, ...S2.indicadores.map(f), f({ total: true })] });
    const T = S2.T;
    filas.push({ tipo: "rubro", formato: "pct", celdas: ["Participación en las ventas", ...S2.participacion] });
    ind("Margen bruto", (x) => (x.total ? (T.ingresos[n] ? T.bruta[n] / T.ingresos[n] : null) : x.margenBruto));
    ind("Margen operacional", (x) => (x.total ? (T.ingresos[n] ? T.operacional[n] / T.ingresos[n] : null) : x.margenOperacional));
    ind("Gasto de personal / ventas", (x) => (x.total ? null : x.personal));
    const pie = [...S2.alertas];
    if (S2.ranking.length) pie.push(`Ranking por ventas: ${S2.ranking.map((r, i) => `${i + 1}. ${r}`).join("  ·  ")}`);
    const opc = S.cfg.eriSede;
    pie.push(opc.vacio === "centro" ? `Costos, gastos e ingresos sin centro de costo: asignados a la sede principal (${nombreSedeCod(opc.vacioCentro || "1", D)}).` : opc.vacio === "columna" ? "Costos y gastos sin centro de costo: columna aparte." : opc.vacio === "ingresos" ? "Costos y gastos sin centro de costo: prorrateados según los ingresos operacionales de cada sede." : "Costos y gastos sin centro de costo: prorrateados con porcentajes fijos.");
    if (S2.corporativos) pie.push(`Gastos corporativos (${opc.corporativo.cuentas.join(", ")}) retirados del centro ${opc.corporativo.centro} por ${fmt(S2.corporativos.total)} y distribuidos ${opc.corporativo.regla === "fijo" ? "con porcentajes fijos" : "según ingresos"}.`);
    pie.push(Math.abs(S2.control) <= 1 ? "Control: la suma de las sedes es igual al total del ERI." : `Control: la suma de las sedes difiere del total en ${fmt(S2.control)}.`);
    return { clave: "sede_" + vista, hoja: vista === "mes" ? "ERI sede mes" : "ERI sede acum", titulo, periodoTexto, cols, filas, pie, firmas: true, apaisado: cols.length > 5, S2 };
  }

  function modeloECP(D) {
    const { ctx, E } = D;
    const P = Motor.ecp(ctx, E);
    const fA = finDeMes(ctx.periodo);

    const cols = [{ t: "Concepto", tipo: "txt" }, { t: `Saldo al ${fechaLarga(E.fechas[1])}`, tipo: "num" }, { t: "Aumento", tipo: "num" }, { t: "Disminución", tipo: "num" }, { t: `Saldo al ${fechaLarga(fA)}`, tipo: "num" }];

    return { clave: "ecp", hoja: "ECP", titulo, periodoTexto: `Del ${fechaLarga(E.fechas[1])} al ${fechaLarga(fA)}`, cols, filas, pie, firmas: true };

  function modeloEFE(D) {
    const { ctx, E, R } = D;
    const F = Motor.efe(ctx, E, R);
    const fA = finDeMes(ctx.periodo);
    const titulo = "Estado de Flujos de Efectivo – Método Indirecto";
    if (F.error) return { clave: "efe", hoja: "EFE", titulo, periodoTexto: `Al ${fechaLarga(fA)}`, cols: [{ t: "Concepto", tipo: "txt" }], filas: [], pie: [F.error], error: F.error };
    const cols = [{ t: "Concepto", tipo: "txt" }, { t: `Al ${fechaLarga(fA)}`, tipo: "num" }];
    const filas = [];
    const sec = (k, titulo2, totalTxt, total) => {
      filas.push({ tipo: "seccion", celdas: [titulo2] });
      F.lineas.filter((l) => l.seccion === k).forEach((l) => filas.push({ tipo: l.subtotal ? "subtotal" : "rubro", celdas: [l.concepto, l.valor] }));
      filas.push({ tipo: "total", celdas: [totalTxt, total] });
    };
    sec("op", "ACTIVIDADES DE OPERACIÓN", "EFECTIVO NETO DE ACTIVIDADES DE OPERACIÓN", F.op);
    sec("inv", "ACTIVIDADES DE INVERSIÓN", "EFECTIVO NETO DE ACTIVIDADES DE INVERSIÓN", F.inv);
    sec("fin", "ACTIVIDADES DE FINANCIACIÓN", "EFECTIVO NETO DE ACTIVIDADES DE FINANCIACIÓN", F.fin);
    filas.push({ tipo: "total", celdas: ["AUMENTO (DISMINUCIÓN) NETO DEL EFECTIVO", F.neto] });
    filas.push({ tipo: "rubro", celdas: ["Efectivo y equivalentes al inicio del período", F.inicial] });
    filas.push({ tipo: "gran", celdas: ["EFECTIVO Y EQUIVALENTES AL FINAL DEL PERÍODO", F.final] });
    const pie = [];
    if (F.noEfectivo.length) {
      pie.push("Transacciones que no implican efectivo:");
      F.noEfectivo.forEach((x) => pie.push(`• ${x.descripcion}: ${fmt(Number(x.valor))} (excluido de inversión y de financiación).`));
    }
    pie.push(Math.abs(F.residuo) <= Number(S.cfg.tolRedondeo ?? 10) ? "Control: efectivo inicial + flujo neto = efectivo final." : `Control: hay una diferencia de ${fmt(F.residuo)} entre el flujo calculado y la variación del efectivo. Revise cuentas sin mapeo.`);
    return { clave: "efe", hoja: "EFE", titulo, periodoTexto: `Del ${fechaLarga(E.fechas[1])} al ${fechaLarga(fA)}`, cols, filas, pie, firmas: true, F };
  }

  /* ------------------------------------------------------------ indicadores: valores e interpretación */
  function fmtInd(u, v) {
    if (v == null || !Number.isFinite(v)) return "n.a.";
    if (u === "%") return pct(v);
    if (u === "pesos") return "$ " + fmt(v);
    if (u === "días") return `${dec(v, 0)} días`;
    return `${dec(v, 2)} veces`;
  }
  const INTERP = {
    razon_corriente: (v) => `Por cada peso de deuda de corto plazo hay ${dec(v)} pesos de activo corriente para cubrirlo.`,
    prueba_acida: (v) => `Sin contar inventarios, la empresa cubre ${dec(v)} veces sus pasivos corrientes.`,
    capital_trabajo: (v) => (v >= 0 ? `Después de pagar las deudas de corto plazo quedarían $${fmt(v)} para operar.` : `El pasivo corriente supera al activo corriente en $${fmt(-v)}.`),
    solvencia: (v) => `Los activos totales cubren ${dec(v)} veces el pasivo total.`,
    endeudamiento: (v) => `El ${pct(v)} de los activos está financiado por terceros.`,
    concentracion_cp: (v) => `El ${pct(v)} de las deudas vence en el corto plazo.`,
    apalancamiento: (v) => `Por cada peso de patrimonio hay ${dec(v)} pesos de deuda.`,
    autonomia: (v) => `Los socios financian el ${pct(v)} de los activos.`,
    end_financiero: (v) => `Las obligaciones financieras equivalen al ${pct(v)} de las ventas anualizadas.`,
    margen_bruto: (v) => `De cada $100 vendidos quedan $${dec(v * 100, 1)} después del costo de ventas.`,
    margen_operacional: (v) => `De cada $100 vendidos quedan $${dec(v * 100, 1)} después de los gastos de operación.`,
    margen_neto: (v) => `De cada $100 vendidos la utilidad final es $${dec(v * 100, 1)}.`,
    ebitda: (v) => `La operación generó $${fmt(v)} antes de intereses, impuestos, depreciaciones y amortizaciones.`,
    margen_ebitda: (v) => `El EBITDA representa el ${pct(v)} de las ventas.`,
    roa: (v) => `Los activos rindieron ${pct(v)} en lo corrido del año.`,
    roe: (v) => `El patrimonio rindió ${pct(v)} en lo corrido del año.`,
    roa_anual: (v) => `Proyectado a 12 meses, los activos rendirían ${pct(v)}.`,
    roe_anual: (v) => `Proyectado a 12 meses, el patrimonio rendiría ${pct(v)}.`,
    cobertura: (v) => `La utilidad operacional cubre ${dec(v)} veces los gastos financieros.`,
    dias_cartera: (v) => `Los clientes pagan en promedio en ${dec(v, 0)} días.`,
    dias_inventario: (v) => `El inventario tarda en promedio ${dec(v, 0)} días en venderse.`,
    dias_proveedores: (v) => `La empresa paga a sus proveedores en promedio en ${dec(v, 0)} días.`,
    ciclo_efectivo: (v) => `Pasan ${dec(v, 0)} días entre el pago a proveedores y el cobro a clientes.`,
    rotacion_activos: (v) => `Las ventas anualizadas equivalen a ${dec(v)} veces el activo total.`,
  };
  const SEMTXT = { verde: "Dentro del rango esperado.", amarillo: "En zona de vigilancia.", rojo: "Por fuera del umbral definido." };

  function modeloInd(D) {
    const I = Motor.indicadores(D.ctx, D.E, D.R, S.cfg.umbrales);
    const fA = finDeMes(D.ctx.periodo), fB = D.E.fechas[1];
    const cols = [{ t: "Indicador", tipo: "txt" }, { t: `Al ${fechaLarga(fA)}`, tipo: "val" }, { t: fB ? `Al ${fechaLarga(fB)}` : "Comparativo", tipo: "val" }, { t: "Estado", tipo: "sem" }, { t: "Interpretación", tipo: "txt2" }];
    const filas = [];
    let grupo = "";
    for (const x of I) {
      if (x.grupo !== grupo) { grupo = x.grupo; filas.push({ tipo: "seccion", celdas: [grupo] }); }
      let interp = x.valor == null || !Number.isFinite(x.valor) ? "No se puede calcular con los datos disponibles." : INTERP[x.clave](x.valor);
      if (x.semaforo) interp += " " + SEMTXT[x.semaforo];
      filas.push({ tipo: "rubro", ind: x, celdas: [x.nombre, fmtInd(x.unidad, x.valor), fmtInd(x.unidad, x.comparativo), x.semaforo || "", interp], formula: x.formula });
    }
    const pie = [`Días del período: ${D.ctx.dias} (1 de enero al corte). Indicadores anualizados: × 12 / ${D.ctx.mes}.`];
    if (D.alerta1399 && !S.cfg.mapeo.some((r) => r.prefijo === "1399" && r.estado === "ESF")) {
      const ac = D.E.t.ac[0], pc = D.E.t.pc[0];
      pie.push(`Atención: los deudores incluyen la cuenta 1399 con saldo débito de $${fmt(D.alerta1399)}. Sin ella, la razón corriente sería ${dec((ac - D.alerta1399) / pc)} y el endeudamiento ${pct(D.E.t.pasivo[0] / (D.E.t.activo[0] - D.alerta1399))}.`);
    }
    return { clave: "ind", hoja: "Indicadores", titulo: "Indicadores Financieros", periodoTexto: `Al ${fechaLarga(fA)}`, cols, filas, pie, firmas: true };
  }

  /* ------------------------------------------------------------ render de un modelo en HTML */
  function celdaHTML(col, v, fila) {
    const tipo = fila.formato === "pct" && col.tipo === "num" ? "pct" : col.tipo;
    if (v == null && fila.sinNa && (tipo === "num" || tipo === "pct")) return "<td></td>";
    if (tipo === "txt") return `<td>${esc(v)}${fila.formula ? `<span class="formula">${esc(fila.formula)}</span>` : ""}</td>`;
    if (tipo === "txt2") return `<td class="interp">${esc(v)}</td>`;
    if (tipo === "nota") return `<td class="nota">${esc(v)}</td>`;
    if (tipo === "val") return `<td>${esc(v)}</td>`;
    if (tipo === "sem") return `<td style="text-align:left;white-space:nowrap">${v ? `<span class="semaforo ${v}"></span>${esc({ verde: "Verde", amarillo: "Amarillo", rojo: "Rojo" }[v])}` : "—"}</td>`;
    if (tipo === "pct") return `<td>${pct(v)}</td>`;
    return `<td${v != null && v < -0.5 && fila.tipo !== "rubro" ? ' class="neg"' : ""}>${fmt(v)}</td>`;
  }
  function encabezadoHTML(m) {
    const e = S.cfg.empresa;
    return `<div class="encab"><img class="logo" src="${$("#t-logo").src}" alt="Districlínicas"><span class="razon">${esc(e.razon)}</span><span class="meta">NIT. ${esc(e.nit)}</span>
      <span class="estado">${esc(m.titulo)}</span><span class="meta">${esc(NIIF)}</span><span class="meta">${esc(CIFRAS)}</span><span class="meta"><b>${esc(m.periodoTexto)}</b></span></div>`;
  }
  const firmasHTML = () => `<div class="firmas">${firmantes().map((f) => `<div><b>${esc(f.nombre)}</b><span>${esc(f.cargo)}</span>${f.tp ? `<span>${esc(f.tp)}</span>` : ""}</div>`).join("")}</div>`;
  function modeloHTML(m, extraClase = "") {
    if (m.error) return `<section class="hoja">${encabezadoHTML(m)}<div class="aviso advertencia"><p>${esc(m.error)}</p></div></section>`;
    const head = `<tr>${m.cols.map((c) => `<th>${esc(c.t)}</th>`).join("")}</tr>`;
    const body = m.filas.map((f) => {
      if (f.tipo === "seccion") return `<tr class="seccion"><td colspan="${m.cols.length}">${esc(f.celdas[0])}${f.celdas[1] ? ` <span style="font-weight:400;color:var(--suave)">· Nota ${esc(f.celdas[1])}</span>` : ""}</td></tr>`;
      return `<tr class="${f.tipo}${f.alerta ? " alerta" : ""}">${m.cols.map((c, i) => celdaHTML(c, f.celdas[i], f)).join("")}</tr>`;
    }).join("");
    return `<section class="hoja ${extraClase}">${encabezadoHTML(m)}<div class="tabla-env"><table class="ef ${m.clave === "ind" ? "ind" : ""}"><thead>${head}</thead><tbody>${body}</tbody></table></div>
      ${m.pie.map((p) => `<p class="pie">${esc(p)}</p>`).join("")}${m.firmas ? firmasHTML() : ""}</section>`;
  }

  /* ------------------------------------------------------------ gráficos SVG */
  function escala(min, max, n = 5) {
    if (min === max) { max = min + 1; }
    const paso0 = (max - min) / n, mag = 10 ** Math.floor(Math.log10(paso0)), r = paso0 / mag;
    const paso = (r <= 1 ? 1 : r <= 2 ? 2 : r <= 5 ? 5 : 10) * mag;
    const lo = Math.floor(min / paso) * paso, hi = Math.ceil(max / paso) * paso;
    const ticks = []; for (let v = lo; v <= hi + paso / 2; v += paso) ticks.push(v);
    return { lo, hi, ticks };
  }
  function barras({ categorias, series, alto = 240 }) {
    const W = 640, H = alto, ml = 64, mr = 12, mt = 12, mb = 30;
    const vals = series.flatMap((s) => s.valores.filter((v) => v != null));
    const { lo, hi, ticks } = escala(Math.min(0, ...vals), Math.max(0, ...vals));
    const y = (v) => mt + (H - mt - mb) * (1 - (v - lo) / (hi - lo));
    const gw = (W - ml - mr) / Math.max(categorias.length, 1);
    const bw = Math.min(42, (gw * 0.72) / series.length);
    let svg = `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img">`;
    for (const t of ticks) svg += `<line class="rej" x1="${ml}" x2="${W - mr}" y1="${y(t)}" y2="${y(t)}"/><text x="${ml - 6}" y="${y(t) + 4}" text-anchor="end">${esc(millones(t))}</text>`;
    svg += `<line class="eje" x1="${ml}" x2="${W - mr}" y1="${y(0)}" y2="${y(0)}"/>`;
    categorias.forEach((c, i) => {
      const x0 = ml + gw * i + (gw - bw * series.length) / 2;
      series.forEach((s, k) => {
        const v = s.valores[i];
        if (v == null) return;
        const y1 = y(Math.max(v, 0)), y2 = y(Math.min(v, 0));
        svg += `<rect x="${x0 + k * bw + 1}" y="${y1}" width="${bw - 2}" height="${Math.max(y2 - y1, 1)}" rx="2" fill="${s.color}"><title>${esc(s.nombre)} · ${esc(c)}: ${fmt(v)}</title></rect>`;
      });
      svg += `<text x="${ml + gw * i + gw / 2}" y="${H - 10}" text-anchor="middle">${esc(c)}</text>`;
    });
    svg += "</svg>";
    const ley = `<div class="leyenda">${series.map((s) => `<span><i style="background:${s.color}"></i>${esc(s.nombre)}</span>`).join("")}</div>`;
    return svg + ley;
  }
  function estructura(E) {
    const W = 640, H = 120, ml = 120, mr = 12;
    const A = E.t.activo[0] || 1;
    const filas = [
      ["Activo", [["Corriente", E.t.ac[0], "var(--serie1)"], ["No corriente", E.t.anc[0], "var(--serie3)"]]],
      ["Pasivo y patrimonio", [["Pasivo corriente", E.t.pc[0], "var(--serie2)"], ["Pasivo no corriente", E.t.pnc[0], "var(--serie5)"], ["Patrimonio", E.t.pat[0], "var(--serie4)"]]],
    ];
    let svg = `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img">`;
    filas.forEach(([nombre, partes], i) => {
      const yy = 14 + i * 50;
      svg += `<text x="${ml - 8}" y="${yy + 20}" text-anchor="end">${esc(nombre)}</text>`;
      let x = ml;
      for (const [n, v, col] of partes) {
        if (!v || v <= 0) continue;
        const w = (W - ml - mr) * (v / A);
        svg += `<rect x="${x}" y="${yy}" width="${Math.max(w - 1, 0)}" height="30" fill="${col}"><title>${esc(n)}: ${fmt(v)} (${pct(v / A)})</title></rect>`;
        if (w > 70) svg += `<text x="${x + 6}" y="${yy + 19}" style="fill:var(--hoja);font-weight:600">${pct(v / A)}</text>`;
        x += w;
      }
    });
    svg += "</svg>";
    const ley = `<div class="leyenda">${filas.flatMap(([, p]) => p).map(([n, , c]) => `<span><i style="background:${c}"></i>${esc(n)}</span>`).join("")}</div>`;
    return svg + ley;
  }

  /* ------------------------------------------------------------ vistas */
  function vistaVacia() {
    return `<section class="panel"><h2>Aún no hay meses cargados</h2><p class="sub">Cargue el archivo “Balance General por Centros de Costos” (.xls o .xlsx) exportado del software contable. La aplicación detecta el período, valida el archivo y lo guarda en el histórico.</p>
      <button class="btn primario" data-ir="cargar">Cargar el primer archivo</button></section>`;
  }

  function vistaInicio(D) {
    if (!D) return vistaVacia();
    const { E, R, V, ctx } = D;
    const crit = V.flatMap((c) => c.hallazgos).filter((h) => h.severidad === "critica" || h.severidad === "error");
    const adv = V.flatMap((c) => c.hallazgos).filter((h) => h.severidad === "advertencia");
    const ing = R.T.ingresos[0], neto = R.T.neto[0];
    const kp = (t, v, s) => `<div class="kpi"><span>${esc(t)}</span><b>${v}</b><small>${s}</small></div>`;
    let html = `<div class="kpis">
      ${kp("Ventas acumuladas", "$ " + fmt(ing), R.T.ingresos[2] != null ? `${ctx.anio - 1}: $ ${fmt(R.T.ingresos[2])} · ${pct(var_(ing, R.T.ingresos[2])[1])}` : `Mes: $ ${fmt(R.T.ingresos[1])}`)}
      ${kp("Resultado del período", "$ " + fmt(neto), R.T.neto[2] != null ? `${ctx.anio - 1}: $ ${fmt(R.T.neto[2])} · margen ${pct(ing ? neto / ing : null)}` : `Margen neto ${pct(ing ? neto / ing : null)}`)}
      ${kp("Margen bruto", pct(ing ? R.T.bruta[0] / ing : null), `Operacional ${pct(ing ? R.T.operacional[0] / ing : null)}`)}
      ${kp("Efectivo", "$ " + fmt(ctx.actual.get("11")), ctx.comp ? `31-dic: $ ${fmt(ctx.comp.get("11"))}` : "")}
      ${kp("Endeudamiento", pct(E.t.pasivo[0] / E.t.activo[0]), `Razón corriente ${dec(E.t.ac[0] / E.t.pc[0])}`)}
    </div>`;
    // Accesos a los módulos con su dato principal.
    const modulo = (dest, ico, titulo, valor, sub) => `<button class="modulo" data-nav="${dest}">${icono(ico)}<span class="m-t">${esc(titulo)}</span><b>${valor}</b><small>${sub}</small></button>`;
    let mods = "";
    try {
      const T = tableroAnual(S.periodo), totImp = T.ret.reduce((s, x) => s + (x.total || 0), 0) + T.iva.reduce((s, x) => s + (x.pagar || 0), 0) + T.ica.reduce((s, x) => s + (x.pagar || 0), 0);
      const pend = [...T.ret, ...T.iva, ...T.ica].filter((x) => !x.vacio && (x.declarado === "" || x.declarado == null)).length;
      mods += modulo("impuestos:res:anio", "impuestos", "Impuestos del año", "$ " + fmt(totImp), `retención, IVA e ICA calculados${pend ? ` · ${pend} sin declarar registrado` : ""}`);
    } catch { /* sin datos de impuestos */ }
    {
      const ps = [...S.bc.conc.values()].map((c) => c.periodo).sort();
      const ult = ps.at(-1);
      if (ult) {
        const ls = [...S.bc.conc.values()].filter((c) => c.periodo === ult);
        const dif = ls.filter((c) => Math.abs(c.saldos?.diferencia || 0) >= 1).length;
        mods += modulo("bancos:resumen", "bancos", "Conciliaciones bancarias", `${ls.length - dif} de ${ls.length} cuadradas`, `${mesTexto(ult)} · $ ${fmt(ls.reduce((s, c) => s + (c.porRegistrar?.debitos || 0), 0))} por registrar`);
      } else mods += modulo("bancos:cargar", "bancos", "Conciliaciones bancarias", "Sin cargar", "cargue el libro auxiliar y el extracto de cada cuenta");
    }
    const X = S.ter.get(S.periodo) ? datosTerceros(S.periodo) : null;
    if (X) {
      const t = (lado) => X.grupos[lado].reduce((s, g) => s + g.total, 0);
      mods += modulo("terceros:cxc", "cartera", "Nos deben", "$ " + fmt(t("cxc")), "clientes, cobro jurídico y otros deudores");
      mods += modulo("terceros:cxp", "cartera", "Debemos", "$ " + fmt(t("cxp")), "proveedores, bancos y otras cuentas");
    } else mods += modulo("cargar", "cartera", "Cartera y proveedores", "Sin cargar", `cargue el balance por tercero de ${esc(mesNombre(S.periodo))}`);
    mods += modulo("sede:lineal", "gestion", "Resultados por sede", pct(ing ? R.T.operacional[0] / ing : null), "margen operacional del año · ver cada sede mes a mes");
    html += `<div class="modulos">${mods}</div>`;
    if (crit.length || adv.length) html += `<div class="aviso ${crit.length ? "critica" : "advertencia"}"><p><b>${crit.length ? `${crit.length} hallazgo(s) crítico(s) o error(es)` : ""}${crit.length && adv.length ? " y " : ""}${adv.length ? `${adv.length} advertencia(s)` : ""}</b> en el archivo de ${esc(mesNombre(S.periodo))}. ${crit[0] ? esc(crit[0].mensaje.slice(0, 220)) + "… " : ""}<a href="#revision" data-ir="revision">Ver revisión</a></p></div>`;
    // Serie mensual del año.
    const [anio, mes] = anioMes(S.periodo);
    const cats = [], ventas = [], util = [], porSede = new Map();
    for (let m = 1; m <= mes; m++) {
      const p = `${anio}-${String(m).padStart(2, "0")}`;
      cats.push(MESES[m - 1].slice(0, 3));
      if (!S.hist.has(p)) { ventas.push(null); util.push(null); continue; }
      const c = Motor.contexto(S.hist, p, S.cfg), r = Motor.eri(c);
      ventas.push(r.T.ingresos[1]); util.push(r.T.neto[1]);
      const fnMes = c.sedes.mes;
      for (const cc of c.sedes.centros) {
        if (/VACIO/i.test(cc.codigo + cc.nombre)) continue;
        if (!porSede.has(cc.codigo)) porSede.set(cc.codigo, { nombre: nombreSede(cc), valores: new Array(mes).fill(null) });
        if (fnMes) porSede.get(cc.codigo).valores[m - 1] = -(fnMes("41", cc.codigo));
      }
    }
    const colores = ["var(--serie1)", "var(--serie2)", "var(--serie3)", "var(--serie5)", "var(--serie4)"];
    html += `<div class="dos">
      <section class="panel"><h2>Ventas y resultado por mes</h2><p class="sub">${anio}, ingresos operacionales netos y resultado de cada mes</p>
        ${barras({ categorias: cats, series: [{ nombre: "Ventas", color: "var(--serie1)", valores: ventas }, { nombre: "Resultado", color: "var(--serie2)", valores: util }] })}</section>
      <section class="panel"><h2>Ventas por sede</h2><p class="sub">Ingresos operacionales netos (grupo 41) de cada mes</p>
        ${porSede.size ? barras({ categorias: cats, series: [...porSede.values()].map((s, i) => ({ ...s, color: colores[i % colores.length] })) }) : '<p class="vacio">Sin datos por sede.</p>'}</section>
    </div>
    <section class="panel"><h2>Estructura del balance</h2><p class="sub">Al ${esc(fechaLarga(finDeMes(S.periodo)))}, como porcentaje del activo total</p>${estructura(E)}</section>`;
    if (mes > 1 && cats.length !== [...S.hist.keys()].filter((p) => p.startsWith(String(anio))).length)
      html += `<p class="pie">Los meses sin archivo aparecen vacíos en los gráficos.</p>`;
    return html;
  }

  function resumenControles(V) {

  }

    </details>`).join("")}</div>`;

  function vistaCargar() {

      </tbody></table></div>` : '<p class="vacio">Todavía no hay meses guardados.</p>'}</section>`;
    return html;
  }

  function vistaESF(D) {

    const separada = S.cfg.mapeo.some((r) => r.prefijo === "1399" && r.estado === "ESF");

  const vistaERI = (D) => (D ? modeloHTML(modeloERI(D)) : vistaVacia());
  function vistaSede(D) {

        <div class="fila">

          <select id="op-vacio" data-opcion="vacio"><option value="centro" ${o.vacio === "centro" ? "selected" : ""}>Asignar a ${esc(nombreSedeCod(o.vacioCentro || "1", D))}</option><option value="columna" ${o.vacio === "columna" ? "selected" : ""}>Columna aparte</option><option value="ingresos" ${o.vacio === "ingresos" ? "selected" : ""}>Prorratear por ingresos</option><option value="fijo" ${o.vacio === "fijo" ? "selected" : ""}>Prorratear con % fijos</option></select>

        </div></div>
        <p class="pie">Los % fijos, el centro origen y las cuentas de gastos corporativos se ajustan en <a href="#config" data-ir="config">Configuración</a>. Sedes: ${centros.map((c) => esc(nombreSede(c))).join(", ")}.</p></section>
      ${m ? modeloHTML(m) : vistaPyGLineal(D)}`;
  }
  /* ------------------------------------------------------------ PyG lineal mensualizado por sede (gerencial) */
  function datosPyG(D) {
    const P = Motor.pygLineal(S.hist, D.ctx.periodo, S.cfg);
    const meses = [...Array(P.mes).keys()].map((i) => i + 1);
    const vacia = () => Motor.lineaPyG(() => 0);
    const sedeMes = (X, cod, m) => { const mm = X.meses[m - 1]; if (!mm) return null; if (cod === "total") return [...mm.values()].reduce((a, b) => { for (const k of Object.keys(b)) a[k] = (a[k] || 0) + b[k]; return a; }, vacia()); return mm.get(cod) || vacia(); };
    const acum = (X, cod) => { const vs = meses.map((m) => (X ? sedeMes(X, cod, m) : null)).filter(Boolean); if (!vs.length) return null; return vs.reduce((a, b) => { const r = { ...a }; for (const k of Object.keys(b)) r[k] = (r[k] || 0) + b[k]; return r; }, vacia()); };
    const sedes = P.centros.map((c) => ({ cod: c.codigo, nombre: S.cfg.sedes[c.codigo] || (/VACIO/i.test(c.codigo + c.nombre) ? (S.cfg.nombreVacio || "No asignado") : c.nombre) }));
    const cods = [...sedes.map((s) => s.cod), "total"];
    const R = {};
    for (const cod of cods) {
      R[cod] = { mes: meses.map((m) => sedeMes(P, cod, m)), ant: meses.map((m) => (P.anterior ? sedeMes(P.anterior, cod, m) : null)), acum: acum(P, cod), acumAnt: acum(P.anterior, cod) };
      // El año anterior solo cuenta los meses que también existen este año (mismo período).
      const vs = meses.filter((m) => R[cod].mes[m - 1] && R[cod].ant[m - 1]).map((m) => R[cod].ant[m - 1]);
      R[cod].acumAntComparable = vs.length ? vs.reduce((a, b) => { const r = { ...a }; for (const k of Object.keys(b)) r[k] = (r[k] || 0) + b[k]; return r; }, vacia()) : null;
    }
    return { P, meses, sedes, R, anio: P.anio };
  }
  const nombreCod = (Y, cod) => (cod === "total" ? "Consolidado (todas las sedes)" : (Y.sedes.find((s) => s.cod === cod) || {}).nombre || cod);
  function modeloPyG(D, cod, Y = datosPyG(D)) {
    const X = Y.R[cod];
    if (!X) return null;
    const MES3 = Y.meses.map((m) => `${MESES[m - 1].slice(0, 3).replace(/^./, (c) => c.toUpperCase())} ${Y.anio}`);
    const cols = [{ t: "Concepto", tipo: "txt" }, ...MES3.map((t) => ({ t, tipo: "num" })), { t: `Acum. ${Y.anio}`, tipo: "num" }, { t: "% ventas", tipo: "pct" }, { t: `Acum. ${Y.anio - 1}`, tipo: "num" }, { t: "Var. %", tipo: "pct" }];
    const ac = X.acum || {}, aa = X.acumAntComparable;
    const ratio = (a, b) => (b ? a / b : null);
    const fila = (txt, k, tipo = "rubro", signo = 1) => ({ tipo, celdas: [txt, ...X.mes.map((v) => (v ? signo * v[k] : null)), signo * (ac[k] || 0), ratio(ac[k] || 0, ac.ventas), aa ? signo * aa[k] : null, aa && aa[k] ? ((ac[k] || 0) - aa[k]) / Math.abs(aa[k]) : null], sinNa: true });
    const filaPct = (txt, num, den) => ({ tipo: "rubro", formato: "pct", celdas: [txt, ...X.mes.map((v) => (v ? ratio(v[num], v[den]) : null)), ratio(ac[num] || 0, ac[den]), null, aa ? ratio(aa[num], aa[den]) : null, null], sinNa: true, cursiva: true });
    const filas = [
      { tipo: "seccion", celdas: ["INGRESOS"] },
      fila("Ventas brutas", "ventasBrutas"), fila("Devoluciones y descuentos", "devoluciones"),
      fila("VENTAS NETAS", "ventas", "total"),
      fila("Costo de ventas", "costo"),
      fila("UTILIDAD BRUTA", "bruta", "total"), filaPct("Margen bruto", "bruta", "ventas"),
      { tipo: "seccion", celdas: ["GASTOS OPERACIONALES"] },
      ...Y.P.grupos.map(([k, t]) => fila(t, k)).filter((f) => f.celdas.slice(1).some((v) => v && Math.abs(v) >= 1)),
      fila("Otros gastos operacionales", "otrosGastos"),
      fila("Total gastos operacionales", "gastosOp", "subtotal"), filaPct("Gastos op. / ventas", "gastosOp", "ventas"),
      fila("UTILIDAD OPERACIONAL", "operacional", "total"), filaPct("Margen operacional", "operacional", "ventas"),
      fila("EBITDA", "ebitda", "subtotal"), filaPct("Margen EBITDA", "ebitda", "ventas"),
      { tipo: "seccion", celdas: ["NO OPERACIONALES"] },

    const prevTot = (gr) => { if (!X.prev || !gr) return ""; const pv = X.prev.rows.filter((r) => r.cuenta.startsWith(gr.pref)).reduce((t, r) => t + r.ns, 0) * (gr.pref.startsWith("1") ? 1 : -1); const d = gr.total - pv; return ` · ${d >= 0 ? "sube" : "baja"} $ ${fmt(Math.abs(d))} vs mes anterior`; };
    let html = `<section class="panel"><div class="fila" style="justify-content:space-between"><h2>${lado === "cxc" ? "Lo que nos deben" : "Lo que debemos"} · ${esc(fechaLarga(finDeMes(p)))}</h2>

        ${juridico ? kpi("Cobro jurídico (1399)", juridico.total, `${juridico.items.length} deudores · ${totCxc ? pct(juridico.total / totCxc) : ""} de lo que nos deben`, "var(--error)") : ""}
        ${kpi("Otros deudores", otrosCxc, "anticipos, trabajadores y deudores varios")}

        ${bancos ? kpi("Obligaciones financieras", bancos.total, `${bancos.items.length} créditos y tarjetas${prevTot(bancos)}`) : ""}
        ${kpi("Otras cuentas por pagar", otrosCxp, "costos y gastos por pagar, acreedores")}

    // Hallazgos

      const sinAb = pos.filter((x) => x.abonos < 1 && x.saldo >= 1000000);

      const neg = clientes.items.filter((x) => x.saldo <= -1);

      if (sinPago.length) hall.push({ lado: "cxp", sev: "info", t: `${sinPago.length} proveedores con saldo mayor a $5 millones no recibieron pagos en el mes: ${sinPago.slice(0, 6).map((x) => `${esc(x.nombre)} ($${fmt(x.saldo)})`).join("; ")}.` });

    if (hallL.length) html += `<section class="panel"><h2>Para revisar con la gerencia</h2><ul class="hallazgos">${hallL.map((h) => `<li><span class="chip ${h.sev}">${{ error: "Atención", advertencia: "Alerta", info: "Revisar", ok: "Positivo" }[h.sev]}</span> ${h.t}</li>`).join("")}</ul></section>`;

    html += lado === "cxc" ? `<div class="dos">${top(clientes, "¿Quién nos debe más?")}${top(juridico, "Cobro jurídico")}</div>` : `<div class="dos">${top(prov, "¿A quién le debemos más?")}${top(bancos, "Obligaciones financieras")}</div>`;

  const vistaECP = (D) => (D ? modeloHTML(modeloECP(D)) : vistaVacia());

  /* ------------------------------------------------------------ notas a los estados financieros */
  function notaModelo(n, D) {
    const { ctx } = D;
    const fA = finDeMes(ctx.periodo), [, m] = anioMes(ctx.periodo);
    const titulo = (S.cfg.notasTitulo[n.nota] || n.titulo).toUpperCase();
    const total = n.total;
    let cols, filas, parrafo;
    if (n.estado === "ESF") {
      const fB = ctx.comp ? ctx.comp.fecha : null;
      cols = [{ t: "Concepto", tipo: "txt" }, { t: `Al ${fechaLarga(fA)}`, tipo: "num" }, { t: fB ? `Al ${fechaLarga(fB)}` : "Comparativo", tipo: "num" }, { t: "Variación", tipo: "num" }, { t: "Variación %", tipo: "pct" }];
      const fila = (nombre, v, tipo) => ({ tipo, celdas: [nombre, v[0], v[1], ...var_(v[0], v[1])] });
      filas = [...n.filas.map((f) => fila(f.nombre + (f.agrupadas ? ` (${f.agrupadas})` : ""), f.vals, "rubro")), fila(`TOTAL ${titulo}`, total, "gran")];
      const [dif, p] = var_(total[0], total[1]);
      parrafo = total[1] == null
        ? `Al ${fechaLarga(fA)}, el saldo asciende a $${fmt(total[0])}.`
        : `Al ${fechaLarga(fA)}, el saldo asciende a $${fmt(total[0])}, frente a $${fmt(total[1])} al ${fechaLarga(fB)}, lo que representa ${Math.abs(dif) < 0.5 ? "que no presenta variación" : `${dif > 0 ? "un aumento" : "una disminución"} de $${fmt(Math.abs(dif))}${p != null ? ` (${dec(Math.abs(p) * 100, 2)}%)` : ""}`}.`;
    } else {
      const ingOp = D.R.T.ingresos;
      cols = [{ t: "Concepto", tipo: "txt" }, { t: `Acumulado al ${fechaLarga(fA)}`, tipo: "num" }, { t: `Mes de ${MESES[m - 1]}`, tipo: "num" }, { t: "% del total", tipo: "pct" }, { t: "% de ingresos op.", tipo: "pct" }];
      const fila = (nombre, v, tipo) => ({ tipo, celdas: [nombre, v[0], v[1], total[0] ? v[0] / total[0] : null, ingOp[0] ? v[0] / ingOp[0] : null] });
      filas = [...n.filas.map((f) => fila(f.nombre + (f.agrupadas ? ` (${f.agrupadas})` : ""), f.vals, "rubro")), fila(`TOTAL ${titulo}`, total, "gran")];
      parrafo = `Del 1 de enero al ${fechaLarga(fA)}, el saldo acumulado asciende a $${fmt(total[0])}, equivalente al ${dec(ingOp[0] ? (total[0] / ingOp[0]) * 100 : 0, 2)}% de los ingresos operacionales.` +
        (total[1] != null ? ` En el mes de ${MESES[m - 1]} el valor registrado fue de $${fmt(total[1])}.` : "");
    }
    return { nota: n.nota, titulo, desc: S.cfg.notasDesc[n.nota] || "", cols, filas, parrafo, extra: S.cfg.notasTexto[n.nota] || "" };
  }
  function modelosNotas(D) { return Motor.notas(D.ctx, D.E, D.R).map((n) => notaModelo(n, D)); }
  const totalAcciones = () => (S.cfg.accionistas || []).reduce((s, a) => s + Number(a.acciones || 0), 0);

  function vistaNotas(D) {
    if (!D) return vistaVacia();
    const { ctx } = D;
    const fA = finDeMes(ctx.periodo);
    const m = { titulo: "Notas a los Estados Financieros", periodoTexto: `Al ${fechaLarga(fA)}${ctx.comp ? ` y ${fechaLarga(ctx.comp.fecha)}` : ""} – ${CIFRAS}` };
    const tabla = (nm) => `<div class="tabla-env"><table class="ef"><thead><tr>${nm.cols.map((c) => `<th>${esc(c.t)}</th>`).join("")}</tr></thead><tbody>${nm.filas.map((f) => `<tr class="${f.tipo}">${nm.cols.map((c, i) => celdaHTML(c, f.celdas[i], f)).join("")}</tr>`).join("")}</tbody></table></div>`;

      if (i === 1) html += `<div class="tabla-env"><table class="ef" style="min-width:420px"><thead><tr><th>Accionista</th><th>Acciones</th><th>Participación %</th></tr></thead><tbody>
        ${S.cfg.accionistas.map((a) => `<tr><td>${esc(a.nombre)}</td><td>${miles(Number(a.acciones || 0))}</td><td>${pct(tot ? a.acciones / tot : null)}</td></tr>`).join("")}

    }
    html += `<h4>Otras revelaciones</h4><h3>Nota 7. Hechos ocurridos después del período sobre el que se informa</h3><p>${esc(rellenar(S.cfg.hechosPosteriores, ctx))}</p>
      <h3>Nota 8. Aprobación de los estados financieros</h3><p>${esc(rellenar(S.cfg.aprobacion, ctx))}</p>${firmasHTML()}</section>`;
    return html;
  }
  function pdfNotas(doc, D) {
    const { ctx } = D;
    const fA = finDeMes(ctx.periodo);
    let y = pdfEncabezado(doc, { titulo: "Notas a los Estados Financieros", periodoTexto: `Al ${fechaLarga(fA)}${ctx.comp ? ` y ${fechaLarga(ctx.comp.fecha)}` : ""}` });
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), ML = 14, AN = W - 28;
    const espacio = (h) => { if (y + h > H - 18) { doc.addPage(); y = 20; } };
    const titulo = (t, sub) => {
      espacio(12);
      doc.setFont("helvetica", "bold"); doc.setFontSize(sub ? 8.6 : 9.4); doc.setTextColor(...(sub ? MARINO : CIAN));
      y += sub ? 4 : 6; doc.text(limpiarPDF(t), ML, y);
      if (!sub) { doc.setDrawColor(...CIAN); doc.setLineWidth(0.5); doc.line(ML, y + 1.5, W - ML, y + 1.5); y += 2; }
      doc.setTextColor(20); y += 4;
    };
    const parrafo = (t, cursiva) => {
      doc.setFont("helvetica", cursiva ? "italic" : "normal"); doc.setFontSize(8.2);
      for (const p of String(t).split("\n")) for (const ln of doc.splitTextToSize(limpiarPDF(p), AN)) { espacio(4); doc.text(ln, ML, y); y += 3.7; }
      y += 1.5;
    };
    const tabla = (nm) => {
      espacio(20);
      doc.autoTable({
        head: [nm.cols.map((c) => limpiarPDF(c.t))], body: nm.filas.map((f) => nm.cols.map((c, i) => celdaTexto(c, f.celdas[i], f))), startY: y, theme: "plain",
        margin: { left: ML, right: ML, bottom: 16 }, styles: { font: "helvetica", fontSize: 7.4, cellPadding: { top: 0.9, bottom: 0.9, left: 1.5, right: 1.5 }, textColor: 20 },
        headStyles: { fontStyle: "bold", fontSize: 6.9, textColor: MARINO, lineWidth: { bottom: 0.4 }, lineColor: MARINO },
        columnStyles: Object.fromEntries(nm.cols.map((c, i) => [i, { halign: c.tipo === "txt" ? "left" : "right", ...(i === 0 ? { cellWidth: AN * 0.42 } : {}) }])),

      parrafo(rellenar(n.texto, ctx));
      if (i === 1) {
        const tot = totalAcciones();
        tabla({ cols: [{ t: "Accionista", tipo: "txt" }, { t: "Acciones", tipo: "val" }, { t: "Participación %", tipo: "val" }],
          filas: [...S.cfg.accionistas.map((a) => ({ tipo: "rubro", celdas: [a.nombre, miles(Number(a.acciones || 0)), pct(tot ? a.acciones / tot : null)] })), { tipo: "gran", celdas: ["TOTAL", miles(tot), pct(tot ? 1 : null)] }] });
      }

  /* ------------------------------------------------------------ dictamen del revisor fiscal (NIA 700) */
  const TITULO_OPINION = { favorable: "Opinión", salvedades: "Opinión con salvedades", desfavorable: "Opinión desfavorable", abstencion: "Abstención de opinión" };
  function dictamenSecciones(D) {
    const { ctx, E } = D;
    const d = S.cfg.dictamen, e = S.cfg.empresa;
    const fc = fechaLarga(finDeMes(ctx.periodo));
    const v1399 = D.alerta1399 || 0;
    const relleno = (t) => rellenar(t, ctx).replace(/\{anio_anterior\}/g, String(ctx.anio - 1))
      .replace(/\{valor_1399\}/g, fmt(v1399)).replace(/\{pct_1399\}/g, pct(E.t.activo[0] ? v1399 / E.t.activo[0] : null));
    const tipo = d.tipoOpinion || "favorable";
    const estados = `el estado de situación financiera al ${fc}, el estado de resultado integral, el estado de cambios en el patrimonio y el estado de flujos de efectivo correspondientes al período comprendido entre el 1 de enero y el ${fc}, así como las notas explicativas, que incluyen un resumen de las políticas contables significativas`;
    const marco = "de conformidad con el marco técnico normativo para entidades del Grupo 2 – NIIF para las Pymes, contenido en el anexo 2 del Decreto Único Reglamentario 2420 de 2015 y sus modificatorios";
    const fundamentoTexto = relleno(d.fundamento) || "[Describa aquí el asunto que origina la modificación de la opinión y, cuando sea posible, cuantifique sus efectos sobre los estados financieros.]";
    const S_ = [];
    const opinion = tipo === "abstencion"
      ? [`Fui contratado para auditar los estados financieros de ${e.razon} (en adelante, la Compañía), que comprenden ${estados}.`,
        "No expreso una opinión sobre los estados financieros adjuntos de la Compañía. Debido a la significatividad del asunto descrito en la sección Fundamento de la abstención de opinión, no he podido obtener evidencia de auditoría suficiente y adecuada que proporcione una base para expresar una opinión de auditoría sobre estos estados financieros."]
      : [`He auditado los estados financieros de ${e.razon} (en adelante, la Compañía), que comprenden ${estados}.`,
        tipo === "favorable" ? `En mi opinión, los estados financieros adjuntos, tomados fielmente de los libros de contabilidad, presentan razonablemente, en todos los aspectos materiales, la situación financiera de la Compañía al ${fc}, así como sus resultados y sus flujos de efectivo correspondientes al período terminado en dicha fecha, ${marco}.`
        : tipo === "salvedades" ? `En mi opinión, excepto por los efectos del asunto descrito en la sección Fundamento de la opinión con salvedades, los estados financieros adjuntos, tomados fielmente de los libros de contabilidad, presentan razonablemente, en todos los aspectos materiales, la situación financiera de la Compañía al ${fc}, así como sus resultados y sus flujos de efectivo correspondientes al período terminado en dicha fecha, ${marco}.`
        : `En mi opinión, debido a la significatividad del asunto descrito en la sección Fundamento de la opinión desfavorable, los estados financieros adjuntos no presentan razonablemente la situación financiera de la Compañía al ${fc}, ni sus resultados y sus flujos de efectivo correspondientes al período terminado en dicha fecha, ${marco}.`];
    S_.push({ titulo: TITULO_OPINION[tipo], parrafos: opinion });
    const fundamento = [];

  async function leerPdfImpuestos(files) {
    S.impError = null;
    const errores = [], hechos = [];
    try {
      await asegurarLibreria("pdfjsLib", ["https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js", "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"]);
      // El visor no permite workers externos: se carga el "worker" en el mismo hilo.
      await asegurarLibreria("pdfjsWorker", ["https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js", "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js"]);
      if (!window.pdfjsLib) throw new Error("No se pudo cargar el lector de PDF. Recargue la página e intente de nuevo.");
    } catch (err) { S.impError = err.message || String(err); return render(); }
    let ultimoPeriodo = null;
    for (const file of files) {
      try {
        const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false }).promise;
        const paginas = [];
        for (let i = 1; i <= pdf.numPages; i++) {
          const tc = await (await pdf.getPage(i)).getTextContent();
          paginas.push(tc.items.map((it) => ({ str: it.str, x: it.transform[4], y: it.transform[5], w: it.width })));
        }
        const d = Impuestos.leerDeclaracion(paginas);
        if (d) {
          const doc = { ...d, R: Object.fromEntries(Object.entries(d.R).map(([k, v]) => [String(k), v])), archivo: file.name, cargado: new Date().toISOString() };
          if (S.db) await S.db.doc("declaraciones/" + d.clave).set(doc);
          S.decl.set(d.clave, doc);
          hechos.push(`${d.tipo === "ica" ? "ICA" : d.tipo} ${d.tipo === "350" ? MESES[d.periodo - 1] : "bim. " + d.periodo}`);
          continue;
        }
        const r = Impuestos.leerReporte(paginas, file.name);
        const periodo = r.periodo || S.periodo;
        r.cargado = new Date().toISOString();
        if (S.db) await S.db.doc("impuestos/" + periodo).set(impDoc(r));
        S.imp.set(periodo, impDeDoc(impDoc(r)));
        ultimoPeriodo = periodo;
        hechos.push(`retenciones de ${periodo} (${r.movimientos.length} movimientos)`);
      } catch (err) { console.error(err); errores.push(`${file.name}: ${err.message || err}`); }
    }
    if (ultimoPeriodo && S.hist.has(ultimoPeriodo) && files.length === 1) S.periodo = ultimoPeriodo;
    if (errores.length) S.impError = errores.join(" · ");
    if (hechos.length) toast(hechos.length > 3 ? `${hechos.length} archivos cargados.` : `Cargado: ${hechos.join(", ")}.`);
    render();
  }

  function asignar(obj, path, valor) {
    const partes = path.split(".");
    let o = obj;
    for (let i = 0; i < partes.length - 1; i++) {
      const k = partes[i];
      if (o[k] == null || typeof o[k] !== "object") o[k] = /^\d+$/.test(partes[i + 1]) ? [] : {};
      o = o[k];
    }
    o[partes.at(-1)] = valor;
  }
  function valorCampo(el, path) {
    if (path === "eriSede.corporativo.activo") return el.value === "true";
    if (path === "eriSede.corporativo.cuentas" || path === "impuestos.cuentasAutorret" || path === "impuestos.cuentasTrabajo") return el.value.split(/[,;\s]+/).map((x) => x.trim()).filter(Boolean);
    if (el.type === "number") return el.value === "" ? "" : Number(el.value);
    return el.value;
  }

  /* ------------------------------------------------------------ carga de archivo */
  /** Si la librería no cargó desde cdnjs, se intenta desde otros CDN permitidos. */
  async function asegurarLibreria(global, urls) {
    for (const url of urls) {
      if (window[global]) return;
      await new Promise((ok) => { const sc = document.createElement("script"); sc.src = url; sc.onload = ok; sc.onerror = ok; document.head.appendChild(sc); });
    }
  }
  async function leerArchivo(file) {
    S.errorCarga = null; S.confirmar = null;
    try {
      await asegurarLibreria("XLSX", ["https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js", "https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"]);
      if (!window.XLSX) throw new Error("No se pudo cargar el lector de Excel (bloqueado por la red). Recargue la página e intente de nuevo.");
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array" });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const filas = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: false });
      if (Motor.filaEncTerceros(filas) >= 0) { await guardarTerceros(Motor.interpretarTerceros(filas, file.name)); return; }
      const b = Motor.interpretar(filas, file.name);
      const V = Motor.validar(b, [...S.hist.keys()].filter((p) => p !== b.periodo), S.cfg.mapeo, { tolRedondeo: S.cfg.tolRedondeo });
      S.pendiente = { b, V };
    } catch (err) {
      S.pendiente = null;
      S.errorCarga = err instanceof Motor.ErrorLectura ? err.message : `No se pudo leer el archivo: ${err.message}`;
    }
    ir("cargar");
  }
  async function guardarTerceros(T) {
    const nitCfg = S.cfg.empresa.nit.replace(/\D/g, "").slice(0, 9), nitArch = (T.nit || "").replace(/\D/g, "").slice(0, 9);
    if (nitCfg && nitArch && nitCfg !== nitArch) throw new Error(`El NIT del archivo (${T.nit}) no coincide con el de la empresa (${S.cfg.empresa.nit}).`);
    const doc = { ...Motor.terADocumento(T), cargado: new Date().toISOString() };
    if (S.db) await S.db.doc("terceros/" + T.periodo).set(doc);
    S.ter.set(T.periodo, Motor.terDeDocumento(doc));
    if (S.hist.has(T.periodo)) S.periodo = T.periodo;
    toast(`Saldos por tercero de ${mesNombre(T.periodo)} ${T.periodo.slice(0, 4)} guardados (${T.rows.length} terceros).`);
    S.tab = "terceros"; try { history.replaceState(null, "", "#terceros"); } catch { /* */ }
    render();
  }
  async function guardarPendiente() {
    const { b } = S.pendiente;

      try { await S.db.doc("meses/" + b.periodo).set({ ...Motor.aDocumento(b), cargado: b.cargado }); }

  /* ------------------------------------------------------------ exportación */
  const MARINO = [32, 56, 110], CIAN = [31, 159, 182], FONDO = [231, 238, 248];
  const limpiarPDF = (s) => String(s ?? "").replace(/−/g, "-").replace(/[≥]/g, ">=").replace(/[≤]/g, "<=").replace(/→/g, "->");
  const SEMAFORO_RGB = { verde: [29, 122, 75], amarillo: [214, 140, 20], rojo: [180, 35, 24] };
  const SEMAFORO_TXT = { verde: "Verde", amarillo: "Amarillo", rojo: "Rojo" };
  function celdaTexto(col, v, fila) {
    const tipo = fila.formato === "pct" && col.tipo === "num" ? "pct" : col.tipo;
    if (tipo === "sem") return v ? SEMAFORO_TXT[v] : "-";
    if (v == null && fila.sinNa) return "";
    if (tipo === "pct") return pct(v);
    if (tipo === "num") return fmt(v);
    return limpiarPDF(v);
  }
  function pdfEncabezado(doc, m) {
    const W = doc.internal.pageSize.getWidth();
    const e = S.cfg.empresa;
    try { doc.addImage($("#t-logo").src, "PNG", W / 2 - 14, 7, 28, 14.3); } catch { /* sin logo */ }
    let y = 26;
    doc.setTextColor(...MARINO);
    doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.text(limpiarPDF(e.razon), W / 2, y, { align: "center" });
    doc.setTextColor(20);
    doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.text(`NIT. ${e.nit}`, W / 2, (y += 4.5), { align: "center" });
    doc.setTextColor(...CIAN); doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.text(limpiarPDF(m.titulo.toUpperCase()), W / 2, (y += 5.5), { align: "center" }); doc.setTextColor(20);
    doc.setFont("helvetica", "normal"); doc.setFontSize(7.2);
    for (const ln of doc.splitTextToSize(NIIF, W - 40)) doc.text(ln, W / 2, (y += 3.8), { align: "center" });
    doc.text(CIFRAS, W / 2, (y += 3.8), { align: "center" });
    doc.setFont("helvetica", "bold"); doc.setFontSize(8.5); doc.text(limpiarPDF(m.periodoTexto), W / 2, (y += 4.5), { align: "center" });
    return y + 5;
  }
  const ALTO_FIRMAS = 56; // mm que ocupa el bloque de tres firmas
  function pdfFirmas(doc, y) {
    const W = doc.internal.pageSize.getWidth();
    y += 16;
    const f = firmantes();
    const bloque = (x, p) => {
      doc.setDrawColor(40); doc.setLineWidth(0.25); doc.line(x - 32, y, x + 32, y);
      doc.setFont("helvetica", "bold"); doc.setFontSize(8); doc.setTextColor(20); doc.text(limpiarPDF(p.nombre), x, y + 4, { align: "center" });
      doc.setFont("helvetica", "normal"); doc.text(limpiarPDF(p.cargo), x, y + 8, { align: "center" });
      if (p.tp) doc.text(limpiarPDF(p.tp), x, y + 12, { align: "center" });
    };
    // Si las firmas en dos renglones no caben, van las tres en un solo renglón.
    if (y + 40 > doc.internal.pageSize.getHeight() - 12 && f.length === 3) {
      [0.18, 0.5, 0.82].forEach((p, i) => bloque(W * p, f[i]));
      return;
    }
    if (f[0]) bloque(W * 0.28, f[0]);
    if (f[1]) bloque(W * 0.72, f[1]);
    if (f[2]) { y += 26; bloque(W / 2, f[2]); }
  }
  /**
   * Dibuja un estado. Las firmas nunca quedan solas en una hoja: si no caben debajo
   * de la tabla, se rehace el estado pasando las últimas filas a la hoja siguiente
   * para que acompañen a las firmas. Cada hoja lleva el encabezado completo.
   */
  function pdfModelo(doc, m) {
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
    const apaisado = W > H;
    if (m.error) { const y = pdfEncabezado(doc, m); doc.setFontSize(9); doc.text(doc.splitTextToSize(limpiarPDF(m.error), W - 30), 15, y + 4); return; }
    const head = [m.cols.map((c) => limpiarPDF(c.t))];
    const filaPDF = (f) => (f.tipo === "seccion"
      ? [{ content: limpiarPDF(f.celdas[0] + (f.celdas[1] ? `   (Nota ${f.celdas[1]})` : "")), colSpan: m.cols.length }]
      : m.cols.map((c, i) => celdaTexto(c, f.celdas[i], f)));
    const anchos = {};
    m.cols.forEach((c, i) => { anchos[i] = { halign: c.tipo === "txt" || c.tipo === "txt2" || c.tipo === "sem" ? "left" : c.tipo === "nota" ? "center" : "right" }; });
    if (m.clave === "ind") { anchos[0].cellWidth = 46; anchos[3].cellWidth = 22; anchos[4].cellWidth = 70; }
    let pos = [];
    // nivel 0 = normal; 1 y 2 = más compacto (para que tabla y firmas quepan juntas).
    const ESCALAS = [{ fs: 7.8, pad: 1, sec: 2.5 }, { fs: 7.4, pad: 0.65, sec: 1.6 }, { fs: 7, pad: 0.45, sec: 1.2 }, { fs: 6.8, pad: 0.3, sec: 0.9 }];
    const tabla = (filas, y, nivel) => {
      pos = [];
      const e = ESCALAS[nivel], fs = m.cols.length > 6 ? e.fs - 1 : e.fs;
      doc.autoTable({
        head, body: filas.map(filaPDF), startY: y, theme: "plain", margin: { left: 14, right: 14, bottom: 16, top: 60 },
        styles: { font: "helvetica", fontSize: fs, cellPadding: { top: e.pad, bottom: e.pad, left: 1.5, right: 1.5 }, textColor: 20, overflow: "linebreak" },
        headStyles: { fontStyle: "bold", fontSize: fs - 0.6, valign: "bottom", textColor: MARINO, lineWidth: { bottom: 0.5 }, lineColor: MARINO },
        columnStyles: anchos, rowPageBreak: "avoid",
        didDrawPage: (d) => { if (d.pageNumber > 1) pdfEncabezado(doc, m); },
        didDrawCell: (d) => {
          if (d.section === "body" && d.column.index === 0) pos[d.row.index] = { hoja: doc.internal.getCurrentPageInfo().pageNumber, alto: d.cell.height };
          // Semáforo: círculo de color a la izquierda del texto.
          if (d.section === "body" && m.cols[d.column.index]?.tipo === "sem") {
            const v = filas[d.row.index]?.celdas[d.column.index];
            if (SEMAFORO_RGB[v]) { doc.setFillColor(...SEMAFORO_RGB[v]); doc.circle(d.cell.x + 2.6, d.cell.y + d.cell.height / 2, 1.3, "F"); }
          }
        },
        didParseCell: (h) => {
          if (h.section === "head") { h.cell.styles.halign = anchos[h.column.index]?.halign || "left"; return; }
          const f = filas[h.row.index];
          if (!f) return;
          if (f.tipo === "seccion") { h.cell.styles.fontStyle = "bold"; h.cell.styles.textColor = MARINO; h.cell.styles.cellPadding = { top: e.sec, bottom: e.pad, left: 1.5, right: 1.5 }; }
          if (["subtotal", "total", "gran"].includes(f.tipo)) h.cell.styles.fontStyle = "bold";
          if (f.tipo === "total" || f.tipo === "gran") { h.cell.styles.lineWidth = { top: 0.25 }; h.cell.styles.lineColor = 60; }
          if (f.tipo === "gran") { h.cell.styles.fillColor = FONDO; h.cell.styles.textColor = MARINO; h.cell.styles.lineColor = MARINO; }
          if (f.tipo === "rubro" && h.column.index === 0) h.cell.styles.cellPadding = { top: e.pad, bottom: e.pad, left: 4, right: 1.5 };
          if (f.alerta) h.cell.styles.fillColor = [251, 233, 231];
          if (m.cols[h.column.index]?.tipo === "sem" && SEMAFORO_RGB[f.celdas[h.column.index]]) {
            h.cell.styles.textColor = SEMAFORO_RGB[f.celdas[h.column.index]];
            h.cell.styles.fontStyle = "bold";
            h.cell.styles.cellPadding = { ...(typeof h.cell.styles.cellPadding === "object" ? h.cell.styles.cellPadding : {}), left: 5.2 };
          }
        },
      });
      return doc.lastAutoTable.finalY;
    };
    const pieLineas = () => { doc.setFont("helvetica", "normal"); doc.setFontSize(7); return m.pie.flatMap((p) => doc.splitTextToSize(limpiarPDF(p), W - 28)); };
    const escribirPie = (y) => { const ls = pieLineas(); doc.setFont("helvetica", "normal"); doc.setFontSize(7); doc.setTextColor(20); for (const ln of ls) { doc.text(ln, 14, y); y += 3.4; } return y; };
    const altoPie = () => pieLineas().length * 3.4;
    const inicio = doc.getNumberOfPages();
    const orient = apaisado ? "landscape" : "portrait";
    const dibujar = (corte, nivel) => {
      let y = tabla(corte == null ? m.filas : m.filas.slice(0, corte), pdfEncabezado(doc, m), nivel);
      if (corte != null) { doc.addPage("letter", orient); y = tabla(m.filas.slice(corte), pdfEncabezado(doc, m), nivel); }
      return y + 4;
    };
    // Borra las hojas de este estado y deja una hoja nueva en blanco para redibujarlo.
    const reiniciar = () => {
      while (doc.getNumberOfPages() > inicio) doc.deletePage(doc.getNumberOfPages());
      doc.addPage("letter", orient);
      doc.deletePage(inicio);
      doc.setPage(doc.getNumberOfPages());
    };
    const necesario = altoPie() + (m.firmas ? ALTO_FIRMAS : 0);
    const cabe = (y) => y + necesario <= H - 14;
    let nivel = 0;
    let y = dibujar(null, nivel);
    while (!cabe(y) && nivel < ESCALAS.length - 1) { reiniciar(); nivel++; y = dibujar(null, nivel); }
    if (!cabe(y)) {
      // Ni compacto cabe: pasan a la hoja siguiente unas filas finales para acompañar las firmas.
      const n = m.filas.length;
      const hojas = pos.filter(Boolean).map((p) => p.hoja);
      const ultima = Math.max(...hojas), primera = Math.min(...hojas);

    return { ...(BC.cfg.opciones || {}), tasas: BC.cfg.tasas || {}, ajusteMax: BC.cfg.tarjetas?.ajusteMax ?? Bancos.TARJ_DEF.ajusteMax, nitBanco: cc.nitBanco || (c && NOMBRE_BANCO_NIT[c.banco]) || "", pasarelas: c ? pasarelasPara(c.periodo) : [] };
  }
  /* ---------- reporte de transacciones de Bold (datáfono y links de pago) */
  const pasCache = new Map();
  function pasarelaDoc(id) {
    const d = BC.pas.get(id); if (!d) return null;
    const k = id + "|" + (d.actualizado || "");
    if (!pasCache.has(k)) pasCache.set(k, Bancos.pasarelaDeDoc(d));
    return pasCache.get(k);
  }
  /** Ventas de Bold del mes y del mes anterior (las del día 30 se abonan el mes siguiente). */
  function pasarelasPara(periodo) {
    const ps = new Set([periodo, mesAnterior(periodo)]);
    const vistos = new Set(), out = [];
    for (const [id, d] of BC.pas) if (ps.has(d.periodo)) for (const t of pasarelaDoc(id)?.txns || []) if (!vistos.has(t.id)) { vistos.add(t.id); out.push(t); }
    return out;
  }
  const verPas = () => [...BC.pas.values()].map((d) => d.periodo + d.actualizado).sort().join(",");
  async function guardarPasarela(r) {
    const id = `${r.pasarela.toLowerCase()}_${r.periodo}`;
    const doc = { ...Bancos.pasarelaADoc(r), actualizado: new Date().toISOString() };
    BC.pas.set(id, doc);
    if (S.db) await S.db.doc("concPasarela/" + id).set(doc);
    await recalcularPeriodos([r.periodo, mesSiguiente(r.periodo)]);
    toast(`Reporte de Bold de ${mesTexto(r.periodo)} guardado: ${r.txns.length} ventas, neto $ ${fmtC(r.totales.neto)}.`);
  }
  async function borrarPasarela(id) {
    const d = BC.pas.get(id); if (!d) return;
    BC.pas.delete(id);
    if (S.db) { try { await S.db.doc("concPasarela/" + id).delete(); } catch (err) { toast(`No se pudo eliminar: ${err.message || err.code}`); } }
    await recalcularPeriodos([d.periodo, mesSiguiente(d.periodo)]);
    toast("Reporte de Bold eliminado."); render();
  }
  /** Recalcula y guarda el resumen de las conciliaciones de esos meses (por ejemplo, al cargar el reporte de Bold). */
  async function recalcularPeriodos(periodos) {
    for (const c of [...BC.conc.values()].filter((x) => periodos.includes(x.periodo))) {
      const id = idConc(c.cuenta, c.periodo);
      if (!BC.datos.has(id) && !(await datosConc(id))) continue;
      const nuevo = { ...c, actualizado: new Date().toISOString() };
      BC.conc.set(id, nuevo);
      Object.assign(nuevo, resumenDoc(resolver(id)));
      if (S.db) { try { await S.db.doc("conciliaciones/" + id).set(nuevo); } catch (err) { console.error(err); } }
    }
  }

  /* ---------- datos guardados de una conciliación (libro + extracto), con caché */
  async function datosConc(id) {
    if (BC.datos.has(id)) return BC.datos.get(id);
    if (!S.db) return null;
    const leer = async (col) => {
      const s = await S.db.doc(`${col}/${id}`).get();
      if (!s.exists) return null;
      const d = { ...s.data() };
      if (d.partes > 1) for (let i = 2; i <= d.partes; i++) { const p = await S.db.doc(`${col}/${id}~${i}`).get(); if (p.exists) d.filas = d.filas.concat(p.data().filas || []); }
      return d;
    };
    const [l, b] = await Promise.all([leer("concLibro"), leer("concBanco")]);
    if (!l || !b) return null;
    const x = { libro: Bancos.libroDeDoc(l), extracto: Bancos.extractoDeDoc(b) };
    BC.datos.set(id, x);
    return x;
  }
  async function guardarGrande(col, id, doc) {
    const filas = doc.filas || [], TAM = 1400;
    const partes = Math.max(1, Math.ceil(filas.length / TAM));
    await S.db.doc(`${col}/${id}`).set({ ...doc, filas: filas.slice(0, TAM), partes });
    for (let i = 2; i <= partes; i++) await S.db.doc(`${col}/${id}~${i}`).set({ filas: filas.slice((i - 1) * TAM, i * TAM) });
  }

  /** Recalcula la conciliación de una cuenta y período con lo guardado. */
  function resolver(id) {
    const c = BC.conc.get(id), x = BC.datos.get(id);
    if (!c || !x) return null;
    const ant = BC.conc.get(idConc(c.cuenta, mesAnterior(c.periodo)));
    const previo = ant && ant.pendientes ? ant.pendientes : null;
    const libro = { ...x.libro, desde: x.libro.desde };
    const R = Bancos.conciliar(libro, x.extracto, previo, opcionesBC(c), c.manual || {});
    const cc = cfgCuenta(c.cuenta);
    const CB = Bancos.comprobantes(R, { codigo: c.cuenta, nombre: x.libro.nombre }, { ctas: BC.cfg.ctas, tarjetas: BC.cfg.tarjetas, nitBold: BC.cfg.nitBold || "", nitBanco: cc.nitBanco || NOMBRE_BANCO_NIT[x.extracto.banco] || "", nombreBanco: x.extracto.banco, centro: cc.centro || "", fecha: Bancos.finDeMes(c.periodo), agrupar: BC.cfg.agrupar !== false });
    return { c, x, R, CB, G: Bancos.gastosBancarios(R), previo: Boolean(previo), ant };
  }
  const memo = { id: null, ver: null, val: null };
  function resueltoActual() {
    const id = BC.sel; if (!id) return null;
    const c = BC.conc.get(id), x = BC.datos.get(id);
    const ant = c && BC.conc.get(idConc(c.cuenta, mesAnterior(c.periodo)));
    const ver = JSON.stringify([c?.manual, c?.actualizado, ant?.actualizado, Boolean(x), BC.cfg, verPas()]);
    if (memo.id === id && memo.ver === ver) return memo.val;
    memo.id = id; memo.ver = ver; memo.val = resolver(id);
    return memo.val;
  }

  /* ---------- carga de archivos */
  async function leerArchivosBancos(files, quedarse = false) {
    BC.error = null;
    const errores = [];
    for (const file of files) {
      try {
        let r;
        if (/\.pdf$/i.test(file.name)) {
          await asegurarLibreria("pdfjsLib", ["https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js", "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"]);
          await asegurarLibreria("pdfjsWorker", ["https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js", "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js"]);
          if (!window.pdfjsLib) throw new Error("No se pudo cargar el lector de PDF. Recargue la página e intente de nuevo.");
          BC.ocupado = `Leyendo ${file.name}…`; render();
          const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false }).promise;
          const paginas = [];
          for (let i = 1; i <= pdf.numPages; i++) {
            const tc = await (await pdf.getPage(i)).getTextContent();
            paginas.push(tc.items.map((it) => ({ str: it.str, x: it.transform[4], y: it.transform[5], w: it.width })));
          }
          r = Bancos.leerPDF(paginas, file.name);
        } else {
          await asegurarLibreria("XLSX", ["https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js", "https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"]);
          if (!window.XLSX) throw new Error("No se pudo cargar el lector de Excel.");
          const wb = XLSX.read(await file.arrayBuffer(), { type: "array", cellDates: true });
          const filas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: null, blankrows: false });
          r = Bancos.leerTabla(filas, file.name);
        }
        if (r.tipo === "pasarela") { BC.ocupado = `Guardando el reporte de ${r.pasarela}…`; render(); await guardarPasarela(r); if (r.avisos.length) errores.push(`${file.name}: ${r.avisos.slice(0, 3).join(" ")}`); continue; }
        if (r.tipo === "auxiliar") for (const k of r.cuentas) BC.cola.push({ tipo: "libro", archivo: file.name, k: { ...k, desde: r.desde, hasta: r.hasta }, meta: { desde: r.desde, hasta: r.hasta, archivo: file.name, fuente: r.fuente } });
        else BC.cola.push({ tipo: "extracto", archivo: file.name, e: r });
      } catch (err) { console.error(err); errores.push(`${file.name}: ${err.message || err}`); }
    }
    BC.ocupado = "";
    if (errores.length) BC.error = errores.join(" · ");
    emparejar();
    if (!quedarse) BC.vista = "cargar";
    render();
  }
  /** Propone qué libro va con qué extracto (número de cuenta configurado, número en el nombre del archivo, saldo inicial, banco). */
  function emparejar() {
    const libros = BC.cola.filter((q) => q.tipo === "libro"), exts = BC.cola.filter((q) => q.tipo === "extracto");
    const usados = new Set();
    const pares = [];
    for (const q of exts) {
      const e = q.e;
      let mejor = null, pm = -1;
      for (const l of libros) {
        const k = l.k, cc = cfgCuenta(k.cuenta);
        let p = 0;
        if (cc.numero && String(cc.numero).replace(/\D/g, "") === e.cuenta) p += 50;
        if (e.cuenta && l.archivo.replace(/\D/g, " ").split(/\s+/).includes(e.cuenta)) p += 30;
        if (Math.abs((k.saldoAnterior || 0) - (e.saldoInicial || 0)) < 0.01) p += 15;
        const nb = Bancos.norm(k.nombre), bn = Bancos.norm(e.banco).replace("BANCO DE ", "");
        if (nb.includes(bn.split(" ")[0])) p += 8;
        if ((e.tipoCta === "Corriente") === /CORRIENTE/.test(nb)) p += 3;
        if (k.hasta && e.hasta && k.hasta.slice(0, 7) === e.hasta.slice(0, 7)) p += 2;
        if (usados.has(l)) p -= 40;
        if (p > pm) { pm = p; mejor = l; }
      }
      if (mejor && pm >= 8) { usados.add(mejor); pares.push({ l: mejor, e: q }); q.libro = mejor; }
    }
    BC.pares = pares;
  }
  async function conciliarCola(iE) {
    const q = BC.cola.filter((x) => x.tipo === "extracto")[iE];
    if (!q || !q.libro) return;
    const l = q.libro, k = l.k, e = q.e;
    if (!k.cuenta) { // libro en Excel sin código de cuenta: se toma la cuenta configurada para ese número bancario
      const cod = Object.entries(BC.cfg.cuentas || {}).find(([, x]) => x.numero && String(x.numero).replace(/\D/g, "") === e.cuenta)?.[0];
      if (!cod) { toast("El libro auxiliar no trae el código de la cuenta. Configúrelo en Parámetros → Cuentas bancarias con el número de cuenta del banco."); return; }
      k.cuenta = cod; if (/\.(xlsx?|csv)$/i.test(k.nombre)) k.nombre = BC.cfg.cuentas[cod].nombre || k.nombre;
    }
    const periodo = (e.hasta || k.hasta).slice(0, 7);
    const id = idConc(k.cuenta, periodo);
    const existe = BC.conc.get(id);
    const doc = {
      cuenta: k.cuenta, nombre: k.nombre, banco: e.banco, numero: e.cuenta, tipoCta: e.tipoCta || "", periodo, desde: e.desde, hasta: e.hasta,
      archivoLibro: l.archivo, archivoBanco: q.archivo, manual: existe?.manual || { cruces: [], deshacer: [], anteriores: [] }, actualizado: new Date().toISOString(),
    };
    BC.ocupado = "Conciliando…"; render();
    try {
      const libroDoc = Bancos.libroADoc(k, l.meta), extDoc = Bancos.extractoADoc(e, { archivo: q.archivo });
      BC.datos.set(id, { libro: Bancos.libroDeDoc(libroDoc), extracto: Bancos.extractoDeDoc(extDoc) });
      BC.conc.set(id, doc);
      const z = resolver(id);
      Object.assign(doc, resumenDoc(z));
      if (S.db) {
        await guardarGrande("concLibro", id, libroDoc);
        await guardarGrande("concBanco", id, extDoc);
        await S.db.doc("conciliaciones/" + id).set(doc);
        // Aprende la relación cuenta contable ↔ número de cuenta bancaria
        const cc = cfgCuenta(k.cuenta);
        if (!cc.numero || !cc.banco) {
          const n = clon(BC.cfg); n.cuentas = n.cuentas || {};
          n.cuentas[k.cuenta] = { ...cc, nombre: k.nombre, banco: cc.banco || e.banco, numero: cc.numero || e.cuenta, nitBanco: cc.nitBanco || NOMBRE_BANCO_NIT[e.banco] || "", centro: cc.centro ?? "" };
          await S.db.doc("config/bancos").set(n); BC.cfg = n;
        }
      }
      BC.cola = BC.cola.filter((x) => x !== q && x !== l);
      emparejar();
      BC.sel = id; BC.vista = "detalle"; BC.tab = "formato"; BC.periodo = periodo; BC.marcados.clear();
      toast(`${k.nombre}: conciliación de ${mesTexto(periodo)} guardada.`);
    } catch (err) {
      console.error(err);
      toast(err.code === "quota_exceeded" ? "No hay espacio en la base de datos. Elimine conciliaciones antiguas." : `No se pudo guardar: ${err.message || err.code}`);
    }
    BC.ocupado = ""; render();
  }
  /** Reemplaza el libro auxiliar de una conciliación guardada (por ejemplo, después de registrar los gastos) y la recalcula con el mismo extracto. */
  async function actualizarLibro(id, l) {
    const c = BC.conc.get(id); if (!c) return;
    const x = BC.datos.get(id) || await datosConc(id);
    if (!x) { toast("No se encontró el extracto guardado de esta conciliación. Cargue libro y extracto juntos."); return; }
    if (l.k.cuenta && l.k.cuenta !== c.cuenta) { toast(`El libro es de la cuenta ${l.k.cuenta}, no de la ${c.cuenta}.`); return; }
    const antesZ = resolver(id);
    const antes = { nb: antesZ ? antesZ.R.pendientes.ncNoRegistradas.length + antesZ.R.pendientes.ndNoRegistradas.length : 0, porReg: antesZ ? antesZ.CB.debitos : 0, libros: antesZ ? antesZ.R.saldos.libros : 0 };
    // Los cruces manuales apuntan a renglones del libro: se reubican por fecha, documento y valor.
    const firma = (m) => [m.fecha, m.doc, Math.round((m.debito - m.credito) * 100)].join("|");
    const viejos = x.libro.movimientos.map(firma), nuevosF = l.k.movimientos.map(firma);
    const usados = new Set(), mapa = {};
    viejos.forEach((f, i) => { const j = nuevosF.findIndex((g, k) => g === f && !usados.has(k)); if (j >= 0) { usados.add(j); mapa["L" + i] = "L" + j; } });
    const remap = (idL) => (/^L\d+$/.test(idL) ? mapa[idL] || null : idL);
    const m = clon(c.manual || { cruces: [], deshacer: [], anteriores: [] });
    m.cruces = (m.cruces || []).map(([ls, bs]) => [ls.map(remap), bs]).filter(([ls]) => ls.every(Boolean));
    m.deshacer = (m.deshacer || []).map((k) => { const p = k.split(","); return p.map((t) => (t === "|" ? t : remap(t))).every(Boolean) ? p.map((t) => (t === "|" ? t : remap(t))).join(",") : null; }).filter(Boolean);
    BC.ocupado = "Actualizando la conciliación…"; render();
    try {
      const libroDoc = Bancos.libroADoc(l.k, l.meta);
      BC.datos.set(id, { libro: Bancos.libroDeDoc(libroDoc), extracto: x.extracto });
      const nuevo = { ...c, manual: m, archivoLibro: l.archivo, actualizado: new Date().toISOString() };
      BC.conc.set(id, nuevo);
      Object.assign(nuevo, resumenDoc(resolver(id)));
      if (S.db) {
        const s0 = await S.db.doc(`concLibro/${id}`).get();
        const partesViejas = s0.exists ? s0.data().partes || 1 : 1;
        await guardarGrande("concLibro", id, libroDoc);
        const partes = Math.max(1, Math.ceil((libroDoc.filas || []).length / 1400));
        for (let i = partes + 1; i <= partesViejas; i++) await S.db.doc(`concLibro/${id}~${i}`).delete();
        await S.db.doc("conciliaciones/" + id).set(nuevo);
      }
      BC.cola = BC.cola.filter((q) => q !== l); emparejar();
      BC.ultimaAct = { id, archivo: l.archivo, antes };
      BC.sel = id; BC.vista = "detalle"; BC.tab = "formato"; BC.marcados.clear();
      toast("Libro auxiliar actualizado y conciliación recalculada.");
    } catch (err) { console.error(err); toast(`No se pudo guardar: ${err.message || err.code}`); }
    BC.ocupado = ""; render(); window.scrollTo({ top: 0 });
  }
  async function leerLibroParaActualizar(file) {
    const antes = BC.cola.length;
    await leerArchivosBancos([file], true);
    const nuevos = BC.cola.slice(antes).filter((q) => q.tipo === "libro");
    const c = BC.conc.get(BC.sel);
    const l = nuevos.find((q) => q.k.cuenta === c?.cuenta) || (nuevos.length === 1 ? nuevos[0] : null);
    if (!l) { BC.vista = "detalle"; if (!BC.error) BC.error = `${file.name}: no es el libro auxiliar de la cuenta ${c?.cuenta || ""}.`; render(); return; }
    await actualizarLibro(BC.sel, l);
  }

  /** Lo que se guarda en el documento de la conciliación para el resumen y para el mes siguiente. */
  function resumenDoc(z) {
    if (!z) return {};
    const { R, CB } = z;
    return {
      saldos: R.saldos, resumen: R.resumen,
      pendientes: Bancos.pendientesParaSiguiente(R),
      conteo: { transito: R.pendientes.consignacionesTransito.length, egresos: R.pendientes.egresosPendientes.length, nc: R.pendientes.ncNoRegistradas.length, nd: R.pendientes.ndNoRegistradas.length },
      porRegistrar: { debitos: CB.debitos, efectoBanco: CB.efectoBanco, lineas: CB.lineas.length, revisar: CB.lineas.filter((l) => l.revisar).length },
      gastos: { total: z.G.totalCargos, tarjetas: z.G.descTarj, pendiente: z.G.pendienteCargos, intereses: z.G.intereses?.total || 0, interesesPend: z.G.intereses?.pendiente || 0, tarjetasPend: z.G.descTarjPend, completo: z.G.completo },
    };
  }
  async function guardarManual(id, cambiar) {
    const c = BC.conc.get(id); if (!c) return;
    const m = clon(c.manual || { cruces: [], deshacer: [], anteriores: [] });
    m.cruces = m.cruces || []; m.deshacer = m.deshacer || []; m.anteriores = m.anteriores || [];
    cambiar(m);
    const nuevo = { ...c, manual: m, actualizado: new Date().toISOString() };
    BC.conc.set(id, nuevo);
    const z = resolver(id);
    Object.assign(nuevo, resumenDoc(z));
    BC.marcados.clear();
    render();
    if (S.db) { try { await S.db.doc("conciliaciones/" + id).set(nuevo); } catch (err) { toast(`No se pudo guardar: ${err.message || err.code}`); } }
  }
  async function borrarConc(id) {
    BC.confirmar = null;
    if (S.db) {
      try {
        for (const col of ["concLibro", "concBanco"]) {
          const s = await S.db.doc(`${col}/${id}`).get();
          const partes = s.exists ? s.data().partes || 1 : 1;
          await S.db.doc(`${col}/${id}`).delete();
          for (let i = 2; i <= partes; i++) await S.db.doc(`${col}/${id}~${i}`).delete();
        }
        await S.db.doc("conciliaciones/" + id).delete();
      } catch (err) { toast(`No se pudo eliminar: ${err.message || err.code}`); return; }
    }
    BC.conc.delete(id); BC.datos.delete(id);
    if (BC.sel === id) { BC.sel = null; BC.vista = "resumen"; }
    toast("Conciliación eliminada."); render();
  }

  /* ---------- vistas */
  function periodosBC() { return [...new Set([...BC.conc.values()].map((c) => c.periodo))].sort().reverse(); }
  function vistaBancos() {
    if (!BC.periodo || !periodosBC().includes(BC.periodo)) BC.periodo = periodosBC()[0] || null;
    let html = "";
    if (BC.ocupado) html += `<div class="aviso info"><p>${esc(BC.ocupado)}</p></div>`;
    if (BC.error) html += `<div class="aviso error"><p><b>No se pudo leer:</b> ${esc(BC.error)}</p></div>`;
    if (BC.vista === "cargar") return html + vistaBcCargar();
    if (BC.vista === "config") return html + vistaBcConfig();
    if (BC.vista === "detalle" && BC.sel) return html + vistaBcDetalle();
    return html + vistaBcResumen();
  }
  function zonaBancos(texto) {
    return `<div class="zona" id="zona-bc" tabindex="0" role="button" aria-label="Cargar libros auxiliares y extractos"><b>${texto || "Suelte aquí los libros auxiliares y los extractos"}</b>
      <span>PDF del libro auxiliar de MantisWeb, extractos de Bancolombia, Banco de Bogotá, Davivienda u otro banco (PDF, Excel o CSV) y el reporte mensual de transacciones de Bold (datáfono). Puede cargar varios a la vez.</span></div>`;
  }
  function vistaBcResumen() {
    const ps = periodosBC();
    if (!ps.length) return `<section class="panel"><h2>Conciliaciones bancarias</h2><p class="sub">Todavía no hay conciliaciones guardadas. Cargue el libro auxiliar de cada cuenta bancaria y su extracto: el cruce, las partidas pendientes y el comprobante de gastos y retenciones se arman solos.</p>${zonaBancos()}</section>`;
    const lista = [...BC.conc.values()].filter((c) => c.periodo === BC.periodo).sort((a, b) => a.cuenta.localeCompare(b.cuenta));
    const conDif = lista.filter((c) => Math.abs(c.saldos?.diferencia || 0) >= 1);
    const pend = lista.reduce((s, c) => s + (c.conteo ? c.conteo.transito + c.conteo.egresos + c.conteo.nc + c.conteo.nd : 0), 0);
    const porReg = lista.reduce((s, c) => s + (c.porRegistrar?.debitos || 0), 0);
