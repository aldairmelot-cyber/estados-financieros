        const esDian = mv.nit === NIT_DIAN;
        if (esDian) {
          if (/^236590/.test(mv.cuenta) || conceptoDe(mv.cuenta, cfg) === null) {
            if (mv.credito > 0 && /^236590/.test(mv.cuenta)) liquidacionContable = (liquidacionContable || 0) + mv.credito;
          }
          continue; // traslados a la DIAN (liquidación o pago): no son retenciones practicadas
        }
        const concepto = conceptoDe(mv.cuenta, cfg);
        if (!concepto) continue;
        const nombre = nombreCuenta[mv.cuenta] || "";
        const tarifa = mv.tarifa && mv.tarifa > 0 ? mv.tarifa : tarifaDe(mv.cuenta, nombre, cfg, concepto);
        if (mv.credito > 0) {
          let base = mv.base > 0 ? mv.base : 0, derivada = false;
          if (!base && concepto !== "trabajo" && !concepto.startsWith("iva") && tarifa) { base = Math.round(mv.credito / (tarifa / 100)); derivada = true; }
          const tipo = concepto.startsWith("iva") ? "" : concepto === "trabajo" || concepto === "pensiones" ? "natural" : mv.desdeBalance ? "sin" : tipoTercero(mv.nit, cfg);
          const f = add(concepto, base, mv.credito, tipo);
          f.cuentas.add(mv.cuenta);
          if (derivada) f.derivadas++;
          if (!derivada && base && tarifa && Math.abs(mv.credito / base * 100 - tarifa) > 0.05 * tarifa)
            alertas.push({ severidad: "advertencia", mensaje: `${mv.doc} (${mv.tercero}): retención de ${pesos(mv.credito)} sobre base ${pesos(mv.base)} equivale al ${(mv.credito / base * 100).toFixed(2)} %, distinto de la tarifa ${tarifa} % de la cuenta ${mv.cuenta}.` });
          detalle.push({ ...mv, concepto, tarifa, baseCalculada: base, derivada, tipo });

        }

      for (const p of pendientes.filter((x) => !x.incluir && x.saldo < 0))
        alertas.push({ severidad: "advertencia", cuenta: p.cuenta, mensaje: `La cuenta ${p.cuenta} ${p.nombre} trae un saldo anterior de ${pesos(-p.saldo)}: son retenciones causadas en meses anteriores que no se trasladaron en su mes. Cada retención debe declararse en el 350 del mes en que se practicó (si quedó por fuera, corrija esa declaración). Márquela solo si va a incluirla en esta.` });
    }

    const trab = filasConcepto.get("trabajo|natural");

    if (manualTrab != null && manualTrab !== "") { if (trab) trab.base = Number(manualTrab); else add("trabajo", Number(manualTrab), 0, "natural"); }

      const vig = (cfg.tarifasAutorret || []).filter((t) => t.desde <= periodo).sort((a, b) => a.desde.localeCompare(b.desde)).at(-1);
      const tarifa = vig ? Number(vig.tarifa) : null;
      autorret = { base, tarifa, valor: tarifa != null ? base * tarifa / 100 : null, ciiu: cfg.ciiu };
      if (tarifa == null) alertas.push({ severidad: "error", mensaje: "No hay tarifa de autorretención especial para este período. Regístrela en la configuración de impuestos." });
      if (periodo >= "2026-07" && vig && vig.desde < "2026-07")
        alertas.push({ severidad: "advertencia", mensaje: "Desde el 1 de julio de 2026 volvieron a regir las tarifas del Decreto 572 de 2025 (el Consejo de Estado revocó la suspensión). Confirme la tarifa de autorretención especial del CIIU " + (cfg.ciiu || "") + " y regístrela desde 2026-07 si cambió." });

    // Formulario
    const renglones = [];
    for (const tipo of ["juridica", "natural", "sin"]) {
      for (const [k, nombre] of CONCEPTOS) {
        if (k.startsWith("iva")) continue;
        const f = filasConcepto.get(k + "|" + tipo);
        if (!f) continue;
        renglones.push({ concepto: k, tipo, nombre, base: f.base, retencion: f.retencion, baseR: redondear(f.base), retencionR: redondear(f.retencion), cuentas: [...f.cuentas], derivadas: f.derivadas });

    const excesoR = redondear(exceso);
    const totalRenta = renglones.reduce((s, r) => s + r.retencionR, 0) + autorrets.reduce((s, r) => s + r.retencionR, 0) - excesoR;
    const iva = filasConcepto.get("iva|");
    const ivaR = redondear(iva ? iva.retencion : 0), excesoIvaR = redondear(excesoIva);

    const control = liquidacionContable != null ? { contable: liquidacionContable, diferencia: total - liquidacionContable } : null;
    if (control && Math.abs(control.diferencia) >= 1000)
      alertas.push({ severidad: "advertencia", mensaje: `La liquidación contable trasladada a la 236590 (${pesos(liquidacionContable)}) difiere del total calculado (${pesos(total)}) en ${pesos(control.diferencia)}.` });
    return { renglones, porTipo, autorrets, exceso, excesoR, totalRenta, iva: iva ? iva.retencion : 0, ivaR, excesoIva, excesoIvaR, totalIva, total, control, alertas, detalle, pendientes, autorret };
  }

  /* ------------------------------------------------------------ IVA (formulario 300, bimestral) */
  const pad = (n) => String(n).padStart(2, "0");
  function bimestre(periodo) {

        const cierrePrevio = nat > 0 ? mov.cPrev(p) : mov.dPrev(p);
        return cierrePrevio > 0.5 ? sa : 0;
      }
      if (!mov.c1) return sa;

    };
    const debito = (lista) => S(lista, (p) => saPend(p, 1) + mov.d(p));      // cuentas de naturaleza débito
    const credito = (lista) => S(lista, (p) => saPend(p, -1) + mov.c(p));    // cuentas de naturaleza crédito

    const retIva = debito(cfg.retIva);
