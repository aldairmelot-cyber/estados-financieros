<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout tipo software: menú lateral por módulos (informes, impuestos, cartera, datos) y área de trabajo con barra superior. */
:root {
  /* Marca Districlínicas: azul marino del logotipo, azul medio y cian del estetoscopio */
  --bg: #f1f5f9;
  --hoja: #ffffff;
  --tinta: #15233f;
  --suave: #56637a;
  --linea: #dbe3ec;
  --linea-fuerte: #a8b6c8;
  --acento: #20386e;
  --acento-2: #1f9fb6;
  --acento-suave: #e4f4f8;
  --sobre-acento: #ffffff;
  --ok: #1d7a4b; --ok-suave: #e3f3ea;
  --aviso: #a8570b; --aviso-suave: #fbf0e1;
  --error: #b42318; --error-suave: #fbe9e7;
  --info: #305080; --info-suave: #e7eef8;
  --serie1: #20386e; --serie2: #2aa9be; --serie3: #6d8fc7; --serie4: #9aa6b8; --serie5: #8fd3df;
  --f-ui: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-doc: "Montserrat", "Segoe UI", system-ui, sans-serif;
  --radio: 6px;
  --lat: #172a55;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1322; --hoja: #121c2f; --tinta: #e3eaf5; --suave: #98a6bd; --linea: #223049; --linea-fuerte: #3a4a66;
    --acento: #7fa2e3; --acento-2: #45c3da; --acento-suave: #14283a; --sobre-acento: #08111f;
    --ok: #5cc48f; --ok-suave: #14291f; --aviso: #e5a052; --aviso-suave: #2e2214; --error: #f08074; --error-suave: #33191a; --info: #8eacde; --info-suave: #18223a;
    --serie1: #7fa2e3; --serie2: #45c3da; --serie3: #b3c6ef; --serie4: #7d8aa0; --serie5: #2f8fa0; --lat: #0d1830;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1322; --hoja: #121c2f; --tinta: #e3eaf5; --suave: #98a6bd; --linea: #223049; --linea-fuerte: #3a4a66;
  --acento: #7fa2e3; --acento-2: #45c3da; --acento-suave: #14283a; --sobre-acento: #08111f;
  --ok: #5cc48f; --ok-suave: #14291f; --aviso: #e5a052; --aviso-suave: #2e2214; --error: #f08074; --error-suave: #33191a; --info: #8eacde; --info-suave: #18223a;
  --serie1: #7fa2e3; --serie2: #45c3da; --serie3: #b3c6ef; --serie4: #7d8aa0; --serie5: #2f8fa0; --lat: #0d1830;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--tinta); font: 14px/1.5 var(--f-ui); font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
a { color: var(--acento); }
:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }

/* Estructura tipo software: menú lateral por módulos + barra superior con la sección y el corte. */
body { margin: 0; }
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; background: linear-gradient(to right, var(--lat) 252px, var(--bg) 252px); }
.lateral { align-self: start; }
.lateral { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--lat); color: #dbe5f5; display: flex; flex-direction: column; border-right: 1px solid #0f1f42; }
.lateral .marca { display: flex; align-items: center; gap: 10px; padding: 16px 16px 14px; border-bottom: 1px solid rgba(255,255,255,.08); box-shadow: inset 0 3px 0 var(--acento-2); }
.lateral .marca > div { display: flex; flex-direction: column; min-width: 0; }
.lateral .marca img { height: 38px; width: auto; background: #fff; border-radius: 6px; padding: 3px 5px; flex: none; }
.lateral .marca b { font: 700 12.5px/1.25 var(--f-doc); color: #fff; letter-spacing: .01em; }
.lateral .marca span { color: #9fb2d6; font-size: 11.5px; line-height: 1.3; }
.menu { padding: 10px 10px 16px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
.menu .grupo { display: flex; align-items: center; gap: 8px; font: 600 11px/1 var(--f-doc); text-transform: uppercase; letter-spacing: .08em; color: #8ea3cc; padding: 14px 10px 8px; margin-top: 2px; width: 100%; border: 0; background: none; border-radius: 6px; cursor: pointer; text-align: left; }
.menu button.grupo:hover { background: rgba(255,255,255,.05); color: #c9d6ee; }
.menu .grupo span { flex: 1; }
.menu .grupo .flecha { width: 14px; height: 14px; color: #8ea3cc; transition: transform .15s ease; }
.menu .grupo[aria-expanded="true"] .flecha { transform: rotate(90deg); }
.menu .sub { display: flex; flex-direction: column; gap: 2px; }
.menu .grupo svg { width: 15px; height: 15px; flex: none; color: #5fd0e3; }
.menu button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none; color: #d5e0f3; padding: 7px 10px 7px 33px; border-radius: 6px; cursor: pointer; font-size: 13.5px; }
.menu button.raiz { padding-left: 10px; font-weight: 600; }
.menu button.raiz svg { width: 16px; height: 16px; color: #5fd0e3; }
.menu button:hover { background: rgba(255,255,255,.07); color: #fff; }
.menu button[aria-current="page"] { background: #2a4682; color: #fff; box-shadow: inset 3px 0 0 #3fc6dc; font-weight: 600; }
.menu .cuenta { margin-left: auto; font-size: 11px; background: #b42318; color: #fff; border-radius: 99px; padding: 0 7px; line-height: 18px; }
.lateral-pie { padding: 12px 16px 16px; border-top: 1px solid rgba(255,255,255,.08); }
.estado-db { font-size: 12px; padding: 3px 9px; border-radius: 99px; background: rgba(95,208,227,.15); color: #9fe3ef; white-space: nowrap; display: inline-block; }
.estado-db.mal { background: rgba(229,160,82,.18); color: #f1c48e; }
.cuerpo { min-width: 0; display: flex; flex-direction: column; }
.barra { position: sticky; top: 0; z-index: 10; background: var(--hoja); border-bottom: 1px solid var(--linea); display: flex; align-items: center; gap: 14px; padding: 10px 24px; min-height: 60px; }
.titulo-pag { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.titulo-pag span { font-size: 11.5px; color: var(--suave); text-transform: uppercase; letter-spacing: .07em; }
.titulo-pag h1 { font: 700 18px/1.25 var(--f-doc); color: var(--acento); }
.corte { display: flex; align-items: center; gap: 8px; }
.corte label { font-size: 12px; color: var(--suave); text-transform: uppercase; letter-spacing: .06em; }
.btn-menu { display: none; border: 1px solid var(--linea-fuerte); background: var(--hoja); border-radius: var(--radio); padding: 5px; cursor: pointer; color: var(--acento); }
.velo { display: none; }
select, input[type=text], input[type=number], textarea { background: var(--hoja); border: 1px solid var(--linea-fuerte); border-radius: var(--radio); padding: 6px 8px; min-width: 0; }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); background: var(--bg); }
  .lateral { position: fixed; left: 0; top: 0; bottom: 0; width: 272px; max-width: 86vw; z-index: 40; transform: translateX(-100%); transition: transform .2s ease; }
  .app.menu-abierto .lateral { transform: none; }
  .app.menu-abierto .velo { display: block; position: fixed; inset: 0; background: rgba(8,17,31,.45); z-index: 30; }
  .btn-menu { display: inline-flex; }
  .barra { padding: 8px 16px; gap: 10px; }
  .titulo-pag h1 { font-size: 15.5px; }
  .corte label { display: none; }
}
main { width: 100%; max-width: 1240px; margin: 0 auto; padding-block: 20px 60px; padding-inline: 24px; display: flex; flex-direction: column; gap: 16px; }
.panel { background: var(--hoja); border: 1px solid var(--linea); border-radius: var(--radio); padding: 18px; min-width: 0; }
.panel h2 { font: 700 16px/1.3 var(--f-doc); margin-bottom: 4px; color: var(--acento); }
.panel .sub { color: var(--suave); margin: 0 0 12px; }
.fila { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.fila > * { min-width: 0; }
.rejilla { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.btn { border: 1px solid var(--linea-fuerte); background: var(--hoja); border-radius: var(--radio); padding: 7px 14px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--acento); color: var(--acento); }
.btn.primario { background: var(--acento); border-color: var(--acento); color: var(--sobre-acento); }
.btn.primario:hover { filter: brightness(1.08); color: var(--sobre-acento); }
.btn.peligro { color: var(--error); border-color: var(--error); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.chico { padding: 3px 10px; font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--linea-fuerte); border-radius: var(--radio); overflow: hidden; }
.seg button { border: 0; background: var(--hoja); padding: 6px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--acento); color: var(--sobre-acento); }

/* Avisos */
.aviso { border-radius: var(--radio); padding: 10px 14px; border-left: 4px solid; display: flex; gap: 10px; align-items: flex-start; }
.aviso p { margin: 0; }
.aviso.critica, .aviso.error { background: var(--error-suave); border-color: var(--error); }
.aviso.advertencia { background: var(--aviso-suave); border-color: var(--aviso); }
.aviso.info { background: var(--info-suave); border-color: var(--info); }
.aviso.ok { background: var(--ok-suave); border-color: var(--ok); }
.chip { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.chip.ok { background: var(--ok-suave); color: var(--ok); }
.chip.info { background: var(--info-suave); color: var(--info); }
.chip.advertencia { background: var(--aviso-suave); color: var(--aviso); }
.chip.error, .chip.critica { background: var(--error-suave); color: var(--error); }
.chip.n { text-transform: none; letter-spacing: 0; font-size: 12px; }
.chip.gris { background: var(--linea); color: var(--suave); }
.seg .chip { margin-left: 4px; }
.hoja.lineal table.ef th, .hoja.lineal table.ef td { font-size: 11.5px; padding: 3px 5px; }
.hoja.lineal table.ef td:first-child, .hoja.lineal table.ef th:first-child { min-width: 150px; position: sticky; left: 0; background: var(--hoja); z-index: 1; }
.hoja.lineal table.ef tr.seccion td { position: static; }
.hoja.lineal table.ef tr.gran td:first-child { background: var(--info-suave); }
.barras-h { display: flex; flex-direction: column; gap: 6px; }
.bh { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(60px, 1fr) auto; gap: 8px; align-items: center; font-size: 12.5px; }
.bh-n { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.25; font-size: 12px; }
.bh-b { background: var(--linea); border-radius: 3px; height: 10px; overflow: hidden; }
.bh-b i { display: block; height: 100%; background: var(--acento); border-radius: 3px; }
.bh-v { font-variant-numeric: tabular-nums; text-align: right; min-width: 92px; }
.modulos { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.modulo { display: grid; grid-template-columns: auto 1fr; column-gap: 10px; row-gap: 2px; align-items: center; text-align: left; background: var(--hoja); border: 1px solid var(--linea); border-radius: 8px; padding: 14px 16px; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
.modulo:hover { border-color: var(--acento-2); box-shadow: 0 2px 10px rgba(32,56,110,.08); }
.modulo svg { width: 20px; height: 20px; color: var(--acento-2); grid-row: span 1; }
.modulo .m-t { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--suave); }
.modulo b { grid-column: 1 / -1; font: 700 19px/1.25 var(--f-doc); color: var(--acento); }
.modulo small { grid-column: 1 / -1; color: var(--suave); font-size: 12.5px; }
ul.hallazgos { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
ul.hallazgos li { line-height: 1.45; }
ul.hallazgos .chip { margin-right: 6px; }
table.cal th, table.cal td { vertical-align: middle; padding-left: 6px; padding-right: 6px; }
table.cal th { white-space: normal; }
table.cal td { white-space: normal; }
table.cal td b { white-space: nowrap; }
table.cal input { width: 96px !important; }
table.cal .sep { border-left: 2px solid var(--linea-fuerte); }
table.ef.cal td:first-child { min-width: 0; }
table.cal small.bim { display: block; font-size: 11px; color: var(--suave); font-weight: 400; }
table.cal tr.futuro td { color: var(--suave); }

/* Zona de carga */
.zona { border: 2px dashed var(--linea-fuerte); border-radius: var(--radio); padding: 32px 16px; text-align: center; cursor: pointer; transition: border-color .15s, background .15s; }
.zona:hover, .zona.sobre { border-color: var(--acento); background: var(--acento-suave); }
.zona b { display: block; font: 700 15px var(--f-doc); margin-bottom: 4px; color: var(--acento); }
.zona span { color: var(--suave); }

/* Controles de revisión */
.controles { display: flex; flex-direction: column; gap: 8px; }
.control { border: 1px solid var(--linea); border-radius: var(--radio); border-left: 4px solid var(--ok); }
.control.info { border-left-color: var(--info); } .control.advertencia { border-left-color: var(--aviso); } .control.error, .control.critica { border-left-color: var(--error); }
.control summary { list-style: none; cursor: pointer; padding: 10px 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: baseline; }
.control summary::-webkit-details-marker { display: none; }
.control .num { font: 600 13px var(--f-ui); color: var(--suave); }
.control .tit { font-weight: 600; }
.control .res { grid-column: 2 / 4; color: var(--suave); font-size: 13px; }
.control ul { margin: 0; padding: 0 14px 12px 40px; display: flex; flex-direction: column; gap: 6px; }
.control li { font-size: 13px; }
.control li .chip { margin-right: 6px; }
.control li.critica { color: var(--error); font-weight: 600; }

/* Hoja de estado financiero */
.hoja { --hoja: #ffffff; --tinta: #15233f; --suave: #56637a; --linea: #dfe6ef; --linea-fuerte: #a8b6c8; --acento: #20386e; --acento-2: #1f9fb6; --error: #b42318; --error-suave: #fdecea; --info-suave: #e7eef8;
  color-scheme: light; background: var(--hoja); color: var(--tinta); border: 1px solid var(--linea); border-top: 4px solid var(--acento-2); border-radius: var(--radio); padding: 28px 24px; min-width: 0; }
.encab .logo { height: 64px; width: auto; margin: 0 auto 6px; }
.encab { text-align: center; display: flex; flex-direction: column; gap: 2px; margin-bottom: 18px; }
.encab .razon { font: 700 16px/1.3 var(--f-doc); letter-spacing: .02em; color: var(--acento); }
.encab .estado { font: 700 14px/1.3 var(--f-doc); text-transform: uppercase; letter-spacing: .06em; margin-top: 4px; color: var(--acento-2); }
.encab .meta { font-size: 12px; color: var(--suave); }
.tabla-env { overflow-x: auto; }
table.ef { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
table.ef th { font-weight: 700; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--acento); border-bottom: 2px solid var(--acento); padding: 6px 8px; text-align: right; vertical-align: bottom; }
table.ef th:first-child { text-align: left; }
table.ef td { padding: 4px 8px; border-bottom: 1px solid var(--linea); text-align: right; white-space: nowrap; }
table.ef td:first-child { text-align: left; white-space: normal; min-width: 210px; }
table.ef td.nota { text-align: center; color: var(--suave); font-size: 12px; }
table.ef tr.seccion td { color: var(--acento); font-weight: 700; text-transform: uppercase; font-size: 12px; letter-spacing: .05em; padding-top: 14px; border-bottom: 0; }
table.ef tr.rubro td:first-child { padding-left: 20px; }
table.ef tr.subtotal td { font-weight: 600; }
table.ef tr.total td { font-weight: 700; border-top: 1px solid var(--linea-fuerte); }
table.ef tr.gran td { font-weight: 700; color: var(--acento); border-top: 1.5px solid var(--acento); border-bottom: 3px double var(--acento); background: var(--info-suave); }
table.ef tr.alerta td { background: var(--error-suave); }
table.ef td.neg { color: var(--error); }
table.ef tr.control td { color: var(--suave); font-size: 12px; border-bottom: 0; }
.firmas { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 28px 24px; margin-top: 44px; text-align: center; font-size: 12.5px; }
.firmas div { border-top: 1px solid var(--tinta); padding-top: 6px; }
.firmas b { display: block; font-weight: 600; }
.firmas span { display: block; color: var(--suave); }
.pie { font-size: 12px; color: var(--suave); margin-top: 12px; }

/* Notas */
.notas h3 { font: 700 13px/1.35 var(--f-doc); color: var(--acento); text-transform: uppercase; letter-spacing: .04em; margin: 22px 0 6px; }
.notas h4 { font: 700 12.5px/1.35 var(--f-doc); color: var(--acento-2); text-transform: uppercase; letter-spacing: .08em; margin: 28px 0 4px; padding-bottom: 4px; border-bottom: 2px solid var(--acento-2); }
.notas p { margin: 0 0 8px; text-align: justify; max-width: none; }
.notas .desc { color: var(--suave); font-style: italic; }
.notas table.ef { margin: 6px 0 8px; table-layout: fixed; }
.notas table.ef th:first-child { width: 40%; }
.notas table.ef td:first-child { white-space: normal; }
.notas textarea { width: 100%; min-height: 64px; border: 1px dashed var(--linea-fuerte); border-radius: var(--radio); padding: 8px; background: #fbfcfe; color: var(--tinta); font: inherit; resize: vertical; }
.notas label.rev { display: block; font-size: 12px; color: var(--suave); margin-top: 4px; }

/* Tarjetas y gráficos */
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.kpi { background: var(--hoja); border: 1px solid var(--linea); border-radius: var(--radio); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.kpi span { font-size: 11.5px; color: var(--suave); text-transform: uppercase; letter-spacing: .06em; }
.kpi b { font: 700 19px/1.3 var(--f-doc); color: var(--acento); }
.kpi { border-top: 3px solid var(--acento-2); }
.kpi small { color: var(--suave); }
.graf { width: 100%; height: auto; display: block; }
.graf text { fill: var(--suave); font: 11px var(--f-ui); }
.graf .eje { stroke: var(--linea-fuerte); }
.graf .rej { stroke: var(--linea); }
.leyenda { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--suave); margin-top: 6px; }
.leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.dos { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }

/* Indicadores */
.semaforo { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
.semaforo.verde { background: var(--ok); } .semaforo.amarillo { background: var(--aviso); } .semaforo.rojo { background: var(--error); }
table.ind td { white-space: normal; vertical-align: top; }
table.ind td.interp { text-align: left; color: var(--suave); font-size: 12.5px; min-width: 240px; }
table.ind .formula { display: block; font-size: 11.5px; color: var(--suave); }

/* Formularios de configuración */
.campos { display: grid; gap: 10px 14px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.campo { display: flex; flex-direction: column; gap: 4px; }
.campo label { font-size: 12px; color: var(--suave); }
details.conf { border: 1px solid var(--linea); border-radius: var(--radio); }
details.conf > summary { cursor: pointer; padding: 12px 16px; font: 700 14px var(--f-doc); color: var(--acento); }
details.conf textarea { width: 100%; min-height: 90px; resize: vertical; line-height: 1.45; }
details.conf > div { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }
table.mapeo { border-collapse: collapse; width: 100%; font-size: 13px; min-width: 760px; }
table.mapeo th { text-align: left; font-size: 11.5px; color: var(--suave); text-transform: uppercase; letter-spacing: .04em; padding: 4px; }
table.mapeo td { padding: 3px 4px; }

<input type="file" id="archivo-bc-libro" accept=".pdf,.xls,.xlsx,.csv" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
/* =====================================================================
   MOTOR CONTABLE — funciones puras, sin DOM.
   Lee el "Balance General por Centros de Costos", valida y construye los
   estados financieros (NIIF para Pymes, PUC Decreto 2650/93).
   Convención del archivo: débito positivo, crédito negativo.
   Nunca se suman niveles distintos: una cuenta se toma de su propia fila
   o, si no existe, de la suma de sus cuentas hoja.
   ===================================================================== */
const Motor = (() => {
  "use strict";

  const TOL = 1; // tolerancia de cuadre: ±1 peso
  const CAMPOS = ["sa", "d", "c", "ns"]; // saldo anterior, débito, crédito, nuevo saldo
  const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto",
    "septiembre", "octubre", "noviembre", "diciembre"];

  /* ------------------------------------------------------------ utilidades */
  const norm = (s) => (s == null ? "" : String(s)).normalize("NFKD")
    .replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim().toLowerCase();
  const limpiar = (s) => (s == null ? "" : String(s)).replace(/\s+/g, " ").trim();
  const pad = (n) => String(n).padStart(2, "0");

  function aFecha(v) {
    if (v == null || v === "") return null;
    if (typeof v === "number") { // serial de Excel (días desde 1899-12-30)
      const d = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 86400000);
      return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
    }
    if (v instanceof Date) return `${v.getFullYear()}-${pad(v.getMonth() + 1)}-${pad(v.getDate())}`;
    const t = String(v).trim();
    let m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    m = t.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})/);
    if (m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
    return null;
  }

  function aNumero(v) {
    if (v == null || v === "") return 0;
    if (typeof v === "number") return v;
    let t = String(v).replace(/\s/g, "");
    if (/^-?[\d.]+,\d+$/.test(t)) t = t.replace(/\./g, "").replace(",", ".");
    const n = Number(t);
    return Number.isFinite(n) ? n : 0;
  }

  function aCuenta(v) {
    if (v == null) return "";
    if (typeof v === "number" && Number.isInteger(v)) return String(v);
    return String(v).trim();
  }

  function valorTrasEtiqueta(fila, etiqueta) {
    for (let i = 0; i < fila.length; i++) {
      if (norm(fila[i]).replace(/:$/, "") === etiqueta) {
        for (let j = i + 1; j < fila.length; j++) if (fila[j] != null && fila[j] !== "") return fila[j];
      }
    }
    return null;
  }

  const periodoDe = (fecha) => fecha.slice(0, 7);
  const anioMes = (periodo) => periodo.split("-").map(Number);
  const periodoMas = (periodo, delta) => {
    let [a, m] = anioMes(periodo);
    m += delta;
    while (m < 1) { m += 12; a -= 1; }
    while (m > 12) { m -= 12; a += 1; }
    return `${a}-${pad(m)}`;
  };
  const ultimoDia = (periodo) => { const [a, m] = anioMes(periodo); return new Date(Date.UTC(a, m, 0)).getUTCDate(); };
  const fechaLarga = (iso) => { const [a, m, d] = iso.split("-").map(Number); return `${d} de ${MESES[m - 1]} de ${a}`; };
  const finDeMes = (periodo) => `${periodo}-${pad(ultimoDia(periodo))}`;

  /* ------------------------------------------------------------ lectura */
  class ErrorLectura extends Error {}

  /** filas: matriz cruda de la primera hoja (como la entrega SheetJS con header:1). */
  function interpretar(filas, archivo = "") {
    const advertencias = [];
    let ie = -1;
    for (let i = 0; i < Math.min(15, filas.length); i++) {
      const t = (filas[i] || []).map(norm);
      if (t.includes("cuenta") && t.includes("nuevo saldo")) { ie = i; break; }
    }
    if (ie < 0) throw new ErrorLectura("No se encontró la fila de encabezados (Cuenta … Nuevo Saldo). ¿Es el reporte 'Balance General por Centros de Costos'?");
    if (ie < 1) throw new ErrorLectura("Falta la fila con las fechas Desde/Hasta encima de los encabezados.");
    const enc = filas[ie].map(norm);
    const fPer = filas[ie - 1] || [];
    const fEmp = ie >= 2 ? (filas[ie - 2] || []) : [];

    const nit = limpiar(valorTrasEtiqueta(fEmp, "nit"));
    const empresa = limpiar(valorTrasEtiqueta(fEmp, "empresa"));
    const generado = limpiar([...fEmp].reverse().find((c) => c != null && c !== "") ?? "");

    const desde = aFecha(valorTrasEtiqueta(fPer, "desde"));
    const hasta = aFecha(valorTrasEtiqueta(fPer, "hasta"));
    if (!desde || !hasta) throw new ErrorLectura("No se pudieron leer las fechas 'Desde' y 'Hasta' de la fila 2.");
    if (desde > hasta) throw new ErrorLectura(`La fecha Desde (${desde}) es posterior a Hasta (${hasta}).`);
    let tipo;
    if (desde.slice(0, 7) === hasta.slice(0, 7)) tipo = "mensual";
    else if (desde.slice(5) === "01-01" && desde.slice(0, 4) === hasta.slice(0, 4)) tipo = "acumulado";
    else throw new ErrorLectura(`El rango ${desde} a ${hasta} no es mensual ni acumulado desde el 1 de enero.`);

    const mapa = { "cuenta": "cuenta", "nombre cuenta": "nombre", "saldo anterior": "sa", "debito": "d", "credito": "c", "nuevo saldo": "ns" };
    const pos = {};
    enc.forEach((e, j) => { if (mapa[e] && pos[mapa[e]] == null) pos[mapa[e]] = j; });
    const faltan = Object.values(mapa).filter((k) => pos[k] == null);
    if (faltan.length) throw new ErrorLectura(`Faltan columnas en el encabezado: ${faltan.join(", ")}.`);

    // Centros de costo: columnas con encabezado a la derecha de "Nuevo Saldo".
    const centros = [], posCC = [];
    for (let j = pos.ns + 1; j < filas[ie].length; j++) {
      const nombre = limpiar(filas[ie][j]);
      if (!nombre) continue;
      const codigo = aCuenta(fPer[j]) || nombre;
      centros.push({ codigo, nombre });
      posCC.push(j);
    }
    if (!centros.length) advertencias.push("El archivo no trae columnas de centro de costo.");

    const datos = [];
    const vistos = new Set();
    for (const f of filas.slice(ie + 1)) {
      if (!f) continue;
      const cuenta = aCuenta(f[pos.cuenta]);
      if (!cuenta) continue;
      if (!/^\d+$/.test(cuenta)) { advertencias.push(`Fila ignorada (cuenta no numérica): ${cuenta}`); continue; }
      if (vistos.has(cuenta)) throw new ErrorLectura(`Cuenta duplicada en el archivo: ${cuenta}`);
      vistos.add(cuenta);
      datos.push([cuenta, limpiar(f[pos.nombre]), aNumero(f[pos.sa]), aNumero(f[pos.d]), aNumero(f[pos.c]), aNumero(f[pos.ns]),
        ...posCC.map((j) => aNumero(f[j]))]);
    }
    if (!datos.length) throw new ErrorLectura("El archivo no contiene filas de cuentas.");
    return indexar({ nit, empresa, generado, desde, hasta, tipo, periodo: periodoDe(hasta), archivo, centros, datos, advertencias });
  }

  /** Construye los índices a partir de la forma compacta (la que se guarda en el histórico). */
  function indexar(b) {
    const filas = new Map();
    for (const r of b.datos) {
      filas.set(r[0], { cuenta: r[0], nombre: r[1], sa: r[2], d: r[3], c: r[4], ns: r[5], cc: r.slice(6), dig: r[0].length });
    }
    const codigos = [...filas.keys()].sort();
    codigos.forEach((cod, i) => {
      const sig = codigos[i + 1] || "";
      filas.get(cod).hoja = !(sig.startsWith(cod) && sig.length > cod.length);
      let padre = null;
      for (let l = cod.length - 1; l > 0; l--) if (filas.has(cod.slice(0, l))) { padre = cod.slice(0, l); break; }
      filas.get(cod).padre = padre;
    });
    b.filas = filas;
    b.codigos = codigos;
    b.advertencias = b.advertencias || [];
    return b;
  }

  /** Forma compacta para guardar en la base de datos. */
  const compactar = (b) => ({
    nit: b.nit, empresa: b.empresa, generado: b.generado, desde: b.desde, hasta: b.hasta, tipo: b.tipo,
    periodo: b.periodo, archivo: b.archivo, centros: b.centros, datos: b.datos,
  });

  /** Documento para la base de datos: cada cuenta como una línea separada por tabuladores. */
  const aDocumento = (b) => ({
    nit: b.nit, empresa: b.empresa, generado: b.generado, desde: b.desde, hasta: b.hasta, tipo: b.tipo,
    periodo: b.periodo, archivo: b.archivo, centros: b.centros, filas: b.datos.map((r) => r.join("\t")),
  });
  function deDocumento(doc) {
    const datos = (doc.filas || []).map((l) => { const p = l.split("\t"); return [p[0], p[1], ...p.slice(2).map(Number)]; });
    return indexar({ ...doc, filas: undefined, datos, advertencias: [] });
  }

  /* ------------------------------------------------------------ consultas */
  function campo(fila, k) {
    if (typeof k === "number") return fila.cc[k] || 0;
    if (k === "mov") return fila.d - fila.c;
    return fila[k];
  }

  /** Valor de una cuenta (signo del archivo). k: 'sa' | 'd' | 'c' | 'ns' | 'mov' | índice de centro de costo. */
  function valor(b, prefijo, k = "ns") {
    const f = b.filas.get(prefijo);
    if (f) return campo(f, k);
    let s = 0;
    for (const [cod, fila] of b.filas) if (fila.hoja && cod.startsWith(prefijo)) s += campo(fila, k);
    return s;
  }

  const resultado = (b, k = "ns") => -["4", "5", "6", "7"].reduce((s, c) => s + valor(b, c, k), 0);

  /** Detalle a nivel hoja que siempre suma la cuenta (agrega "registrado sin auxiliar"). */
  function detalle(b, prefijo) {
    const out = [];
    for (const cod of b.codigos) {
      if (!cod.startsWith(prefijo)) continue;
      const f = b.filas.get(cod);
      if (f.hoja) { out.push(f); continue; }
      const hijas = [...b.filas.values()].filter((h) => h.padre === cod);
      const res = { cuenta: cod + "*", nombre: `${f.nombre} (registrado sin auxiliar)`, residuo: true, hoja: true, dig: f.dig, cc: f.cc.map((v, i) => v - hijas.reduce((s, h) => s + (h.cc[i] || 0), 0)) };
      let hay = false;
      for (const k of CAMPOS) { res[k] = f[k] - hijas.reduce((s, h) => s + h[k], 0); if (Math.abs(res[k]) > 0.005) hay = true; }
      if (hay) out.push(res);
    }
    return out;
  }

  /* ------------------------------------------------------------ mapeo por defecto */
  // ESF: seccion activo|pasivo|patrimonio; clasif corriente|no_corriente.
  // ERI: seccion ing_op|costo|gasto_adm|gasto_ven|ing_noop|gasto_noop|impuesto.
  const MAPEO_DEFECTO = [
    ["11", "ESF", "activo", "Efectivo y equivalentes al efectivo", "corriente", "1.1"],
    ["12", "ESF", "activo", "Inversiones", "corriente", ""],
    ["13", "ESF", "activo", "Deudores comerciales y otras cuentas por cobrar", "corriente", "1.2"],
    ["14", "ESF", "activo", "Inventarios", "corriente", "1.3"],
    ["15", "ESF", "activo", "Propiedades, planta y equipo", "no_corriente", "1.4"],
    // 1399: en esta empresa es cartera de difícil cobro en procesos jurídicos (saldo débito), no deterioro.
    ["1399", "ESF", "activo", "Deudores de difícil cobro en procesos jurídicos", "no_corriente", "1.5"],
    ["16", "ESF", "activo", "Intangibles", "no_corriente", ""],
    ["17", "ESF", "activo", "Diferidos", "corriente", ""],
    ["18", "ESF", "activo", "Otros activos", "no_corriente", ""],
    ["19", "ESF", "activo", "Valorizaciones", "no_corriente", ""],
    ["21", "ESF", "pasivo", "Obligaciones financieras", "corriente", "2.1"],
    ["22", "ESF", "pasivo", "Proveedores", "corriente", "2.2"],
    ["23", "ESF", "pasivo", "Cuentas por pagar", "corriente", "2.2"],
    ["24", "ESF", "pasivo", "Impuestos, gravámenes y tasas", "corriente", "2.3"],
    ["25", "ESF", "pasivo", "Beneficios a empleados", "corriente", "2.4"],
    ["26", "ESF", "pasivo", "Pasivos estimados y provisiones", "corriente", ""],
    ["27", "ESF", "pasivo", "Diferidos", "corriente", ""],
    ["28", "ESF", "pasivo", "Otros pasivos – anticipos recibidos", "corriente", "2.5"],
    ["31", "ESF", "patrimonio", "Capital social", "", "3.0"],
    ["32", "ESF", "patrimonio", "Superávit de capital", "", "3.0"],
    ["33", "ESF", "patrimonio", "Reservas", "", "3.0"],
    ["34", "ESF", "patrimonio", "Revalorización del patrimonio", "", "3.0"],
    ["36", "ESF", "patrimonio", "Resultados de ejercicios anteriores", "", "3.0"],
    ["37", "ESF", "patrimonio", "Resultados de ejercicios anteriores", "", "3.0"],
    ["38", "ESF", "patrimonio", "Superávit por valorizaciones", "", "3.0"],
    ["41", "ERI", "ing_op", "Ingresos de actividades ordinarias", "", "4.1"],
    ["42", "ERI", "ing_noop", "Ingresos no operacionales", "", "4.2"],
    ["47", "ERI", "ing_noop", "Ajustes por inflación", "", ""],
    ["51", "ERI", "gasto_adm", "Gastos de administración", "", "5.1"],
    ["52", "ERI", "gasto_ven", "Gastos de ventas", "", "5.2"],
    ["53", "ERI", "gasto_noop", "Gastos no operacionales", "", "5.3"],
    ["54", "ERI", "impuesto", "Impuesto de renta y complementarios", "", ""],
    ["59", "ERI", "gasto_noop", "Ganancias y pérdidas", "", ""],
    ["61", "ERI", "costo", "Costo de ventas y de prestación de servicios", "", "6.1"],
    ["62", "ERI", "costo", "Costo de ventas y de prestación de servicios", "", "6.1"],
    ["7", "ERI", "costo", "Costos de producción", "", ""],
    ["8", "ORDEN", "orden", "Cuentas de orden deudoras", "", ""],
    ["9", "ORDEN", "orden", "Cuentas de orden acreedoras", "", ""],
  ].map(([prefijo, estado, seccion, rubro, clasif, nota]) => ({ prefijo, estado, seccion, rubro, clasif, nota }));

  function reglaPara(cuenta, mapeo) {
    let mejor = null;
    for (const r of mapeo) if (cuenta.startsWith(r.prefijo) && (!mejor || r.prefijo.length > mejor.prefijo.length)) mejor = r;
    return mejor;
  }

  /** Importe propio de cada regla: su prefijo menos las reglas más específicas anidadas. */
  function importesPorRegla(get, reglas) {
    return reglas.map((r) => {
      const hijas = reglas.filter((o) => o !== r && o.prefijo.startsWith(r.prefijo) && o.prefijo.length > r.prefijo.length);
      const maximales = hijas.filter((h) => !hijas.some((o) => o !== h && h.prefijo.startsWith(o.prefijo) && h.prefijo.length > o.prefijo.length));
      let v = get(r.prefijo);
      for (const h of maximales) v -= get(h.prefijo);
      return { regla: r, valor: v };
    });
  }

  /* ------------------------------------------------------------ validaciones */
  const NAT_CLASE = { 1: 1, 2: -1, 3: -1, 4: -1, 5: 1, 6: 1, 7: 1 };
  const NAT_INVERSA = ["1299", "1399", "1499", "1592", "1597", "1598", "1599", "1698", "1699", "1799", "1899", "1999",
    "3115", "3130", "3610", "3710", "4175", "4275"];
  const CRITICAS = ["1399"];
  const CONTRAPARTIDA = /DESCONTABLE|DEVOLUCI|DESCUENTO|DCTO|REBAJA/i;
  const SEV = { ok: 0, info: 1, advertencia: 2, error: 3, critica: 4 };

  const fmt2 = (v) => (v < 0 ? "-" : "") + Math.abs(v).toLocaleString("es-CO", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  function control(numero, clave, titulo, descripcion) {
    return { numero, clave, titulo, descripcion, hallazgos: [], resumen: "" };
  }
  const severidadDe = (c) => c.hallazgos.reduce((m, h) => (SEV[h.severidad] > SEV[m] ? h.severidad : m), "ok");

  function validar(b, periodosGuardados, mapeo, opciones = {}) {
    const tolRed = Number(opciones.tolRedondeo ?? 10); // diferencias de centavos acumulados
    const C = [];
    const fs = [...b.filas.values()];

    // 1. Ecuación patrimonial
    let c = control(1, "ecuacion", "Ecuación patrimonial", "Activo = Pasivo + Patrimonio + Resultado del ejercicio (±1), en saldo anterior y nuevo saldo.");
    for (const [k, et] of [["sa", "saldo anterior"], ["ns", "nuevo saldo"]]) {
      const A = valor(b, "1", k), P = -valor(b, "2", k), PT = -valor(b, "3", k), R = resultado(b, k);
      const dif = A - (P + PT + R);
      if (Math.abs(dif) > tolRed) c.hallazgos.push({ severidad: "error", mensaje: `Descuadre en ${et}: diferencia ${fmt2(dif)}` });
      else if (Math.abs(dif) > 0.005) c.hallazgos.push({ severidad: "info", mensaje: `Diferencia por redondeo en ${et}: ${fmt2(dif)} (dentro de la tolerancia de ${fmt2(tolRed)}). Viene de comprobantes con débitos y créditos distintos por centavos en el software contable.` });
      if (k === "ns") c.resumen = `Activo ${fmt2(A)} = Pasivo ${fmt2(P)} + Patrimonio ${fmt2(PT)} + Resultado ${fmt2(R)} → diferencia ${fmt2(dif)}`;
    }
    // Sumas iguales del período: identifica el mes en que nace un descuadre.
    const clases = [...b.filas.values()].filter((f) => f.dig === 1);
    const difMes = clases.reduce((s, f) => s + f.d - f.c, 0);
    if (Math.abs(difMes) > 0.005) c.hallazgos.push({ severidad: Math.abs(difMes) > tolRed ? "error" : "info", mensaje: `En este período los ${difMes > 0 ? "débitos superan a los créditos" : "créditos superan a los débitos"} en ${fmt2(Math.abs(difMes))}. Hay comprobantes descuadrados en el software contable entre el ${b.desde} y el ${b.hasta}; corríjalos con un ajuste al peso (cuentas 429581 o 539595).` });
    if (b.desde.slice(5) === "01-01") {
      for (const cl of ["4", "5", "6", "7"]) {
        const v = valor(b, cl, "sa");
        if (Math.abs(v) > TOL) c.hallazgos.push({ severidad: "error", cuenta: cl, mensaje: `La clase ${cl} trae saldo anterior ${fmt2(v)} en un archivo que empieza el 1 de enero; las cuentas de resultado deberían iniciar en cero.` });
      }
    }
    C.push(c);

    // 2. Saldo por fila
    c = control(2, "filas", "Saldo por fila", "Saldo anterior + Débito − Crédito = Nuevo saldo, en cada fila.");
    for (const f of fs) {
      const dif = f.sa + f.d - f.c - f.ns;
      if (Math.abs(dif) > TOL) c.hallazgos.push({ severidad: "error", cuenta: f.cuenta, mensaje: `${f.cuenta} ${f.nombre}: diferencia ${fmt2(dif)}` });
    }
    c.resumen = `${fs.length} filas revisadas, ${c.hallazgos.length} con diferencia.`;
    C.push(c);

    // 3. Centros de costo
    c = control(3, "centros", "Distribución por centros de costo", "Suma de las columnas de centro de costo = Débito − Crédito, en cada fila.");
    if (!b.centros.length) c.hallazgos.push({ severidad: "advertencia", mensaje: "El archivo no trae columnas de centro de costo." });
    else for (const f of fs) {
      const dif = f.cc.reduce((s, v) => s + v, 0) - (f.d - f.c);
      if (Math.abs(dif) > TOL) c.hallazgos.push({ severidad: "error", cuenta: f.cuenta, mensaje: `${f.cuenta} ${f.nombre}: diferencia ${fmt2(dif)}` });
    }
    c.resumen = `${b.centros.length} centros (${b.centros.map((x) => x.nombre).join(", ")}); ${c.hallazgos.length} filas con diferencia.`;
    C.push(c);

    // 4. Jerarquía
    c = control(4, "jerarquia", "Cuadre jerárquico del PUC", "Cada cuenta padre = suma de sus hijas inmediatas, en todas las columnas.");
    const hijasDe = new Map();
    for (const f of fs) if (f.padre) { if (!hijasDe.has(f.padre)) hijasDe.set(f.padre, []); hijasDe.get(f.padre).push(f); }
    for (const [padre, hijas] of hijasDe) {
      const p = b.filas.get(padre);
      const difs = [];
      for (const k of CAMPOS) { const d = p[k] - hijas.reduce((s, h) => s + h[k], 0); if (Math.abs(d) > TOL) difs.push([{ sa: "saldo anterior", d: "débito", c: "crédito", ns: "nuevo saldo" }[k], d]); }
      p.cc.forEach((v, i) => { const d = v - hijas.reduce((s, h) => s + (h.cc[i] || 0), 0); if (Math.abs(d) > TOL) difs.push([b.centros[i].nombre, d]); });
      if (!difs.length) continue;
      const grave = p.dig <= 4;
      c.hallazgos.push({
        severidad: grave ? "error" : "advertencia", cuenta: padre,
        mensaje: `${padre} ${p.nombre}: no es igual a la suma de sus hijas (${difs.map(([n, d]) => `${n} ${fmt2(d)}`).join("; ")}).` +
          (grave ? "" : " Hay valores registrados directamente en la subcuenta; las notas los muestran como “registrado sin auxiliar”."),
      });
    }
    for (const cl of ["1", "2", "3"]) if (!b.filas.has(cl)) c.hallazgos.push({ severidad: "advertencia", mensaje: `No existe la fila de la clase ${cl}.` });
    c.resumen = `${hijasDe.size} cuentas padre revisadas, ${c.hallazgos.length} con diferencia.`;
    C.push(c);

    // 5. Naturaleza contraria
    c = control(5, "naturaleza", "Saldos contrarios a la naturaleza", "Cuentas de nivel 4 o inferior con saldo de signo contrario a su naturaleza. Se reporta la de mayor nivel.");
    const activo = valor(b, "1");
    const reportadas = [];
    // Si el mapeo presenta 1399 como cartera (regla propia en el activo), su naturaleza es débito.
    const cartera1399 = (mapeo || []).some((r) => r.prefijo === "1399" && r.estado === "ESF" && r.seccion === "activo");
    const f1399 = b.filas.get("1399");
    if (cartera1399 && f1399 && f1399.ns > TOL) {
      c.hallazgos.push({ severidad: "info", cuenta: "1399", mensaje: `1399 ${f1399.nombre}: saldo débito de ${fmt2(f1399.ns)} presentado como “Deudores de difícil cobro en procesos jurídicos” (activo no corriente, nota 1.5). En el PUC la 1399 es una cuenta correctora; conviene reclasificar esta cartera a 1390 “Deudas de difícil cobro” y evaluar su deterioro (NIIF para las Pymes, sección 11).` });
      reportadas.push("1399");
    }
    for (const cod of b.codigos) {
      const f = b.filas.get(cod);
      if (f.dig < 4 || reportadas.some((r) => cod.startsWith(r))) continue;
      let esp = NAT_CLASE[cod[0]];
      if (!esp) continue;
      if (NAT_INVERSA.some((p) => cod.startsWith(p))) esp = -esp;
      if (Math.abs(f.ns) <= TOL || f.ns * esp > 0) continue;
      reportadas.push(cod);
      const lado = f.ns > 0 ? "DÉBITO" : "CRÉDITO";
      const critica = CRITICAS.some((p) => cod.startsWith(p));
      const normal = CONTRAPARTIDA.test(f.nombre);
      let mensaje = `${cod} ${f.nombre}: saldo ${lado} de ${fmt2(Math.abs(f.ns))}`;
      if (cod.startsWith("1399") && f.ns > 0 && activo) {
        mensaje += `. El deterioro de cartera es una cuenta correctora (crédito); un saldo débito sugiere cartera mal clasificada. Equivale al ${(f.ns / activo * 100).toLocaleString("es-CO", { maximumFractionDigits: 1, minimumFractionDigits: 1 })} % del activo y afecta todos los indicadores. Revíselo o reclasifíquelo antes de emitir.`;
      } else if (normal) mensaje += " (por su nombre parece una contrapartida normal; verifique).";
      c.hallazgos.push({ severidad: critica ? "critica" : normal ? "info" : "advertencia", cuenta: cod, mensaje, saldo: f.ns });
    }
    c.resumen = `${c.hallazgos.length} cuentas con saldo contrario a su naturaleza.`;
    C.push(c);

    // 6. Meses faltantes
    c = control(6, "meses", "Meses faltantes en el histórico", "Para el mes y el acumulado por sede se necesitan los meses anteriores del año.");
    const [anio, mes] = anioMes(b.periodo);
    const guardados = new Set(periodosGuardados || []);
    if (b.tipo === "acumulado") {
      if (mes > 1 && !guardados.has(periodoMas(b.periodo, -1)))
        c.hallazgos.push({ severidad: "advertencia", mensaje: `Archivo acumulado: falta el corte ${periodoMas(b.periodo, -1)} para calcular las cifras del mes. Se mostrará solo el acumulado.` });
      c.resumen = "Archivo acumulado desde el 1 de enero.";
    } else {
      const faltan = [];
      for (let m = 1; m < mes; m++) if (!guardados.has(`${anio}-${pad(m)}`)) faltan.push(`${anio}-${pad(m)}`);
      faltan.forEach((p) => c.hallazgos.push({ severidad: "advertencia", mensaje: `Falta el archivo de ${p}. El ERI acumulado sale bien del “Nuevo saldo”, pero el acumulado por sede quedará sin datos.` }));
      c.resumen = mes === 1 ? "Primer mes del año: no requiere meses anteriores." : `${mes - 1 - faltan.length} de ${mes - 1} meses anteriores cargados.`;
    }
    C.push(c);

    // 7. Cuentas sin mapeo
    c = control(7, "mapeo", "Cuentas sin rubro asignado", "Cuentas de nivel 4 (o cuentas hoja de menor nivel) sin regla en el mapeo PUC → rubros.");
    let revisadas = 0;
    for (const f of fs) {
      if (!(f.dig === 4 || (f.hoja && f.dig < 4))) continue;
      revisadas++;
      if (!reglaPara(f.cuenta, mapeo)) c.hallazgos.push({ severidad: "advertencia", cuenta: f.cuenta, mensaje: `${f.cuenta} ${f.nombre} no tiene rubro asignado (saldo ${fmt2(f.ns)}). Asígnelo en Configuración → Mapeo.` });
    }
    c.resumen = `${revisadas} cuentas revisadas, ${c.hallazgos.length} sin mapeo.`;
    C.push(c);

    // 8. Cierre pendiente
    c = control(8, "cierre", "Resultado del año anterior sin trasladar", "Saldo en 3605/3610: falta registrar el cierre contable del año anterior.");
    for (const cod of ["3605", "3610"]) {
      const f = b.filas.get(cod);
      if (f && Math.abs(f.ns) > TOL) c.hallazgos.push({ severidad: "info", cuenta: cod, mensaje: `${cod} ${f.nombre} tiene ${fmt2(-f.ns)} (${f.ns < 0 ? "utilidad" : "pérdida"} de ${anio - 1}). Falta el traslado a 37; mientras tanto se presenta en “Resultados de ejercicios anteriores”.` });
    }
    c.resumen = c.hallazgos.length ? "Hay resultado del año anterior sin trasladar." : "Sin saldos pendientes.";
    C.push(c);

    // 9. Nombres que parecen códigos
    c = control(9, "nombres", "Nombres de cuenta que parecen códigos", "Nombres como “A 252598” que saldrían en las notas en lugar del nombre real.");
    for (const f of fs) if (!f.nombre || /^[A-Z]?\s*\d{4,}$/.test(f.nombre))
      c.hallazgos.push({ severidad: "info", cuenta: f.cuenta, mensaje: `${f.cuenta} se llama “${f.nombre}”.` + (f.hoja ? " Corríjalo en el software contable." : " Las notas usan el nombre de sus cuentas hoja.") });
    c.resumen = `${c.hallazgos.length} nombres sospechosos.`;
    C.push(c);

    C.forEach((x) => { x.severidad = severidadDe(x); x.ok = SEV[x.severidad] < SEV.advertencia; });
    return C;
  }

  /* ------------------------------------------------------------ histórico y vistas temporales */
  /**
   * Contexto de un corte: reúne del histórico todo lo que necesitan los estados.
   * hist: Map periodo -> balance indexado.
   */
  function contexto(hist, periodo, cfg) {
    const b = hist.get(periodo);
    if (!b) return null;
    const [anio, mes] = anioMes(periodo);
    const alertas = [];
    const g = (bal, k) => (p) => valor(bal, p, k);

    // Comparativo ESF: 31 de diciembre del año anterior.
    let comp = null;
    const apertura = [...hist.values()].filter((x) => x.desde === `${anio}-01-01`).sort((x, y) => x.periodo.localeCompare(y.periodo))[0];
    if (apertura) comp = { get: g(apertura, "sa"), bal: apertura, k: "sa", cierre: true, fecha: `${anio - 1}-12-31`, fuente: `Saldo anterior del archivo ${apertura.periodo}` };
    else if (hist.has(`${anio - 1}-12`)) comp = { get: g(hist.get(`${anio - 1}-12`), "ns"), bal: hist.get(`${anio - 1}-12`), k: "ns", cierre: false, fecha: `${anio - 1}-12-31`, fuente: `Archivo ${anio - 1}-12` };
    else alertas.push("No hay datos del 31 de diciembre anterior: el ESF se muestra sin comparativo.");

    // ERI del mes.
    let mesGet = null;
    if (b.tipo === "mensual") mesGet = g(b, "mov");
    else if (mes === 1) mesGet = g(b, "ns");
    else if (hist.has(periodoMas(periodo, -1))) { const prev = hist.get(periodoMas(periodo, -1)); mesGet = (p) => valor(b, p, "ns") - valor(prev, p, "ns"); }
    else alertas.push(`Falta el corte ${periodoMas(periodo, -1)}: no se pueden calcular las cifras del mes.`);

    // ERI acumulado del año anterior (mismo corte).
    const prevAnio = hist.get(`${anio - 1}-${pad(mes)}`);
    const acumAnt = prevAnio ? g(prevAnio, "ns") : null;
    if (!prevAnio) alertas.push(`Para el ERI comparativo cargue el balance de ${MESES[mes - 1]} de ${anio - 1}.`);

    return {
      b, periodo, anio, mes, alertas, cfg, comp,
      actual: { get: g(b, "ns"), cierre: false, fecha: finDeMes(periodo) },
      acum: g(b, "ns"), mesGet, acumAnt,
      dias: Math.round((Date.UTC(anio, mes - 1, ultimoDia(periodo)) - Date.UTC(anio, 0, 1)) / 86400000) + 1,
      sedes: vistasSede(hist, periodo),
    };
  }

  /** Funciones por sede: mes y acumulado. Devuelve null en la vista que no se puede calcular. */
  function vistasSede(hist, periodo) {
    const cacheA = new Map(), cacheM = new Map();
    const movSede = (f, p, cod) => { const i = f.centros.findIndex((c) => c.codigo === cod); return i < 0 ? 0 : valor(f, p, i); };
    const resta = (a, b) => (a && b ? (p, cod) => a(p, cod) - b(p, cod) : null);
    function acum(per) {
      if (cacheA.has(per)) return cacheA.get(per);
      const f = hist.get(per);
      let r = null;
      if (f && f.tipo === "acumulado") r = (p, cod) => movSede(f, p, cod);
      else if (f) {
        const [a, m] = anioMes(per);
        const partes = [];
        for (let k = 1; k <= m; k++) partes.push(mesF(`${a}-${pad(k)}`));
        r = partes.every(Boolean) ? (p, cod) => partes.reduce((s, fn) => s + fn(p, cod), 0) : null;
      }
      cacheA.set(per, r);
      return r;
    }
    function mesF(per) {
      if (cacheM.has(per)) return cacheM.get(per);
      const f = hist.get(per);
      let r = null;
      if (f && f.tipo === "mensual") r = (p, cod) => movSede(f, p, cod);
      else if (f) r = anioMes(per)[1] === 1 ? (p, cod) => movSede(f, p, cod) : resta(acum(per), acum(periodoMas(per, -1)));
      cacheM.set(per, r);
      return r;
    }
    // Centros que aparecen en el año hasta el corte (sedes nuevas incluidas).
    const [a, m] = anioMes(periodo);
    const centros = [];
    for (let k = 1; k <= m; k++) {
      const f = hist.get(`${a}-${pad(k)}`);
      if (f) for (const c of f.centros) { const e = centros.find((x) => x.codigo === c.codigo); if (e) e.nombre = c.nombre; else centros.push({ ...c }); }
    }
    return { centros, mes: mesF(periodo), acum: acum(periodo), mesDe: mesF };
  }

  /* ------------------------------------------------------------ ESF */
  function esf(ctx) {
    const mapeo = ctx.cfg.mapeo.filter((r) => r.estado === "ESF");
    const columnas = [ctx.actual, ctx.comp];

    function rubros(snap) {
      if (!snap) return null;
      const out = new Map();
      const add = (seccion, clasif, rubro, nota, v) => {
        const key = `${seccion}|${clasif}|${rubro}`;
        if (!out.has(key)) out.set(key, { seccion, clasif, rubro, nota, valor: 0 });
        out.get(key).valor += v;
      };
      for (const { regla, valor: v } of importesPorRegla(snap.get, mapeo)) {
        const signo = regla.seccion === "activo" ? 1 : -1;
        let rubro = regla.rubro;
        // 36: en el corte de cierre (31-dic) es el resultado de ese año; en el año en curso es de años anteriores.
        if (regla.prefijo.startsWith("36") && snap.cierre) rubro = "Resultado del ejercicio";
        add(regla.seccion, regla.seccion === "patrimonio" ? "" : (regla.clasif || "corriente"), rubro, regla.nota, signo * v);
      }
      const res = -["4", "5", "6", "7"].reduce((s, c) => s + snap.get(c), 0);
      add("patrimonio", "", "Resultado del ejercicio", "", res);
      return out;
    }
    const cols = columnas.map(rubros);
    // Orden de presentación: el del mapeo, con el resultado del ejercicio antes de ejercicios anteriores.
    const orden = [];
    for (const r of mapeo) {
      const sec = r.seccion, cl = sec === "patrimonio" ? "" : (r.clasif || "corriente");
      if (sec === "patrimonio" && r.rubro === "Resultados de ejercicios anteriores" && !orden.includes("patrimonio||Resultado del ejercicio")) orden.push("patrimonio||Resultado del ejercicio");
      const k = `${sec}|${cl}|${r.rubro}`;
      if (!orden.includes(k)) orden.push(k);
    }
    if (!orden.includes("patrimonio||Resultado del ejercicio")) orden.push("patrimonio||Resultado del ejercicio");

    const linea = (k) => {
      const base = cols.map((c) => c && c.get(k));
      const any = base.find(Boolean);
      if (!any) return null;
      const vals = base.map((x, i) => (cols[i] ? (x ? x.valor : 0) : null));
      if (vals.every((v) => v == null || Math.abs(v) < 0.5)) return null;
      return { rubro: any.rubro, nota: any.nota, vals };
    };
    const suma = (ls) => columnas.map((_, i) => (cols[i] ? ls.reduce((s, l) => s + l.vals[i], 0) : null));
    const bloque = (sec, cl) => orden.filter((k) => k.startsWith(`${sec}|${cl}|`)).map(linea).filter(Boolean);

    const ac = bloque("activo", "corriente"), anc = bloque("activo", "no_corriente");
    const pc = bloque("pasivo", "corriente"), pnc = bloque("pasivo", "no_corriente");
    const pat = bloque("patrimonio", "");
    const t = { ac: suma(ac), anc: suma(anc), pc: suma(pc), pnc: suma(pnc), pat: suma(pat) };
    t.activo = t.ac.map((v, i) => (v == null ? null : v + t.anc[i]));
    t.pasivo = t.pc.map((v, i) => (v == null ? null : v + t.pnc[i]));
    t.pyp = t.pasivo.map((v, i) => (v == null ? null : v + t.pat[i]));
    t.dif = t.activo.map((v, i) => (v == null ? null : v - t.pyp[i]));
    return { ac, anc, pc, pnc, pat, t, fechas: columnas.map((c) => c && c.fecha), comp: ctx.comp };
  }

  /* ------------------------------------------------------------ ERI */
  const SECCIONES_ERI = ["ing_op", "costo", "gasto_adm", "gasto_ven", "ing_noop", "gasto_noop", "impuesto"];
  const SIGNO_ERI = { ing_op: -1, ing_noop: -1 }; // ingresos se presentan positivos

  /** Vector de rubros del ERI (signo de presentación) para un getter. */
  function vectorERI(get, mapeo) {
    const reglas = mapeo.filter((r) => r.estado === "ERI");
    const v = new Map();
    for (const { regla, valor: x } of importesPorRegla(get, reglas)) {
      const k = `${regla.seccion}|${regla.rubro}`;
      if (!v.has(k)) v.set(k, { seccion: regla.seccion, rubro: regla.rubro, nota: regla.nota, valor: 0 });
      v.get(k).valor += (SIGNO_ERI[regla.seccion] || 1) * x;
    }
    return v;
  }

  /** Arma las líneas del ERI a partir de varios vectores (una columna por vector). */
  function lineasERI(vectores, provisionImpuesto = null) {
    const claves = [];
    for (const vec of vectores) if (vec) for (const [k, x] of vec) if (!claves.includes(k)) claves.push(k);
    const porSec = (sec) => claves.filter((k) => k.startsWith(sec + "|")).map((k) => {
      const any = vectores.find((v) => v && v.get(k)).get(k);
      return { tipo: "rubro", rubro: any.rubro, nota: any.nota, vals: vectores.map((v) => (v ? (v.get(k)?.valor || 0) : null)) };
    }).filter((l) => l.vals.some((x) => x != null && Math.abs(x) >= 0.5));
    const tot = (ls) => vectores.map((v, i) => (v ? ls.reduce((s, l) => s + l.vals[i], 0) : null));
    const op = (a, b, f) => a.map((x, i) => (x == null || b[i] == null ? null : f(x, b[i])));

    const ingOp = porSec("ing_op"), costo = porSec("costo"), gAdm = porSec("gasto_adm"), gVen = porSec("gasto_ven");
    const ingNo = porSec("ing_noop"), gNo = porSec("gasto_noop"), imp = porSec("impuesto");
    if (provisionImpuesto && provisionImpuesto.some((x) => x)) imp.push({ tipo: "rubro", rubro: "Provisión estimada de impuesto de renta", nota: "", vals: provisionImpuesto });
    const T = {};
    T.ingresos = tot(ingOp);
    T.costo = tot(costo);
    T.bruta = op(T.ingresos, T.costo, (a, b) => a - b);
    T.gastosOp = tot([...gAdm, ...gVen]);
    T.operacional = op(T.bruta, T.gastosOp, (a, b) => a - b);
    T.ingNo = tot(ingNo); T.gNo = tot(gNo);
    T.uai = op(op(T.operacional, T.ingNo, (a, b) => a + b), T.gNo, (a, b) => a - b);
    T.impuesto = tot(imp);
    T.neto = op(T.uai, T.impuesto, (a, b) => a - b);

    const L = [];
    L.push({ tipo: "seccion", rubro: "INGRESOS" }, ...ingOp, { tipo: "total", rubro: "TOTAL INGRESOS OPERACIONALES", vals: T.ingresos, clave: "ingresos" });
    L.push(...costo, { tipo: "total", rubro: "UTILIDAD BRUTA", vals: T.bruta, clave: "bruta" });
    L.push({ tipo: "seccion", rubro: "GASTOS OPERACIONALES" }, ...gAdm, ...gVen, { tipo: "subtotal", rubro: "Total gastos operacionales", vals: T.gastosOp });
    L.push({ tipo: "total", rubro: "UTILIDAD OPERACIONAL", vals: T.operacional, clave: "operacional" });
    L.push(...ingNo, ...gNo, { tipo: "total", rubro: "UTILIDAD ANTES DE IMPUESTOS", vals: T.uai, clave: "uai" });
    if (imp.length) L.push(...imp);
    L.push({ tipo: "gran", rubro: "RESULTADO INTEGRAL TOTAL", vals: T.neto, clave: "neto" });
    return { lineas: L, T };
  }

  function eri(ctx) {
    const mapeo = ctx.cfg.mapeo;
    const prov = ctx.cfg.provisionRenta && ctx.cfg.provisionRenta[ctx.periodo];
    const vecs = [vectorERI(ctx.acum, mapeo), ctx.mesGet ? vectorERI(ctx.mesGet, mapeo) : null, ctx.acumAnt ? vectorERI(ctx.acumAnt, mapeo) : null];
    const provVec = prov ? [prov.acum || 0, ctx.mesGet ? (prov.mes || 0) : null, ctx.acumAnt ? 0 : null] : null;
    const r = lineasERI(vecs, provVec);
    r.control = r.T.neto[0] - (resultado(ctx.b) - (prov?.acum || 0));
    return r;
  }

  /* ------------------------------------------------------------ ERI por sede */
  function eriSede(ctx, vista /* 'mes' | 'acum' */) {
    const cfg = ctx.cfg, mapeo = cfg.mapeo, opc = cfg.eriSede;
    const fn = ctx.sedes[vista];
    if (!fn) return { error: vista === "mes" ? "No se puede calcular el mes por sede: falta el corte anterior." : "No se puede calcular el acumulado por sede: faltan meses del año en el histórico." };
    const centros = ctx.sedes.centros;
    const esVacio = (c) => c.codigo.toUpperCase() === "VACIO" || /VACIO/i.test(c.nombre);
    const alias = (c) => (cfg.sedes[c.codigo] || c.nombre);
    let cols = centros.map((c) => ({ codigo: c.codigo, nombre: esVacio(c) ? (cfg.nombreVacio || "Administración central / No asignado") : alias(c), vacio: esVacio(c), vec: vectorERI((p) => fn(p, c.codigo), mapeo) }));
    const alertas = [];
    const totalVec = vectorERI(vista === "mes" ? ctx.mesGet || ((p) => 0) : ctx.acum, mapeo);
    const ingresos = (vec) => [...vec.values()].filter((x) => x.seccion === "ing_op").reduce((s, x) => s + x.valor, 0);

    // Pesos para prorrateos.
    function pesos(regla) {
      const sedes = cols.filter((c) => !c.vacio);
      if (regla === "fijo") {
        const w = sedes.map((c) => Number(opc.fijos?.[c.codigo] || 0));
        const s = w.reduce((a, b) => a + b, 0);
        if (Math.abs(s - 100) > 0.01) alertas.push(`Los porcentajes fijos suman ${s.toLocaleString("es-CO")} % y deberían sumar 100 %.`);
        return w.map((x) => (s ? x / s : 1 / sedes.length));
      }
      const ing = sedes.map((c) => Math.max(ingresos(c.vec), 0));
      const s = ing.reduce((a, b) => a + b, 0);
      if (!s) { alertas.push("Las sedes no tienen ingresos en el período; el prorrateo se hizo en partes iguales."); return sedes.map(() => 1 / sedes.length); }
      return ing.map((x) => x / s);
    }

    // Gastos corporativos: se retiran del centro origen y se reparten como una sola línea.
    let corporativos = null;
    const corp = opc.corporativo;
    if (corp?.activo && corp.cuentas?.length) {
      const origen = cols.find((c) => c.codigo === corp.centro);
      if (!origen) alertas.push(`El centro origen de gastos corporativos (${corp.centro}) no existe en el período.`);
      else {
        const prefs = corp.cuentas.filter((p) => !corp.cuentas.some((o) => o !== p && p.startsWith(o)));
        let pool = 0;
        for (const p of prefs) {
          const regla = reglaPara(p, mapeo.filter((r) => r.estado === "ERI"));
          if (!regla) continue;
          const v = (SIGNO_ERI[regla.seccion] || 1) * fn(p, origen.codigo);
          const k = `${regla.seccion}|${regla.rubro}`;
          if (origen.vec.has(k)) origen.vec.get(k).valor -= v;
          pool += SIGNO_ERI[regla.seccion] ? -v : v; // gasto positivo
        }
        corporativos = { total: pool, regla: corp.regla };
      }
    }

    // Columna VACIO: aparte, asignada a una sede (por defecto PV1 SM) o prorrateada.
    if (opc.vacio === "centro") {
      const destino = cols.find((c) => !c.vacio && c.codigo === (opc.vacioCentro || "1"));
      if (!destino) alertas.push(`La sede destino de lo no asignado (código ${opc.vacioCentro || "1"}) no existe en el período; se muestra como columna aparte.`);
      else {
        for (const v of cols.filter((c) => c.vacio)) for (const [k, x] of v.vec) {
          if (!destino.vec.has(k)) destino.vec.set(k, { ...x, valor: 0 });
          destino.vec.get(k).valor += x.valor;
        }
        cols = cols.filter((c) => !c.vacio);
      }
    } else if (opc.vacio !== "columna") {
      const vac = cols.filter((c) => c.vacio);
      const sedes = cols.filter((c) => !c.vacio);
      if (vac.length && sedes.length) {
        const w = pesos(opc.vacio === "fijo" ? "fijo" : "ingresos");
        for (const v of vac) for (const [k, x] of v.vec) sedes.forEach((s, i) => {
          if (!s.vec.has(k)) s.vec.set(k, { ...x, valor: 0 });

      const sedes = cols.map((c, i) => (c.vacio ? null : i)).filter((i) => i != null);
      const w = pesos(corporativos.regla === "fijo" ? "fijo" : "ingresos");
      asignado = new Array(n + 1).fill(0);
      sedes.forEach((ci, k) => { asignado[ci] = corporativos.total * w[k]; });
      asignado[n] = corporativos.total;
      // Las columnas de sede ya no tienen el gasto corporativo; la columna Total sí (viene del ERI completo).
      const neto = r.T.neto;
      const contrib = neto.map((x, i) => (i === n ? x + corporativos.total : x));
      r.lineas = r.lineas.map((l) => (l.clave === "neto" ? { ...l, rubro: "CONTRIBUCIÓN DE LA SEDE (antes de gastos corporativos)", tipo: "total", vals: contrib } : l));
      r.lineas.push({ tipo: "rubro", rubro: "Gastos corporativos distribuidos", vals: asignado });
      r.lineas.push({ tipo: "gran", rubro: "RESULTADO NETO DE LA SEDE", vals: contrib.map((x, i) => x - asignado[i]), clave: "netoSede" });

    const ing = r.T.ingresos;

    const control = final.slice(0, n).reduce((s, x) => s + x, 0) - final[n];
    // Indicadores por sede.
    const pers = (cod) => fn("5105", cod) + fn("5205", cod);
    const indicadores = cols.map((c, i) => ({
      nombre: c.nombre, ventas: ing[i],
      margenBruto: ing[i] ? r.T.bruta[i] / ing[i] : null,
      margenOperacional: ing[i] ? r.T.operacional[i] / ing[i] : null,

    const ranking = indicadores.filter((x) => !x.vacio).sort((a, b) => b.ventas - a.ventas).map((x) => x.nombre);
    return { columnas: [...cols.map((c) => c.nombre), "Total"], lineas: r.lineas, T: r.T, participacion, control, alertas, indicadores, ranking, corporativos };
  }

  /* ------------------------------------------------------------ P y G lineal mensualizado por sede (gerencial) */
  // Grupos de gasto operacional (cuentas 51 administración + 52 ventas, por concepto PUC a 4 dígitos).
  const GRUPOS_GASTO = [
    ["personal", "Gastos de personal", ["5105", "5205"]],
    ["honorarios", "Honorarios", ["5110", "5210"]],
    ["impuestos", "Impuestos (ICA, predial…)", ["5115", "5215"]],
    ["arriendos", "Arrendamientos", ["5120", "5220"]],
    ["seguros", "Seguros", ["5130", "5230"]],
    ["servicios", "Servicios", ["5135", "5235"]],
    ["mantenimiento", "Mantenimiento y adecuaciones", ["5145", "5150", "5245", "5250"]],
    ["deprec", "Depreciaciones y amortiz.", ["5160", "5165", "5260", "5265"]],
  ];
  /** Una fila de valores del PyG para una función f(prefijo) del mes (débito +). */
  function lineaPyG(f) {
    const v = {};
    v.ventasBrutas = -(f("41") - f("4175"));
    v.devoluciones = f("4175");
    v.ventas = -f("41");
    v.costo = f("6") + f("7");
    v.bruta = v.ventas - v.costo;
    let listados = 0;
    for (const [k, , ps] of GRUPOS_GASTO) { v[k] = ps.reduce((s, p) => s + f(p), 0); listados += v[k]; }
    v.gastosOp = f("51") + f("52");
    v.otrosGastos = v.gastosOp - listados;
    v.operacional = v.bruta - v.gastosOp;
    v.ebitda = v.operacional + v.deprec;
    v.otrosIngresos = -f("42");
    v.noOperacionales = f("53");
    v.uai = v.operacional + v.otrosIngresos - v.noOperacionales;

  }
  const sumaLinea = (a, b, w = 1) => { const r = { ...a }; for (const k of Object.keys(b)) r[k] = (r[k] || 0) + b[k] * w; return r; };
  /** PyG mes a mes por sede del año del período, con el mismo período del año anterior si está en el histórico. */
  function pygLineal(hist, periodo, cfg) {
    const [anio, mes] = anioMes(periodo);
    const opc = cfg.eriSede || {};
    const esVacio = (c) => c.codigo.toUpperCase() === "VACIO" || /VACIO/i.test(c.nombre);
    function anioDatos(a, hasta) {
      const V = vistasSede(hist, `${a}-${pad(hasta)}`);
      const centros = V.centros;
      const meses = [];
      for (let m = 1; m <= hasta; m++) {
        const per = `${a}-${pad(m)}`;
        const fn = hist.has(per) ? V.mesDe(per) : null;
        if (!fn) { meses.push(null); continue; }
        const porCentro = new Map(centros.map((c) => [c.codigo, lineaPyG((p) => fn(p, c.codigo))]));
        // Lo que no tiene centro de costo: a la sede principal, columna aparte o prorrateado.
        const vac = centros.filter(esVacio), sedes = centros.filter((c) => !esVacio(c));
        if (vac.length && opc.vacio !== "columna") {
          let w;
          if (opc.vacio === "centro") w = sedes.map((c) => (c.codigo === (opc.vacioCentro || "1") ? 1 : 0));
          else if (opc.vacio === "fijo") { const x = sedes.map((c) => Number(opc.fijos?.[c.codigo] || 0)); const t = x.reduce((p, q) => p + q, 0); w = x.map((y) => (t ? y / t : 1 / sedes.length)); }
          else { const x = sedes.map((c) => Math.max(porCentro.get(c.codigo).ventas, 0)); const t = x.reduce((p, q) => p + q, 0); w = x.map((y) => (t ? y / t : 1 / sedes.length)); }
          if (!w.some((x) => x)) w = sedes.map(() => 1 / sedes.length);
          for (const v of vac) { const lv = porCentro.get(v.codigo); sedes.forEach((c, i) => { if (w[i]) porCentro.set(c.codigo, sumaLinea(porCentro.get(c.codigo), lv, w[i])); }); porCentro.delete(v.codigo); }
        }
        meses.push(porCentro);
      }
      const visibles = centros.filter((c) => opc.vacio === "columna" || !esVacio(c));
      return { centros: visibles, meses };
    }
    const act = anioDatos(anio, mes);
    const ant = [...Array(mes).keys()].some((i) => hist.has(`${anio - 1}-${pad(i + 1)}`)) ? anioDatos(anio - 1, mes) : null;
    return { anio, mes, centros: act.centros, meses: act.meses, anterior: ant, grupos: GRUPOS_GASTO };
  }


  /* ------------------------------------------------------------ balance por tercero (FunBalanceTotalNit) */
  const PREF_TERCEROS = ["13", "21", "22", "23"];
  /** Fila de encabezados del balance por tercero, o -1 si el archivo no lo es. */
  function filaEncTerceros(filas) {
    for (let i = 0; i < Math.min(15, filas.length); i++) {
      const t = (filas[i] || []).map(norm);
      if (t.includes("cuenta") && t.includes("nit") && t.includes("nombre nit") && t.includes("nuevo saldo")) return i;
    }
    return -1;
  }
  function interpretarTerceros(filas, archivo = "") {
    const ie = filaEncTerceros(filas);
    if (ie < 1) throw new ErrorLectura("No se encontró el encabezado del balance por tercero (Cuenta, Nit, Nombre Nit … Nuevo Saldo).");
    const enc = filas[ie].map(norm), fPer = filas[ie - 1] || [], fEmp = ie >= 2 ? filas[ie - 2] || [] : [];
    const desde = aFecha(valorTrasEtiqueta(fPer, "desde")), hasta = aFecha(valorTrasEtiqueta(fPer, "hasta"));
    if (!hasta) throw new ErrorLectura("No se pudo leer la fecha 'Hasta' del balance por tercero.");
    const col = (n) => enc.indexOf(n);
    const pos = { cuenta: col("cuenta"), nombre: col("nombre cuenta"), nit: col("nit"), tercero: col("nombre nit"), sa: col("saldo anterior"), d: col("debito"), c: col("credito"), ns: col("nuevo saldo"), tel: col("telefono"), email: col("email"), ciudad: col("ciudad") };
    for (const k of ["cuenta", "nit", "tercero", "sa", "d", "c", "ns"]) if (pos[k] < 0) throw new ErrorLectura(`Falta la columna ${k} en el balance por tercero.`);
    const rows = [], cuentas = {}, totales = {};
    for (const f of filas.slice(ie + 1)) {
      if (!f) continue;
      const cuenta = aCuenta(f[pos.cuenta]);
      if (!/^\d+$/.test(cuenta) || !PREF_TERCEROS.some((p) => cuenta.startsWith(p))) continue;
      const nit = limpiar(f[pos.nit]);
      if (!nit) { cuentas[cuenta] = limpiar(f[pos.nombre]); totales[cuenta] = aNumero(f[pos.ns]); continue; }
      const g = (k) => (pos[k] >= 0 ? limpiar(f[pos[k]]) : "");
      rows.push({ cuenta, nit: nit.replace(/-\d$/, ""), nombre: limpiar(f[pos.tercero]), sa: aNumero(f[pos.sa]), d: aNumero(f[pos.d]), c: aNumero(f[pos.c]), ns: aNumero(f[pos.ns]), tel: g("tel").replace(/^-/, ""), email: g("email"), ciudad: g("ciudad") });
    }
    if (!rows.length) throw new ErrorLectura("El balance por tercero no trae saldos de las cuentas 13, 21, 22 ni 23.");
    // Control interno: la suma de terceros de cada cuenta debe dar el saldo de la cuenta.
    const advertencias = [], porCuenta = {};
    for (const c of Object.keys(totales)) { const xs = rows.filter((r) => r.cuenta.startsWith(c)); if (xs.length) porCuenta[c] = xs.reduce((s, r) => s + r.ns, 0); }
    // Solo se controlan las cuentas cuyas subcuentas traen todas detalle por tercero.
    const conDetalle = (c) => Object.keys(totales).filter((h) => h !== c && h.startsWith(c)).every((h) => porCuenta[h] != null || Object.keys(totales).some((k) => k !== h && k.startsWith(h)));
    for (const [c, v] of Object.entries(porCuenta)) if (Math.abs(totales[c] - v) > 1 && conDetalle(c) && Object.keys(totales).some((h) => h !== c && h.startsWith(c)) === false) advertencias.push(`La cuenta ${c} ${cuentas[c] || ""} suma $${Math.round(v).toLocaleString("es-CO")} por terceros, pero su total en el reporte es $${Math.round(totales[c]).toLocaleString("es-CO")}.`);
    return { tipo: desde && desde.slice(0, 7) === hasta.slice(0, 7) ? "mensual" : "acumulado", desde, hasta, periodo: periodoDe(hasta), archivo, nit: limpiar(valorTrasEtiqueta(fEmp, "nit")), rows, cuentas, totales, advertencias };
  }
  const CAMPOS_TER = ["cuenta", "nit", "nombre", "sa", "d", "c", "ns", "tel", "email", "ciudad"];
  function terADocumento(T) {
    return { periodo: T.periodo, desde: T.desde, hasta: T.hasta, tipo: T.tipo, archivo: T.archivo, nit: T.nit, cuentas: T.cuentas, totales: T.totales, advertencias: T.advertencias,

  }
  function terDeDocumento(d) {

  }

  /* ------------------------------------------------------------ ECP */
  function ecp(ctx, E) {
    if (!E.comp) return { error: "Sin comparativo al 31 de diciembre no se puede construir el Estado de Cambios en el Patrimonio." };
    const filas = E.pat.map((l) => ({ concepto: l.rubro, inicial: l.vals[1], final: l.vals[0], aumento: 0, disminucion: 0 }));
    const get = (n) => filas.find((f) => f.concepto === n);
    const res = get("Resultado del ejercicio"), ant = get("Resultados de ejercicios anteriores");
    const notas = [];
    if (res) {
      const traslado = res.inicial;
      const periodo = res.final;
      if (ant && Math.abs(traslado) > 0.5) {
        if (traslado >= 0) { res.disminucion += traslado; ant.aumento += traslado; } else { res.aumento += -traslado; ant.disminucion += -traslado; }
        notas.push({ texto: `Traslado del resultado de ${ctx.anio - 1} a resultados de ejercicios anteriores`, valor: traslado });
      }
      if (periodo >= 0) res.aumento += periodo; else res.disminucion += -periodo;
    }
    for (const f of filas) {
      const resid = f.final - (f.inicial + f.aumento - f.disminucion);
      if (Math.abs(resid) > 0.5) { if (resid > 0) f.aumento += resid; else f.disminucion += -resid; if (f === ant && resid < 0) notas.push({ texto: "Dividendos u otras disminuciones de ejercicios anteriores", valor: -resid }); }
    }
    const total = { concepto: "TOTAL PATRIMONIO", inicial: 0, aumento: 0, disminucion: 0, final: 0 };
    for (const f of filas) for (const k of ["inicial", "aumento", "disminucion", "final"]) total[k] += f[k];

    return { filas, total, notas, control: total.final - E.t.pat[0] };
  }

  /* ------------------------------------------------------------ EFE (método indirecto) */
  function efe(ctx, E, R) {

    const resultadoPeriodo = R.T.neto[0];
    const dep = -(d("1592")), amort = -(d("1597") + d("1598") + d("1698"));
    linea("op", "Resultado del período", resultadoPeriodo);
    linea("op", "(+) Depreciación del período", dep);
    linea("op", "(+) Amortizaciones del período", amort);
    const provRenta = cfg.provisionRenta?.[ctx.periodo]?.acum || 0;
    linea("op", "(+) Provisión estimada de impuesto (no pagada)", provRenta);
    const antesCT = L.filter((x) => x.seccion === "op").reduce((s, x) => s + x.valor, 0);
    L.push({ seccion: "op", concepto: "Flujo operativo antes de cambios en el capital de trabajo", valor: antesCT, subtotal: true });
    linea("op", "(Aumento) disminución en deudores y cuentas por cobrar", -d("13"));
    linea("op", "(Aumento) disminución en inventarios", -d("14"));
    linea("op", "(Aumento) disminución en diferidos", -d("17"));
    linea("op", "Aumento (disminución) en proveedores", -d("22"));
    linea("op", "Aumento (disminución) en cuentas por pagar", -(d("23") - d("2355")));
    linea("op", "Aumento (disminución) en impuestos, gravámenes y tasas", -d("24"));
    linea("op", "Aumento (disminución) en beneficios a empleados", -d("25"));
    linea("op", "Aumento (disminución) en pasivos estimados y provisiones", -d("26"));
    linea("op", "Aumento (disminución) en otros pasivos y diferidos", -(d("27") + d("28")));

  /* ------------------------------------------------------------ notas específicas */
  const ordenNota = (n) => n.split(".").map((x) => x.padStart(3, "0")).join(".");

  /**
   * Una nota por número de nota del mapeo (1.1, 1.2 … 6.1). Balance: detalle por cuenta
   * hoja (con nombre real) actual vs. 31-dic. Resultados: acumulado, mes, % del total y
   * % de ingresos operacionales. Las partidas menores al umbral se agrupan.
   */
  function notas(ctx, E, R) {
    const cfg = ctx.cfg, b = ctx.b, umbral = cfg.umbralNotas ?? 0.01;
    const reglas = cfg.mapeo.filter((r) => r.nota && (r.estado === "ESF" || r.estado === "ERI"));
    const grupos = new Map();
    for (const r of reglas) { if (!grupos.has(r.nota)) grupos.set(r.nota, []); grupos.get(r.nota).push(r); }
    const hijos = (bal, cod) => [...bal.filas.values()].filter((f) => f.padre === cod).map((f) => f.cuenta);
    const valorEn = (get, bal, cod) => {
      if (!cod.endsWith("*")) return get(cod);
      const p = cod.slice(0, -1);
      return get(p) - hijos(bal, p).reduce((s, h) => s + get(h), 0);
    };
    const salida = [];
    for (const [nota, rs] of [...grupos].sort((x, y) => ordenNota(x[0]).localeCompare(ordenNota(y[0])))) {
      const estado = rs[0].estado;
      const prefijos = rs.map((r) => r.prefijo);
      const excluir = cfg.mapeo.filter((o) => !rs.includes(o) && prefijos.some((p) => o.prefijo.startsWith(p) && o.prefijo.length > p.length)).map((o) => o.prefijo);
      const dentro = (cod) => prefijos.some((p) => cod.startsWith(p)) && !excluir.some((x) => cod.startsWith(x));
      const nivel = estado === "ESF" ? "hoja" : (cfg.nivelNotas?.[nota] || (["4.1", "6.1"].includes(nota) ? "hoja" : "cuenta"));
      const signo = estado === "ESF" ? (rs[0].seccion === "activo" ? 1 : -1) : (SIGNO_ERI[rs[0].seccion] || 1);
      const balances = [b];
      if (estado === "ESF" && ctx.comp?.bal && ctx.comp.bal !== b) balances.push(ctx.comp.bal);
      const codigos = new Map();
      for (const bal of balances) {
        for (const p of prefijos) {
          const lista = nivel === "hoja" ? detalle(bal, p) : [...bal.filas.values()].filter((f) => f.cuenta.startsWith(p) && (f.dig === 4 || (f.hoja && f.dig < 4)));
          for (const f of lista) if (dentro(f.cuenta.replace("*", "")) && !codigos.has(f.cuenta)) codigos.set(f.cuenta, { nombre: f.nombre, bal });
        }
      }
      let filas = [];
      const fmtNombre = (n) => (n ? n.charAt(0).toUpperCase() + n.slice(1).toLowerCase() : n);
      for (const [cod, info] of [...codigos].sort((x, y) => x[0].localeCompare(y[0]))) {
        const nombre = (/^159[2-8]/.test(cod) ? "Depreciación acumulada – " : "") + fmtNombre(info.nombre);
        if (estado === "ESF") {
          const a = signo * valorEn(ctx.actual.get, b, cod);
          const c = ctx.comp ? signo * valorEn(ctx.comp.get, ctx.comp.bal, cod) : null;
          if (Math.abs(a) < 0.5 && (c == null || Math.abs(c) < 0.5)) continue;
          filas.push({ cuenta: cod, nombre, vals: [a, c] });
        } else {
          const a = signo * valorEn(ctx.acum, b, cod);
          const m = ctx.mesGet ? signo * valorEn(ctx.mesGet, b, cod) : null;
          if (Math.abs(a) < 0.5 && (m == null || Math.abs(m) < 0.5)) continue;
          filas.push({ cuenta: cod, nombre, vals: [a, m] });
        }
      }
      // Patrimonio: el resultado del ejercicio en curso se calcula (no está en una cuenta).
      if (estado === "ESF" && rs[0].seccion === "patrimonio") {
        const res = (get) => -["4", "5", "6", "7"].reduce((s, x) => s + get(x), 0);
        filas.push({ cuenta: "", nombre: "Resultado del ejercicio en curso (ERI)", vals: [res(ctx.actual.get), ctx.comp ? res(ctx.comp.get) : null] });
      }
      const total = [0, 1].map((i) => (filas.some((f) => f.vals[i] != null) ? filas.reduce((s, f) => s + (f.vals[i] || 0), 0) : null));
      // Agrupar partidas menores al umbral.
      const menor = (f) => f.cuenta && f.vals.every((v, i) => v == null || !total[i] || Math.abs(v) < umbral * Math.abs(total[i]));
      const chicas = filas.filter(menor);

      if (f.c > 0) movimientos.push({ cuenta: f.cuenta, doc: "Causado en el mes", nit: "", tercero: "Sin discriminar", base: 0, debito: 0, credito: f.c, tarifa: 0, desdeBalance: true });

  /**
   * Liquida el período.
   * reporte: lo que devuelve leerReporte (o null si no se ha cargado).
   * balance: getters del mes desde el balance cargado: { mes(prefijo) } (débito +).
   */
  function liquidar(reporte, cfg, balance, periodo) {
    const alertas = [];
    const filasConcepto = new Map(); // concepto -> {base, retencion, cuentas:Set}
    const add = (concepto, base, ret, tipo = "") => {
      const k = concepto + "|" + tipo;
      if (!filasConcepto.has(k)) filasConcepto.set(k, { concepto, tipo, base: 0, retencion: 0, cuentas: new Set(), derivadas: 0 });
      const f = filasConcepto.get(k);

    };

    const detalle = [];
    const pendientes = [];
    let liquidacionContable = null;
    if (reporte) {
      const nombreCuenta = Object.fromEntries(reporte.cuentas.map((c) => [c.cuenta, c.nombre]));
      for (const c of reporte.cuentas) {
        const concepto = conceptoDe(c.cuenta, cfg);
        if (!concepto) continue;
        if (Math.abs(c.saldoAnterior) >= 1) {
          const incluir = Boolean(cfg.incluirSaldoAnterior?.[periodo]?.[c.cuenta]);
          pendientes.push({ cuenta: c.cuenta, nombre: c.nombre, saldo: c.saldoAnterior, incluir });
          if (incluir && c.saldoAnterior < 0) { const f = add(concepto, 0, -c.saldoAnterior, concepto.startsWith("iva") ? "" : (concepto === "trabajo" ? "natural" : "juridica")); f.cuentas.add(c.cuenta); }
        }
