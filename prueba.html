        const mF = textos[0].match(/^(\d{1,2})\/(\d{2})$/);
        if (!mF || c[0].x > 80) continue;
        const nums = c.filter((x) => esMonto(x.t) && x.x > (col.dcto ?? 350) - 10);
        if (nums.length < 2) continue;
        const saldo = numero(nums.at(-1).t), valor = numero(nums.at(-2).t);
        const desc = c.filter((x, i) => i > 0 && x.x < (col.suc ?? 240) - 8 && !nums.includes(x)).map((x) => x.t).join(" ");
        const sucursal = c.filter((x) => col.suc != null && x.x >= col.suc - 8 && x.x < (col.dcto ?? 350) - 8 && !nums.includes(x)).map((x) => x.t).join(" ");
        const dcto = c.filter((x) => col.dcto != null && x.x >= col.dcto - 8 && !nums.includes(x)).map((x) => x.t).join(" ");
        const anio = per ? (Number(mF[2]) < Number(per[2]) ? per[4] : per[1]) : new Date().getFullYear();
        movs.push({ fecha: iso(anio, mF[2], mF[1]), desc, sucursal, doc: dcto, valor, saldo });
      }
    }
    if (!movs.length) throw new Error("Se reconoció un extracto de Bancolombia, pero no se encontraron movimientos.");
    const desdeExt = per ? iso(per[1], per[2], per[3]) : movs[0].fecha;
    // Bancolombia muestra "DESDE" como el último día del mes anterior.
    const desde = per && Number(per[3]) > 27 ? sumarDias(desdeExt, 1) : desdeExt;
    return armarExtracto({ banco: "Bancolombia", cuenta, tipoCta, desde, hasta: per ? iso(per[4], per[5], per[6]) : movs.at(-1).fecha,
      saldoInicial: resumen["SALDO ANTERIOR"], saldoFinal: resumen["SALDO ACTUAL"], totalAbonos: resumen["TOTAL ABONOS"], totalCargos: resumen["TOTAL CARGOS"], retefuente: resumen.RETEFUENTE, intereses: resumen.INTERESES }, movs);
  }

  /** Banco de Bogotá (PDF): Extracto Cuenta Ahorros/Corriente · Fecha dd/mm · Cod Trans · Descripción · Ciudad · Oficina/Canal · Documento · Valor · Saldo */
  function leerBogota(paginas) {
    const todo = textoPDF(paginas);
    const cuenta = (todo.match(/Cuenta N[úu]mero:\s*(\d{6,})/i) || todo.match(/Nro Cuenta:\s*(\d{6,})/i) || [])[1] || "";
    const tipoCta = /Extracto Cuenta Corriente/i.test(todo) ? "Corriente" : "Ahorros";
    const mPer = todo.match(/FECHA EXTRACTO\s+([A-Za-zé]+)\s*-\s*([A-Za-zé]+)\s+(\d{4})/i);
    const mesN = (s) => MESES_ES.indexOf(quitarTildes(s).toLowerCase()) + 1;
    const anio = mPer ? Number(mPer[3]) : new Date().getFullYear();
    const mDes = todo.match(/Desde:\s*([A-Za-zé]+)\s+(\d{1,2})/i), mHas = todo.match(/Hasta:\s*([A-Za-zé]+)\s+(\d{1,2})/i);
    const m1 = mDes ? mesN(mDes[1]) : 1, m2 = mHas ? mesN(mHas[1]) : 12;
    const anioIni = m1 > m2 ? anio - 1 : anio;
    const val = (re) => { const m = todo.match(re); return m ? numero(m[1]) : null; };
    const R = { saldoInicial: val(/Saldo Inicial:\s*([-\d,.]+)/i), saldoFinal: val(/Saldo Final:\s*([-\d,.]+)/i), totalAbonos: val(/Abonos:\s*([-\d,.]+)/i), totalCargos: val(/Cargos:\s*([-\d,.]+)/i),
      iva: val(/Total IVA:\s*([-\d,.]+)/i), gmf: val(/4x1000 GMF:\s*([-\d,.]+)/i), retefuente: val(/Total Retenci[oó]n:\s*([-\d,.]+)/i), intereses: val(/Total Intereses:\s*([-\d,.]+)/i) };
    const movs = [];
    let col = null, ult = null, descX = null;
    for (const pagina of paginas) {
      for (const f of renglones(pagina)) {
        const c = f.celdas.filter((x) => !/^(FINANCIERA DE COLOMBIA|SUPERINTENDENCIA|VIGILADO)$/.test(x.t));
        if (!c.length) continue;
        const textos = c.map((x) => x.t);
        if (textos.includes("Fecha") && textos.some((t) => /Descripci/.test(t)) && textos.includes("Valor")) {
          const p = (re) => c.find((x) => re.test(x.t));
          col = { desc: p(/Descripci/).x, ciudad: p(/^Ciudad$/)?.x, ofi: p(/^Oficina/)?.x, docu: p(/^Documento$/)?.x, valor: p(/^Valor$/).der, saldo: p(/^Saldo$/)?.der };
          continue;
        }
        if (!col) continue;
        if (textos.some((t) => /FIN MOVIMIENTOS/i.test(t))) { ult = null; continue; }
        if (textos.some((t) => /Notificar cualquier reparo|Defensor|Valor pendiente por aplicar|Si usted desea conocer|tel[eé]fono fijo|Bogot[áa] D\.C\./i.test(t))) continue;
        const mF = textos[0].match(/^(\d{2})\/(\d{2})$/);
        if (mF && c[0].x < col.desc - 20) {
          const nums = c.filter((x) => esMonto(x.t) && x.x > (col.docu ?? 380));
          if (nums.length < 2) continue;
          const tieneCod = c[1] && /^[A-Z0-9]{2,5}$/.test(c[1].t) && c[1].x < col.desc;
          const cod = tieneCod ? c[1].t : "";
          const iniDesc = tieneCod ? 2 : 1;
          if (c[iniDesc]) descX = c[iniDesc].x;
          const fin = (col.ciudad ?? 270) - 30;
          const desc = c.filter((x, i) => i >= iniDesc && x.x < fin && !nums.includes(x)).map((x) => x.t).join(" ");
          const doc = c.filter((x) => col.docu != null && x.x >= col.docu - 15 && !nums.includes(x)).map((x) => x.t).join(" ");
          const mes = Number(mF[2]);
          ult = { fecha: iso(mes < m1 ? anioIni + 1 : anioIni, mes, mF[1]), cod, desc, doc: doc === "000000" ? "" : doc, valor: numero(nums.at(-2).t), saldo: numero(nums.at(-1).t) };
          movs.push(ult);
        } else if (ult && descX != null && c[0].x >= descX - 10 && c[0].x < (col.ciudad ?? 240) && c.every((x) => !esMonto(x.t))) {
          const extra = textos.join(" ").replace(/\.{4,}/g, "").trim();
          if (extra && !/^\d+-\d+$/.test(extra)) ult.desc += " " + extra;
        }
      }
    }
    if (!movs.length) throw new Error("Se reconoció un extracto del Banco de Bogotá, pero no se encontraron movimientos.");
    return armarExtracto({ banco: "Banco de Bogotá", cuenta, tipoCta, desde: iso(anioIni, m1, 1), hasta: finDeMes(iso(m1 > m2 ? anio : anioIni, m2, 1).slice(0, 7)), ...R }, movs);
  }

  /** Extracto genérico en PDF (Davivienda u otro banco): renglones con fecha al inicio y valores al final.
   *  El signo se toma del propio valor (-, +, paréntesis) o, si no lo trae, de la variación del saldo. */
  function leerGenerico(paginas, banco) {
    const todo = textoPDF(paginas);
    const anioTxt = (todo.match(/\b(20\d{2})\b/) || [])[1] || String(new Date().getFullYear());
    const cuenta = ((todo.match(/CUENTA (?:CORRIENTE|DE AHORROS?)\s+(\d{3,4}(?: \d{3,4}){2,3})\b/i) || todo.match(/(?:Cuenta|N[úu]mero|No\.?)\s*(?:de\s+)?(?:Ahorros|Corriente)?\s*(?:N[úu]mero|No\.?|:)?\s*[:#]?\s*(\d[\d-]{6,})/i) || [])[1] || "").replace(/\D/g, "");
    const val = (re) => { const m = todo.match(re); return m ? numero(m[1]) : null; };
    const saldoInicial = val(/Saldo\s+(?:Anterior|Inicial)[^\d$-]*\$?\s*([-\d,.]+[-+]?)/i);
    const saldoFinal = val(/(?:Saldo\s+(?:Final|Actual|Nuevo)|Nuevo\s+Saldo)[^\d$-]*\$?\s*([-\d,.]+[-+]?)/i);
    const movs = [];
    let ult = null;
    for (const pagina of paginas) {
      for (const f of renglones(pagina)) {
        const c = f.celdas;
        let linea = c.map((x) => x.t).join(" ");
        let fecha = null, resto = linea;
        let m = linea.match(/^(\d{1,2})[/ -](\d{1,2})(?:[/ -](\d{2,4}))?\s+(.*)$/);
        if (m && Number(m[2]) <= 12 && Number(m[1]) <= 31) { fecha = iso(m[3] ? (m[3].length === 2 ? "20" + m[3] : m[3]) : anioTxt, m[2], m[1]); resto = m[4]; }
        else if ((m = linea.match(/^(\d{4})[/-](\d{2})[/-](\d{2})\s+(.*)$/))) { fecha = iso(m[1], m[2], m[3]); resto = m[4]; }
        else if ((m = linea.match(/^(\d{1,2})[ -]([A-Za-z]{3})[A-Za-z]*\.?(?:[ -](\d{2,4}))?\s+(.*)$/)) && MES_ABR[m[2].toUpperCase()]) { fecha = iso(m[3] ? (m[3].length === 2 ? "20" + m[3] : m[3]) : anioTxt, MES_ABR[m[2].toUpperCase()], m[1]); resto = m[4]; }
        if (/seguro de dep[oó]sitos|www\.|Defensor|revisor[ií]a fiscal|^CUENTA (CORRIENTE|DE AHORROS?)$|NIT\.? ?\d|Inter[eé]s de Sobregiro/i.test(linea)) { ult = null; continue; }
        const nums = c.filter((x) => esMonto(x.t));
        if (!fecha || !nums.length) { if (ult && !nums.length && c.length && c[0].x > 60 && linea.length < 90) ult.desc += " " + linea; continue; }
        const vals = nums.map((x) => ({ v: numero(x.t), signo: /^-|-$|^\(/.test(x.t) ? -1 : /\+$/.test(x.t) ? 1 : 0 }));
        const saldo = vals.length >= 2 ? vals.at(-1).v : null;
        const v = vals.length >= 2 ? vals.at(-2) : vals[0];
        const desc = c.filter((x) => !nums.includes(x)).map((x) => x.t).join(" ").replace(/^\S+\s*/, "").replace(/^(\d{1,2}\s+)?/, "").trim() || resto;
        ult = { fecha, desc, doc: "", valor: v.signo ? Math.abs(v.v) * v.signo : v.v, signoExplicito: Boolean(v.signo), saldo };
        movs.push(ult);
      }
    }
    if (!movs.length) throw new Error("No se encontraron movimientos en el extracto. Si es de otro banco, expórtelo en Excel o CSV.");
    // Signos por variación del saldo cuando el valor no lo trae
    let prev = saldoInicial;
    for (const mv of movs) {
      if (!mv.signoExplicito && mv.saldo != null && prev != null) {
        const dif = r2(mv.saldo - prev);
        if (Math.abs(Math.abs(dif) - Math.abs(mv.valor)) < 0.02) mv.valor = dif;
      }
      if (mv.saldo != null) prev = mv.saldo;
      delete mv.signoExplicito;
    }
    const fs = movs.map((x) => x.fecha).sort();
    return armarExtracto({ banco, cuenta, tipoCta: /CORRIENTE/i.test(todo) ? "Corriente" : "Ahorros", desde: fs[0].slice(0, 8) + "01", hasta: finDeMes(fs.at(-1).slice(0, 7)), saldoInicial, saldoFinal }, movs);
  }

  function armarExtracto(cab, movs) {
    movs.forEach((m, i) => { m.desc = m.desc.replace(/\s+/g, " ").trim(); m.i = i; });
    const abonos = r2(movs.filter((m) => m.valor > 0).reduce((s, m) => s + m.valor, 0));
    const cargos = r2(movs.filter((m) => m.valor < 0).reduce((s, m) => s - m.valor, 0));
    if (cab.saldoInicial == null && movs[0]?.saldo != null) cab.saldoInicial = r2(movs[0].saldo - movs[0].valor);
    const calc = r2((cab.saldoInicial || 0) + abonos - cargos);
    if (cab.saldoFinal == null) cab.saldoFinal = movs.at(-1)?.saldo ?? calc;
    const avisos = [];
    if (Math.abs(calc - cab.saldoFinal) > 0.02) avisos.push(`El saldo inicial más los movimientos leídos (${calc.toFixed(2)}) no cuadra con el saldo final del extracto (${cab.saldoFinal.toFixed(2)}): diferencia ${(cab.saldoFinal - calc).toFixed(2)}. Revise que el PDF esté completo.`);
    let s = cab.saldoInicial, malos = 0;
    for (const m of movs) { s = r2(s + m.valor); if (m.saldo != null && Math.abs(m.saldo - s) > 0.02) { malos++; s = m.saldo; } }
    if (malos) avisos.push(`${malos} movimiento(s) con saldo corrido que no coincide; puede haber valores mal leídos.`);
    return { tipo: "extracto", ...cab, cuenta: String(cab.cuenta || "").replace(/\D/g, ""), sumas: { abonos, cargos }, avisos, movimientos: movs };
  }

  /** Identifica el PDF y lo lee. paginas: [[{str,x,y,w}]] */
  function leerPDF(paginas, archivo = "") {
    const todo = textoPDF(paginas);
    if (/Libro Auxiliar/i.test(todo)) return leerAuxiliarPDF(paginas);
    if (/bancolombia/i.test(todo) && /ESTADO DE CUENTA/i.test(todo)) return leerBancolombia(paginas);
    if (/bancodebogota|Banco de Bogot/i.test(todo) && /Extracto Cuenta/i.test(todo)) return leerBogota(paginas);
    const banco = /davivienda/i.test(todo + archivo) ? "Davivienda" : /bbva/i.test(todo) ? "BBVA" : /occidente/i.test(todo) ? "Banco de Occidente" : /popular/i.test(todo) ? "Banco Popular" : /av ?villas/i.test(todo) ? "AV Villas" : /caja social/i.test(todo) ? "Banco Caja Social" : "Otro banco";
    return leerGenerico(paginas, banco);
  }

  /* ------------------------------------------------------------ Excel / CSV */
  /** filas: matriz (primera hoja). Detecta si es libro auxiliar o extracto por los encabezados. */
  function leerTabla(filas, archivo = "") {
    const bold = leerPasarelaBold(filas, archivo);
    if (bold) return bold;
    const enc = (v) => norm(v);
    let iEnc = -1, mapa = null;
    for (let i = 0; i < Math.min(filas.length, 40); i++) {
      const fila = (filas[i] || []).map(enc);
      const idx = (re) => fila.findIndex((t) => re.test(t));
      const f = idx(/^FECHA/);
      if (f < 0) continue;
      const m = { fecha: f, desc: idx(/DESCRIP|CONCEPTO|DETALLE|TRANSACCION|MOVIMIENTO|REFERENCIA$/), valor: idx(/^VALOR|^MONTO|^IMPORTE/), deb: idx(/^DEBITO|^DEBITOS|^CARGO|^RETIRO|^EGRESO/), cre: idx(/^CREDITO|^CREDITOS|^ABONO|^CONSIGNA|^DEPOSITO|^INGRESO/),
        saldo: idx(/^SALDO/), doc: idx(/^NUMERO$|^DOCUMENTO|^DCTO|^COMPROBANTE|^DOC/), nit: idx(/^NIT/), tercero: idx(/^NOMBRE|^TERCERO/), cuenta: idx(/^CUENTA|^CODIGO/) };
      if (m.valor >= 0 || (m.deb >= 0 && m.cre >= 0)) { iEnc = i; mapa = m; break; }
    }
    if (!mapa) throw new Error("No se encontró una fila de encabezados con “Fecha” y “Valor” (o “Débito” y “Crédito”).");
    const nombre = norm(archivo);
    const esAux = mapa.nit >= 0 || /AUXILIAR|LIBRO/.test(nombre) || (filas.slice(0, iEnc).flat().some((v) => /Libro Auxiliar/i.test(String(v ?? ""))));
    const movs = [];
    let saldoAnterior = null;
    for (const fila of filas.slice(iEnc + 1)) {
      if (!fila) continue;
      const g = (k) => (mapa[k] >= 0 ? fila[mapa[k]] : null);
      const txt = (fila || []).map((v) => String(v ?? "")).join(" ");
      if (/SALDO ANTERIOR|SALDO INICIAL/i.test(txt) && saldoAnterior == null) { const n = (fila || []).map(numero).filter((v) => v != null); if (n.length) saldoAnterior = n.at(-1); continue; }
      if (/^\s*TOTAL/i.test(txt)) continue;
      const fecha = fechaLibre(g("fecha"));
      if (!fecha) continue;
      let deb = 0, cre = 0;
      if (mapa.deb >= 0 && mapa.cre >= 0) { deb = Math.abs(numero(g("deb")) || 0); cre = Math.abs(numero(g("cre")) || 0); }
      else { const v = numero(g("valor")) || 0; if (v >= 0) deb = v; else cre = -v; }
      const desc = String(g("desc") ?? "").trim();
      if (esAux) movs.push({ fecha, doc: String(g("doc") ?? ""), nit: String(g("nit") ?? ""), tercero: String(g("tercero") ?? ""), concepto: desc, factura: "", debito: deb, credito: cre, saldo: numero(g("saldo")) });
      else {
        // En el extracto, "Débito/Cargo" es salida y "Crédito/Abono" es entrada.
        const valor = mapa.deb >= 0 && mapa.cre >= 0 ? r2(cre - deb) : r2(deb - cre);
        movs.push({ fecha, desc, doc: String(g("doc") ?? ""), valor, saldo: numero(g("saldo")) });
      }
    }
    if (!movs.length) throw new Error("La tabla no tiene movimientos con fecha.");
    const fs = movs.map((m) => m.fecha).sort();
    if (esAux) {
      if (saldoAnterior == null) { const m0 = movs.find((m) => m.saldo != null); saldoAnterior = m0 ? r2(m0.saldo - m0.debito + m0.credito) : 0; }
      const k = { cuenta: (archivo.match(/\b(1110\d{2,6}|1120\d{2,6})\b/) || [])[1] || "", nombre: archivo, saldoAnterior, movimientos: movs, totales: null };
      validarAuxiliar(k);
      return { tipo: "auxiliar", fuente: "Libro auxiliar (Excel/CSV)", desde: fs[0].slice(0, 8) + "01", hasta: finDeMes(fs.at(-1).slice(0, 7)), cuentas: [k] };
    }
    const banco = /DAVIVIENDA/.test(nombre) ? "Davivienda" : /BANCOLOMBIA/.test(nombre) ? "Bancolombia" : /BOGOTA/.test(nombre) ? "Banco de Bogotá" : "Banco";
    return armarExtracto({ banco, cuenta: (archivo.match(/(\d{8,12})/) || [])[1] || "", tipoCta: "", desde: fs[0].slice(0, 8) + "01", hasta: finDeMes(fs.at(-1).slice(0, 7)), saldoInicial: saldoAnterior }, movs);
  }

  /* ------------------------------------------------------------ reporte de transacciones de la pasarela (Bold) */
  /**
   * Lee el "Reporte mensual de transacciones" de Bold (datáfono y links de pago).
   * Cada venta trae el valor bruto, las retenciones, la comisión y el neto que Bold deposita en el banco.
   * Devuelve { tipo:"pasarela", pasarela:"Bold", periodo, desde, hasta, txns:[…], rechazadas, totales, avisos } o null si no es ese reporte.
   */
  function leerPasarelaBold(filas, archivo = "") {
    let iEnc = -1, col = null;
    for (let i = 0; i < Math.min(filas.length, 25); i++) {
      const f = (filas[i] || []).map((v) => norm(v));
      if (!f.includes("ID TRANSACCION") || !f.some((t) => /^DEPOSITO EN SALDO/.test(t))) continue;
      const ix = (re) => f.findIndex((t) => re.test(t));
      col = { id: ix(/^ID TRANSACCION$/), fecha: ix(/^FECHA$/), op: ix(/^OPERACION$/), compra: ix(/^VALOR DE LA COMPRA$/), propina: ix(/^PROPINA$/), iva: ix(/^IVA$/), impo: ix(/^IMPOCONSUMO$/),
        total: ix(/^VALOR TOTAL$/), rf: ix(/RETE ?FUENTE/), riva: ix(/RETE ?IVA/), rica: ix(/RETE ?ICA/), comPct: ix(/^% COMISION/), comFija: ix(/^COMISION .*FIJA/), ded: ix(/^TOTAL DEDUCCION/),
        neto: ix(/^DEPOSITO EN SALDO/), datafono: ix(/^NOMBRE DEL DATAFONO/), aut: ix(/^CODIGO AUTORIZACION/), franq: ix(/^FRANQUICIA/), tipoT: ix(/^TIPO TARJETA/), metodo: ix(/^METODO DE PAGO/),
        canal: ix(/^CANAL DE VENTAS/), pagador: ix(/^NOMBRE DEL PAGADOR/), docPag: ix(/^DOCUMENTO DEL PAGADOR/), tarjeta: ix(/^TARJETA$/) };
      iEnc = i; break;
    }
    if (iEnc < 0 || col.neto < 0 || col.total < 0) return null;
    const n = (fila, k) => (col[k] >= 0 ? numero(fila[col[k]]) || 0 : 0);
    const s = (fila, k) => (col[k] >= 0 ? String(fila[col[k]] ?? "").trim() : "");
    const txns = [], rechazadas = [], avisos = [];
    for (const fila of filas.slice(iEnc + 1)) {
      if (!fila || !s(fila, "id")) continue;
      const fv = col.fecha >= 0 ? fila[col.fecha] : null;
      const fecha = fechaLibre(fv);
      if (!fecha) continue;
      const hora = fv instanceof Date ? fv.toISOString().slice(11, 19) : (String(fv).match(/(\d{1,2}:\d{2}(?::\d{2})?)/) || [])[1] || "";
      const t = { id: s(fila, "id"), fecha, hora, op: s(fila, "op"), compra: n(fila, "compra"), iva: n(fila, "iva") + n(fila, "impo"), bruto: n(fila, "total"), rf: n(fila, "rf"), riva: n(fila, "riva"), rica: n(fila, "rica"),
        com: n(fila, "comPct"), fija: n(fila, "comFija"), ded: n(fila, "ded"), neto: n(fila, "neto"), canal: s(fila, "canal"), metodo: s(fila, "metodo"), franquicia: s(fila, "franq"), pagador: s(fila, "pagador"),
        docPagador: s(fila, "docPag").replace(/\D/g, ""), datafono: s(fila, "datafono"), aut: s(fila, "aut") };
      t.ded = r2(t.ded); t.neto = r2(t.neto);
      if (!/EXITOS|APROBAD/.test(norm(t.op)) || t.neto <= 0) { rechazadas.push(t); continue; }
      const sumaDed = r2(t.rf + t.riva + t.rica + t.com + t.fija);
      if (Math.abs(sumaDed - t.ded) > 0.05) avisos.push(`${t.id}: las deducciones (${sumaDed.toFixed(2)}) no suman el total deducido (${t.ded.toFixed(2)}).`);
      if (Math.abs(r2(t.bruto - t.ded) - t.neto) > 0.05) avisos.push(`${t.id}: valor total − deducciones (${r2(t.bruto - t.ded).toFixed(2)}) no es igual al depósito (${t.neto.toFixed(2)}).`);
      txns.push(t);
    }
    if (!txns.length) throw new Error("Se reconoció el reporte de transacciones de Bold, pero no tiene cobros exitosos.");
    txns.sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));
    const meses = {}; txns.forEach((t) => { meses[t.fecha.slice(0, 7)] = (meses[t.fecha.slice(0, 7)] || 0) + 1; });
    const periodo = Object.entries(meses).sort((a, b) => b[1] - a[1])[0][0];
    const tot = (k) => r2(txns.reduce((a, t) => a + t[k], 0));
    const empresa = String((filas.slice(0, iEnc).flat().find((v) => v != null && String(v).trim()) ?? "")).trim();
    return { tipo: "pasarela", pasarela: "Bold", fuente: "Bold · Reporte mensual de transacciones", archivo, empresa, periodo, desde: txns[0].fecha, hasta: txns.at(-1).fecha, txns, rechazadas,
      totales: { n: txns.length, bruto: tot("bruto"), compra: tot("compra"), iva: tot("iva"), rf: tot("rf"), riva: tot("riva"), rica: tot("rica"), com: tot("com"), fija: tot("fija"), ded: tot("ded"), neto: tot("neto") }, avisos };
  }
  const CAMPOS_TXN = ["id", "fecha", "hora", "op", "compra", "iva", "bruto", "rf", "riva", "rica", "com", "fija", "ded", "neto", "canal", "metodo", "franquicia", "pagador", "docPagador", "datafono", "aut"];
  const NUM_TXN = new Set(["compra", "iva", "bruto", "rf", "riva", "rica", "com", "fija", "ded", "neto"]);
  function pasarelaADoc(p) {
    const { txns, rechazadas, ...cab } = p;
    return { ...cab, rechazadas: (rechazadas || []).length, filas: txns.map((t) => CAMPOS_TXN.map((k) => limpio(t[k])).join("\t")) };
  }
  function pasarelaDeDoc(d) {
    const txns = (d.filas || []).map((f) => { const p = f.split("\t"); const t = { pas: d.pasarela || "Bold" }; CAMPOS_TXN.forEach((k, i) => { t[k] = NUM_TXN.has(k) ? Number(p[i]) || 0 : p[i] || ""; }); return t; });
    return { ...d, filas: undefined, txns };
  }

  /* ------------------------------------------------------------ clasificación de movimientos del banco */
  // Orden importa: la primera regla que coincide gana. tipo: gasto/retencion (solo cargos), ingreso/abono (solo abonos), pago (solo cargos), cualquiera.
  const CATEGORIAS = [
    { id: "gmf", nombre: "Gravamen a los movimientos financieros (4x1000)", re: /4\s?X\s?1\.?000|\bGMF\b|GRAVAMEN|IMPTO GOBIERNO/, tipo: "gasto" },
    { id: "iva", nombre: "IVA sobre comisiones bancarias", re: /\bIVA\b/, tipo: "gasto" },
    { id: "retencion", nombre: "Retenciones practicadas por el banco", re: /RETEFUENTE|RETENCION|RTE\.? ?FTE|RETE ?ICA|RETE ?IVA/, tipo: "gasto" },
    { id: "cuota", nombre: "Cuotas de manejo y planes del banco", re: /CUOTA (DE )?MANEJO|C\.? ?MANEJO|MANEJO TARJ|SERVICIO MANEJO|MANEJO PORTAL|CUOTA PLAN|PLAN CANAL/, tipo: "gasto" },
    { id: "comision", nombre: "Comisiones y servicios bancarios", re: /COMISION|COMIS\b|SERVICIO PAGO|SERVICIO PAG|CARGO POR SERVICIO|COSTO TRANSACCION|CHEQUERA|TALONARIO|DISFON|SERV\.? ?BANC|PORTES|USO DEL PORTAL/, tipo: "gasto" },
    { id: "intereses", nombre: "Intereses y rendimientos financieros", re: /INTERESES (GANADOS|AHORROS|A FAVOR)|ABONO INTERESES|RENDIMIENTO/, tipo: "ingreso" },
    { id: "reversion", nombre: "Reversiones y ajustes de abonos", re: /REVERSION|REVERSO|ANULACION/, tipo: "cualquiera" },
    { id: "credito", nombre: "Pagos de obligaciones financieras", re: /CUOTA CARTERA|CUOTA DE CREDITO|PAGO (CUOTA )?CREDITO|ABONO A CREDITO|PAGO OBLIGACION|LEASING|CUOTA PRESTAMO|PAGO TARJETA (DE )?CREDITO/, tipo: "pago" },
    { id: "impuestos", nombre: "Pagos de impuestos", re: /PAGO IMPUESTOS|IMPUESTOS NAL|\bDIAN\b|SECRETARIA DE HACIENDA|PAGO PSE .*(HACIENDA|ALCALDIA|DISTRITO)/, tipo: "pago" },
    { id: "tarjetas", nombre: "Abonos netos por ventas con tarjeta y pasarelas", re: /VENTAS CON TARJETA|DEPOSITO ELECTRONICO|BOLD\.?CO|CREDIBANCO|REDEBAN|WOMPI|PAYU|DATAFONO|ABONO ESTABLECIMIENTO|ABONO NETO|AMEX|ADQ PMP|AJUSTE CUENTA .* POR ABO/, tipo: "abono" },
    { id: "nomina", nombre: "Pagos de nómina", re: /NOMIN/, tipo: "pago" },
    { id: "proveedores", nombre: "Pagos a proveedores y terceros", re: /PAGO A PROV|PAGO DE PROV|DISPERSION PAGO DE PROVEEDORES|CARGO DISPERSION|PAGO DE SERVICIOS|PAGO PSE|COMPRA |TRANSFERENCIA A |TRASLADO A|PAGO A TERCEROS|RETIRO|CHEQUE/, tipo: "pago" },
    { id: "consignacion", nombre: "Consignaciones y depósitos", re: /CONSIG|DEPOSITO|CORRESPONSAL|EFECTIVO/, tipo: "abono" },
    { id: "transferencia", nombre: "Transferencias y pagos recibidos", re: /TRANSFERENCIA|PAGO QR|PAGO LLAVE|NEQUI|INTERBANC|ACH|DISPERSION|PAGO DE PROV|PAGO A PROV|PAGO DE NOMI|PSE|ABONO/, tipo: "abono" },
  ];
  function categoria(desc, valor) {
    const d = norm(desc);
    for (const c of CATEGORIAS) {
      if (!c.re.test(d)) continue;
      if ((c.tipo === "gasto" || c.tipo === "pago") && valor > 0) continue;
      if ((c.tipo === "ingreso" || c.tipo === "abono") && valor < 0) continue;
      return c.id;
    }
    return valor >= 0 ? "otros_abonos" : "otros_cargos";
  }
  const NOMBRE_CAT = Object.fromEntries([...CATEGORIAS.map((c) => [c.id, c.nombre]), ["otros_abonos", "Otros abonos sin identificar"], ["otros_cargos", "Otros cargos sin identificar"]]);
  const CAT_BANCARIAS = ["gmf", "iva", "comision", "cuota", "retencion"]; // cargos que el banco cobra por sí mismo
  /** Pasarela o red de la que viene un abono por tarjeta (para agrupar los descuentos). */
  function pasarela(desc) {
    const d = norm(desc);
    if (/BOLD/.test(d)) return "Bold";
    if (/AMEX/.test(d)) return "American Express";
    if (/WOMPI/.test(d)) return "Wompi";
    if (/PAYU/.test(d)) return "PayU";
    if (/REDEBAN/.test(d)) return "Redeban";
    return "Credibanco / datáfono";
  }
  /** ¿El renglón del libro es una venta de punto de venta pagada al banco (tarjeta, QR, transferencia)? */
  function esVentaPOS(l) {
    const c = norm(l.concepto).replace(/\s/g, ""), d = norm(l.doc).replace(/\s/g, "");
    return d.length >= 4 && c.includes(d.slice(0, 4)) && !/^INGRESO/.test(norm(l.concepto));
  }

  /* ------------------------------------------------------------ cruce */
  const OPC_DEF = { tolerancia: 1, diasExacto: 5, diasLejano: 40, diasGrupo: 3, maxGrupo: 6, aproxPct: 1, aproxMax: 5000, diasAprox: 4, tarjetaMin: 0.9, diasTarjeta: 5 };

  /** Similitud por texto: comparte números de documento, NIT o palabras del tercero. */
  function afinidad(l, b) {
    const bd = norm(b.desc + " " + (b.doc || "")), bdj = bd.replace(/\s/g, "");
    let p = 0;
    const docs = [l.doc, l.factura, ...(String(l.concepto).match(/[A-Z]{1,4}\d{3,}/gi) || [])].filter(Boolean).map((x) => norm(x).replace(/\s/g, ""));
    if (docs.some((d) => d.length > 3 && bdj.includes(d))) p += 3;
    if ((String(l.concepto).match(/\d{5,}/g) || []).some((n) => bd.includes(n))) p += 2;
    const pals = norm(l.tercero).split(" ").filter((w) => w.length >= 4 && !/^(S\.?A\.?S?|LTDA|SAS)$/.test(w));
    if (pals.some((w) => bd.includes(w))) p += 1;
    const nit = String(l.nit || "").replace(/\D/g, "");
    if (nit.length >= 6 && bdj.includes(nit)) p += 2;
    return p;
  }

  /** Busca un subconjunto de `cands` ({v}) cuya suma sea `objetivo` (±tol), de 2 a maxN elementos. Devuelve índices o null. */
  function subconjunto(cands, objetivo, tol, maxN, limite = 60000, minN = 2) {
    const xs = cands.map((c, i) => ({ v: c.v, i })).sort((a, b) => Math.abs(b.v) - Math.abs(a.v));
    const n = xs.length;
    if (!n) return null;
    const restoAbs = new Array(n + 1).fill(0);
    for (let i = n - 1; i >= 0; i--) restoAbs[i] = restoAbs[i + 1] + Math.abs(xs[i].v);
    let pasos = 0, sol = null;
    const elegido = [];
    const dfs = (k, suma) => {
      if (sol || ++pasos > limite) return;
      if (elegido.length >= minN && Math.abs(suma - objetivo) <= tol) { sol = elegido.map((j) => xs[j].i); return; }
      if (elegido.length >= maxN || k >= n) return;
      if (Math.abs(objetivo - suma) - restoAbs[k] > tol) return;
      for (let j = k; j < n && !sol; j++) {
        const nv = suma + xs[j].v;
        if (Math.sign(xs[j].v) === Math.sign(objetivo) && Math.abs(nv) > Math.abs(objetivo) + tol) continue;
        elegido.push(j); dfs(j + 1, nv); elegido.pop();
      }
    };
    dfs(0, 0);
    return sol;
  }
  /** Probabilidad aproximada de que una suma cuadre por casualidad (combinaciones × ancho de tolerancia / valor). */
  function azar(n, maxN, tol, objetivo) {
    let comb = 0, c = 1;
    for (let k = 1; k <= Math.min(n, maxN); k++) { c = c * (n - k + 1) / k; if (k >= 2) comb += c; }
    return comb * (2 * tol + 1) / Math.max(1, Math.abs(objetivo));
  }
  const mediana = (xs) => { const s = xs.slice().sort((a, b) => a - b); return s.length ? (s.length % 2 ? s[(s.length - 1) / 2] : (s[s.length / 2 - 1] + s[s.length / 2]) / 2) : null; };

  /**
   * Cruza libro (L) contra extracto (B).
   *  libro:    { saldoAnterior, saldoFinal, movimientos:[{fecha,doc,nit,tercero,concepto,factura,debito,credito}] }
   *  extracto: { saldoInicial, saldoFinal, movimientos:[{fecha,desc,doc,valor}] }
   *  previo:   { libro:[pendientes del libro], banco:[pendientes del banco] } de la conciliación anterior (o null)
   *  manual:   { cruces:[[idsL],[idsB]], deshacer:[claves], anteriores:[idsB], notas:{id:texto} }
   */
  function conciliar(libro, extracto, previo = null, opciones = {}, manual = {}) {
    const O = { ...OPC_DEF, ...opciones };
    const L = libro.movimientos.map((m, i) => ({ id: "L" + i, lado: "L", fecha: m.fecha, valor: r2(m.debito - m.credito), doc: m.doc || "", nit: m.nit || "", tercero: m.tercero || "", concepto: m.concepto || "", factura: m.factura || "", ant: false }));
    const B = extracto.movimientos.map((m, i) => ({ id: "B" + i, lado: "B", fecha: m.fecha, valor: r2(m.valor), desc: m.desc, doc: m.doc || "", cat: categoria(m.desc, m.valor), ant: false }));
    (previo?.libro || []).forEach((m, i) => L.push({ ...m, id: "LA" + i, lado: "L", ant: true, par: undefined }));
    (previo?.banco || []).forEach((m, i) => B.push({ ...m, id: "BA" + i, lado: "B", ant: true, par: undefined, cat: m.cat || categoria(m.desc, m.valor) }));
    const porId = new Map([...L, ...B].map((x) => [x.id, x]));
    const libres = (arr) => arr.filter((x) => !x.par && !x.reservado);
    const cruces = [];
    const deshechos = new Set(manual.deshacer || []);
    const clave = (ls, bs) => [...ls.map((x) => x.id), "|", ...bs.map((x) => x.id)].join(",");
    const unir = (ls, bs, regla, extra = {}) => {
      const k = clave(ls, bs);
      if (regla !== "manual" && deshechos.has(k)) return false;
      const id = "C" + (cruces.length + 1);
      ls.forEach((x) => { x.par = id; }); bs.forEach((x) => { x.par = id; });
      const vl = r2(ls.reduce((s, x) => s + x.valor, 0)), vb = r2(bs.reduce((s, x) => s + x.valor, 0));
      cruces.push({ id, clave: k, regla, libro: ls.map((x) => x.id), banco: bs.map((x) => x.id), valorLibro: vl, valorBanco: vb, dif: r2(vb - vl), ...extra });
      return true;
    };

    // 0 · Cruces manuales y partidas marcadas como del mes anterior
    for (const [ls, bs] of manual.cruces || []) {
      const a = ls.map((i) => porId.get(i)).filter(Boolean), b = bs.map((i) => porId.get(i)).filter(Boolean);
      if (!(a.length + b.length) || !a.concat(b).every((x) => !x.par)) continue;
      const vl = a.reduce((s, x) => s + x.valor, 0), vb = b.reduce((s, x) => s + x.valor, 0);
      if (b.length && b.every((x) => x.cat === "tarjetas") && vl > 0 && vb / vl >= 0.85 && vb / vl < 1) unir(a, b, "tarjetas", { manual: true, pasarela: pasarela(b[0].desc), nota: `Cruce manual de tarjetas · neto ${(vb / vl * 100).toFixed(1)} %` });
      else unir(a, b, "manual");
    }
    const marcadosAnt = (manual.anteriores || []).map((i) => porId.get(i)).filter((x) => x && !x.par);

    // 0b · Datáfono / links de pago con el reporte de transacciones de la pasarela (Bold).
    //      Cada abono del banco es la suma exacta (al centavo) de los netos de un grupo de ventas consecutivas;
    //      cada venta se busca en el libro por su valor bruto. El descuento (retenciones + comisión) queda exacto.
    const pasarelaR = { depositos: [], pendientesAbono: [], sinLibro: [], txns: 0 };
    {
      const PT = (O.pasarelas || []).filter((t) => t.neto > 0).slice().sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));
      pasarelaR.txns = PT.length;
      if (PT.length) {
        const usadosT = new Set();
        const esAbonoBold = (b) => b.valor > 0 && /BOLD/.test(norm(b.desc));
        const deps = libres(B).filter(esAbonoBold).sort((a, b) => a.fecha.localeCompare(b.fecha) || a.id.localeCompare(b.id));
        const tolC = 0.05;
        for (const b of deps) {
          const cand = PT.filter((t) => !usadosT.has(t.id) && t.fecha <= b.fecha && diasEntre(t.fecha, b.fecha) <= Math.max(15, O.diasTarjeta * 3));
          let sel = null;
          // Ventanas de ventas consecutivas (Bold deposita en orden): la primera cuyo neto suma exactamente el abono.
          for (let j = 0; j < cand.length && !sel; j++) {
            let s = 0;
            for (let i = j; i < cand.length; i++) {
              s = r2(s + cand[i].neto);
              if (Math.abs(s - b.valor) <= tolC) { sel = cand.slice(j, i + 1); break; }
              if (s > b.valor + tolC) break;
            }
          }
          if (!sel) { const idx = subconjunto(cand.slice(-30).map((t) => ({ v: t.neto })), b.valor, tolC, 8, 80000, 1); if (idx) sel = idx.map((i) => cand.slice(-30)[i]); }
          if (!sel) continue;
          sel.forEach((t) => usadosT.add(t.id));
          pasarelaR.depositos.push({ b, txns: sel });
        }
        // Ventas en el libro por valor bruto (el libro puede traer centavos que Bold redondea).
        const tolV = Math.max(1, O.tolerancia);
        const pares = [];
        const candL = libres(L).filter((l) => l.valor > 0 && !l.virtual);
        for (const t of PT) {
          for (const l of candL) {
            const dv = Math.abs(l.valor - t.bruto);
            if (dv > tolV) continue;
            const d = diasEntre(t.fecha, l.fecha);
            if (d < -2 || d > 4) continue;
            let score = 10 - Math.abs(d) * 3 - dv;
            if (t.docPagador && t.docPagador.length >= 6 && String(l.nit || "").replace(/\D/g, "").startsWith(t.docPagador.slice(0, 9))) score += 6;
            // Si el mismo valor entra al banco por otro medio (QR, transferencia) cerca de esa fecha, probablemente no es esta venta.
            if (libres(B).some((b) => !esAbonoBold(b) && b.valor > 0 && Math.abs(b.valor - l.valor) <= O.tolerancia && Math.abs(diasEntre(l.fecha, b.fecha)) <= 3)) score -= 4;
            pares.push({ t, l, score });
          }
        }
        pares.sort((a, b) => b.score - a.score);
        const tDeL = new Map(), lUsada = new Set();
        for (const p of pares) if (!tDeL.has(p.t.id) && !lUsada.has(p.l.id)) { tDeL.set(p.t.id, [p.l]); lUsada.add(p.l.id); }
        // Un pago de Bold que cubre varias facturas del libro (mismo pagador, o ventas del mismo día que suman el valor).
        for (const t of PT.filter((x) => !tDeL.has(x.id))) {
          const base = candL.filter((l) => !lUsada.has(l.id) && l.valor < t.bruto + tolV && diasEntre(t.fecha, l.fecha) >= -2 && diasEntre(t.fecha, l.fecha) <= 4);
          const nitT = t.docPagador && t.docPagador.length >= 6 ? t.docPagador.slice(0, 9) : "";
          const delPagador = nitT ? base.filter((l) => String(l.nit || "").replace(/\D/g, "").startsWith(nitT)) : [];
          let sel = null;
          if (delPagador.length >= 2) { const ix = subconjunto(delPagador.map((l) => ({ v: l.valor })), t.bruto, Math.max(2, tolV * 2), 6); if (ix) sel = ix.map((i) => delPagador[i]); }
          if (!sel) {
            const mismoDia = base.filter((l) => l.fecha === t.fecha).slice(0, 24);
            if (mismoDia.length >= 2 && azar(mismoDia.length, 3, tolV, t.bruto) < 0.02) { const ix = subconjunto(mismoDia.map((l) => ({ v: l.valor })), t.bruto, tolV, 3); if (ix) sel = ix.map((i) => mismoDia[i]); }
          }
          if (sel) { tDeL.set(t.id, sel); sel.forEach((l) => lUsada.add(l.id)); }
        }
        for (const dep of pasarelaR.depositos) {
          const ls = dep.txns.flatMap((t) => tDeL.get(t.id) || []);
          const faltan = dep.txns.filter((t) => !tDeL.has(t.id));
          const sum = (arr, k) => r2(arr.reduce((a, t) => a + t[k], 0));
          const conL = dep.txns.filter((t) => tDeL.has(t.id));
          const det = { n: dep.txns.length, bruto: sum(dep.txns, "bruto"), compra: sum(dep.txns, "compra"), iva: sum(dep.txns, "iva"), rf: sum(dep.txns, "rf"), riva: sum(dep.txns, "riva"), rica: sum(dep.txns, "rica"),
            com: sum(dep.txns, "com"), fija: sum(dep.txns, "fija"), ded: sum(dep.txns, "ded"), neto: sum(dep.txns, "neto"),
            redondeo: r2(sum(conL, "bruto") - ls.reduce((a, l) => a + l.valor, 0)), faltan: faltan.map((t) => ({ id: t.id, fecha: t.fecha, bruto: t.bruto, pagador: t.pagador, canal: t.canal })),
            ids: dep.txns.map((t) => t.id), dias: [...new Set(dep.txns.map((t) => t.fecha))] };
          const nota = `Bold: ${det.n} venta(s) del ${det.dias.map((d) => d.slice(8) + "/" + d.slice(5, 7)).join(", ")} · bruto ${det.bruto.toFixed(0)} − deducciones ${det.ded.toFixed(2)} = neto ${det.neto.toFixed(2)}${faltan.length ? ` · ${faltan.length} venta(s) sin registrar en libros` : ""}`;
          if (unir(ls, [dep.b], "bold", { pasarela: "Bold", bold: det, nota })) { dep.cruce = cruces.at(-1).id; dep.det = det; dep.ls = ls; }
          if (faltan.length) pasarelaR.sinLibro.push(...faltan.map((t) => ({ ...t, abono: dep.b.fecha })));
        }
        // Ventas ya cobradas por Bold cuyo abono aún no llega al banco: quedan en tránsito, identificadas.
        for (const t of PT.filter((x) => !usadosT.has(x.id))) {
          const l = (tDeL.get(t.id) || [])[0];
          if (!l && t.fecha < (extracto.desde || "")) continue; // del mes anterior y ya abonada entonces
          if (l && !l.par) { (tDeL.get(t.id) || []).forEach((x) => { x.reservado = true; x.notaPasarela = `Venta Bold ${t.id} · se abonará el neto ${t.neto.toFixed(2)}`; }); l.reservado = true; l.notaPasarela = `Venta Bold ${t.id} · se abonará el neto ${t.neto.toFixed(2)}`; l.boldT = t.id; }
          pasarelaR.pendientesAbono.push({ ...t, libro: l ? l.id : null, enMes: t.fecha >= (extracto.desde || "") });
        }
      }
    }

    // 1 · Uno a uno: mismo valor (±tolerancia), fechas cercanas; prioriza documento/tercero y cercanía.
    const unoAUno = (dias, regla, tolAbs = () => O.tolerancia) => {
      const pares = [];
      const bl = libres(B);
      for (const l of libres(L)) {
        const tol = tolAbs(l);
        for (const b of bl) {
          if (Math.sign(b.valor) !== Math.sign(l.valor)) continue;
          const dv = Math.abs(b.valor - l.valor);
          if (dv > tol) continue;
          const d = diasEntre(l.fecha, b.fecha);
          if (Math.abs(d) > dias) continue;
          if (regla === "aproximado" && b.cat && CAT_BANCARIAS.includes(b.cat)) continue;
          const af = afinidad(l, b);
          pares.push({ l, b, score: af * 10 - Math.abs(d) * (d < 0 ? 1.5 : 1) - (dv / Math.max(1, Math.abs(l.valor))) * 400 - dv * 0.01 });
        }
      }
      pares.sort((a, b) => b.score - a.score);
      for (const p of pares) if (!p.l.par && !p.b.par) unir([p.l], [p.b], regla);
    };
    unoAUno(O.diasExacto, "exacto");

    // 2 · Varios del libro = un movimiento del banco, o un renglón del libro = varios del banco.
    const nitBanco = String(O.nitBanco || "").replace(/\D/g, "").slice(0, 9);
    const esDelBanco = (l) => (nitBanco && String(l.nit || "").replace(/\D/g, "").slice(0, 9) === nitBanco) || /GASTO.{0,4}BANCARI|AJUSTE AL PESO|\bGMF\b|4X1000|INTERESES Y RENDIMIENTOS/.test(norm(l.concepto));
    const grupos = (diasVentana) => {
      for (const b of libres(B).sort((x, y) => Math.abs(y.valor) - Math.abs(x.valor))) {
        if (b.par || CAT_BANCARIAS.includes(b.cat)) continue;
        const c = libres(L).filter((l) => !esDelBanco(l) && Math.sign(l.valor) === Math.sign(b.valor) && Math.abs(l.valor) <= Math.abs(b.valor) + O.tolerancia && Math.abs(diasEntre(l.fecha, b.fecha)) <= diasVentana)
          .sort((x, y) => Math.abs(diasEntre(x.fecha, b.fecha)) - Math.abs(diasEntre(y.fecha, b.fecha))).slice(0, 24);
        if (c.length < 2 || azar(c.length, O.maxGrupo, O.tolerancia, b.valor) > 0.02) continue;
        const s = subconjunto(c.map((x) => ({ v: x.valor })), b.valor, O.tolerancia, O.maxGrupo);
        if (s) unir(s.map((i) => c[i]), [b], "grupo");
      }
      for (const l of libres(L).sort((x, y) => Math.abs(y.valor) - Math.abs(x.valor))) {
        if (l.par) continue;
        const c = libres(B).filter((b) => Math.sign(b.valor) === Math.sign(l.valor) && Math.abs(b.valor) <= Math.abs(l.valor) + O.tolerancia && Math.abs(diasEntre(l.fecha, b.fecha)) <= diasVentana)
          .sort((x, y) => Math.abs(diasEntre(x.fecha, l.fecha)) - Math.abs(diasEntre(y.fecha, l.fecha))).slice(0, 24);
        if (c.length < 2 || azar(c.length, O.maxGrupo, O.tolerancia, l.valor) > 0.02) continue;
        const s = subconjunto(c.map((x) => ({ v: x.valor })), l.valor, O.tolerancia, O.maxGrupo);
        if (s) unir([l], s.map((i) => c[i]), "grupo");
      }
    };
    grupos(O.diasGrupo);

    // Descuentos de Bold que pueden ir dentro del comprobante único de gastos bancarios del mes.
    const boldDelMes = (mes) => {
      const deps = pasarelaR.depositos.filter((d) => d.det && d.b.fecha.slice(0, 7) === mes);
      const dedAbon = r2(deps.reduce((a, d) => a + d.det.ded, 0));
      return dedAbon > 0 ? [{ v: dedAbon, nota: `${deps.length} abonos del mes` }] : [];
    };
    // 3 · Comprobante global de gastos bancarios del mes ("Valor Gasto Bancario"): suma de cargos (± intereses).
    for (const l of libres(L)) {
      const nitL = String(l.nit || "").replace(/\D/g, "").slice(0, 9);
      const delBanco = O.nitBanco && nitL && nitL === String(O.nitBanco).replace(/\D/g, "").slice(0, 9);
      if (l.valor >= 0 || !(/GASTO|BANCARI|\bGMF\b|4X1000|4 X 1000|GRAVAMEN|COMISION|IMPTO|\bIVA\b|MANEJO|NOTA DEBITO|\bND\b|CUOTA PLAN/.test(norm(l.concepto)) || delBanco)) continue;
      const mes = l.fecha.slice(0, 7);
      const cargos = libres(B).filter((b) => b.valor < 0 && CAT_BANCARIAS.includes(b.cat) && b.fecha.slice(0, 7) === mes);
      const inter = libres(B).filter((b) => b.valor > 0 && b.cat === "intereses" && b.fecha.slice(0, 7) === mes);
      const otrosAb = libres(B).filter((b) => b.valor > 0 && b.cat !== "intereses" && b.fecha.slice(0, 7) === mes && b.valor < Math.abs(l.valor) * 0.3);
      const tol = Math.max(O.tolerancia * 2, 2);
      const total = (arr) => r2(arr.reduce((s, b) => s + b.valor, 0));
      let hecho = false;
      // a) Todos los cargos del mes (con o sin los intereses) en un solo comprobante
      for (const base of [cargos, cargos.concat(inter)]) if (!hecho && base.length && Math.abs(total(base) - l.valor) <= tol) hecho = unir([l], base, "gastos-mes", { nota: `${base.length} cargos bancarios del mes` });
      if (hecho) continue;
      // a2) Un solo comprobante con los cargos del banco y los descuentos del datáfono (retenciones y comisión de Bold)
      const bolds = boldDelMes(mes);
      for (const bd of bolds) for (const base of [cargos, cargos.concat(inter)]) {
        if (hecho || !base.length) continue;
        if (Math.abs(total(base) - bd.v - l.valor) <= tol) hecho = unir([l], base, "gastos-mes", { cubre: "tarjetas:Bold", cubreValor: bd.v, gastoUnico: true, nota: `${base.length} cargos bancarios del mes + descuentos de Bold ${bd.v.toFixed(2)} (${bd.nota}) en un solo comprobante` });
      }
      if (hecho) continue;
      // b) Comprobantes por concepto (uno para GMF, otro para comisiones…): cualquier combinación de conceptos
      const presentes = [...new Set(cargos.map((b) => b.cat))];
      const combos = [];
      for (let m = 1; m < 1 << presentes.length; m++) combos.push(presentes.filter((_, i) => m & (1 << i)));
      combos.sort((a, b) => a.length - b.length);
      for (const cats of combos) {
        const cc = cargos.filter((b) => cats.includes(b.cat));
        if (cc.length && Math.abs(total(cc) - l.valor) <= tol) { hecho = unir([l], cc, "gastos-mes", { nota: `${cc.length} cargos del mes (${cats.map((c) => NOMBRE_CAT[c].split(" ")[0].toLowerCase()).join(", ")})` }); break; }
      }
      if (hecho) continue;
      // c) Todos los cargos menos algunos, o más algún reintegro
      for (const base of [cargos, cargos.concat(inter)]) {
        if (hecho || !base.length) continue;
        const sobra = r2(total(base) - l.valor);
        const quitar = subconjunto(base.map((b) => ({ v: b.valor })), sobra, tol, 3, 30000, 1);
        if (quitar) { const q = new Set(quitar); const sel = base.filter((_, i) => !q.has(i)); hecho = unir([l], sel, "gastos-mes", { nota: `${sel.length} cargos bancarios del mes` }); break; }
        const agregar = subconjunto(otrosAb.map((b) => ({ v: b.valor })), -sobra, tol, 3, 30000, 1);
        if (agregar) { const sel = base.concat(agregar.map((i) => otrosAb[i])); hecho = unir([l], sel, "gastos-mes", { nota: `${base.length} cargos bancarios del mes y ${agregar.length} reintegro(s)` }); break; }
      }
      if (hecho) continue;
      // d) Valor cercano: se cruza y la diferencia queda por ajustar
      for (const base of [cargos, cargos.concat(inter)]) {
        if (base.length && Math.abs(total(base) - l.valor) <= Math.max(1000, Math.abs(l.valor) * 0.01)) { hecho = unir([l], base, "gastos-mes", { nota: `${base.length} cargos bancarios del mes · diferencia ${r2(total(base) - l.valor).toFixed(2)}` }); break; }
      }
      if (hecho || !cargos.length) continue;
      // e) Comprobante único de gastos bancarios ("Valor Gasto Bancario") que no cuadra: se cruza con la composición más cercana
      //    (cargos del banco, con o sin los descuentos de Bold) y la diferencia queda a la vista para revisar.
      if (!/GASTO.{0,4}BANCARI/.test(norm(l.concepto)) && !(delBanco && /GASTO|BANCARI/.test(norm(l.concepto)))) continue;
      // Los intereses solo se suponen netos dentro del comprobante si así cuadra exacto.
      const opciones = [{ v: 0, nota: "" }, ...bolds].flatMap((bd) => [cargos, cargos.concat(inter)].map((base) => ({ base, bd, gap: r2(total(base) - bd.v - l.valor) })))
        .filter((o) => o.base === cargos || Math.abs(o.gap) <= tol);
      opciones.sort((a, b) => Math.abs(a.gap) - Math.abs(b.gap));
      const m = opciones[0];
      if (Math.abs(m.gap) <= Math.abs(l.valor) * 0.25) {
        unir([l], m.base, "gastos-mes", { gastoUnico: true, revisarGasto: true, diferenciaGasto: r2(-m.gap), ...(m.bd.v ? { cubre: "tarjetas:Bold", cubreValor: m.bd.v } : {}),
          nota: `Comprobante único de gastos bancarios: ${m.base.length} cargos del banco${m.bd.v ? ` + descuentos de Bold ${m.bd.v.toFixed(2)} (${m.bd.nota})` : ""} = ${(-(total(m.base) - m.bd.v)).toFixed(2)}; en libros ${(-l.valor).toFixed(2)} · diferencia ${(-m.gap).toFixed(2)}` });
      }
    }

    // 3b · Intereses registrados en un solo comprobante del mes.
    for (const l of libres(L)) {
      if (l.valor <= 0 || !/INTERES|RENDIMIENTO/.test(norm(l.concepto))) continue;
      const inter = libres(B).filter((b) => b.cat === "intereses" && b.fecha.slice(0, 7) === l.fecha.slice(0, 7));
      const t = r2(inter.reduce((s, b) => s + b.valor, 0));
      if (inter.length && Math.abs(t - l.valor) <= Math.max(O.tolerancia, 1)) unir([l], inter, "gastos-mes", { nota: `${inter.length} abonos de intereses del mes` });
    }

    // 4 · Mismo valor con fecha lejana (registros tardíos).
    unoAUno(O.diasLejano, "fecha-lejana");

    // 5 · Totales por día: lo pendiente del libro en un día = lo pendiente del banco ese día o hasta N días después.
    for (const f of [...new Set(libres(L).map((l) => l.fecha))].sort()) {
      for (const sg of [1, -1]) {
        const ls = libres(L).filter((l) => l.fecha === f && Math.sign(l.valor) === sg);
        if (ls.length < 1) continue;
        const tl = r2(ls.reduce((s, x) => s + x.valor, 0));
        for (let k = 0; k <= O.diasGrupo; k++) {
          const bs = libres(B).filter((b) => Math.sign(b.valor) === sg && b.fecha >= f && b.fecha <= sumarDias(f, k) && !CAT_BANCARIAS.includes(b.cat));
          if (ls.length + bs.length < 3) continue;
          const tb = r2(bs.reduce((s, x) => s + x.valor, 0));
          if (bs.length && Math.abs(tb - tl) <= O.tolerancia) { unir(ls, bs, "total-dia"); break; }
        }
      }
    }
    grupos(O.diasGrupo + 4);

    // 6 · Valor aproximado: el cliente pagó redondeado o el banco descontó un costo pequeño.
    unoAUno(O.diasAprox, "aproximado", (l) => Math.min(O.aproxMax, Math.max(100, Math.abs(l.valor) * O.aproxPct / 100)));

    // 6b · Mismo tercero o documento con diferencia mayor (pagó de más o de menos): se cruza y queda para revisar.
    {
      const pares = [];
      for (const l of libres(L)) for (const b of libres(B)) {
        if (Math.sign(b.valor) !== Math.sign(l.valor) || CAT_BANCARIAS.includes(b.cat)) continue;
        const dv = Math.abs(b.valor - l.valor), d = Math.abs(diasEntre(l.fecha, b.fecha));
        if (dv > Math.abs(l.valor) * 0.05 || d > O.diasExacto) continue;
        const af = afinidad(l, b);
        if (af < 1) continue;
        pares.push({ l, b, score: af * 10 - d - dv / Math.abs(l.valor) * 100 });
      }
      pares.sort((a, b) => b.score - a.score);
      for (const p of pares) if (!p.l.par && !p.b.par) unir([p.l], [p.b], "tercero", { nota: "Mismo tercero/documento con diferencia de valor: revisar" });
    }

    // 7 · Ventas con tarjeta y pasarelas: el banco abona el neto (descuenta comisión, IVA y retenciones).
    //     Se comparan los abonos de cada día con las ventas de días consecutivos anteriores; la proporción
    //     neto/bruto típica se estima con la mediana de las parejas posibles y se asigna de la más cercana a la más lejana.
    const tarjetas = { tasa: {}, cruces: [] };
    {
      const ventas = libres(L).filter((l) => l.valor > 0 && !l.ant && esVentaPOS(l));
      const diasV = [...new Set(ventas.map((l) => l.fecha))].sort();
      const porDiaV = new Map(diasV.map((d) => [d, ventas.filter((l) => l.fecha === d)]));
      const abonos = libres(B).filter((b) => b.cat === "tarjetas" && b.valor > 0);
      const grupoB = new Map();
      for (const b of abonos) { const k = pasarela(b.desc) + "|" + b.fecha; if (!grupoB.has(k)) grupoB.set(k, []); grupoB.get(k).push(b); }
      const cands = [];
      for (const [k, bs] of grupoB) {
        const [pas, f] = k.split("|");
        const neto = r2(bs.reduce((s, b) => s + b.valor, 0));
        const previos = diasV.filter((d) => d <= f && diasEntre(d, f) <= O.diasTarjeta);
        for (let i = 0; i < previos.length; i++) for (let j = i; j < previos.length; j++) {
          const rango = previos.slice(i, j + 1);
          const bruto = r2(rango.reduce((s, d) => s + porDiaV.get(d).reduce((a, l) => a + l.valor, 0), 0));
          const ratio = neto / bruto;
          if (ratio >= O.tarjetaMin && ratio < 1) cands.push({ k, pas, f, bs, neto, rango, bruto, ratio, lag: diasEntre(rango.at(-1), f) });
        }
      }
      // Tasa típica neto/bruto por pasarela: el valor con más abonos distintos que lo respaldan (±0,4 %).
      // Si el usuario la fijó en la configuración, se usa esa.
      for (const pas of [...new Set(cands.map((c) => c.pas))]) {
        const fija = (O.tasas || {})[pas];
        if (fija) { tarjetas.tasa[pas] = fija; tarjetas.soporte = { ...(tarjetas.soporte || {}), [pas]: "config" }; continue; }
        const cs = cands.filter((c) => c.pas === pas);
        let mejor = null, sop = 0;
        for (const c of cs) {
          const ks = new Set(cs.filter((x) => Math.abs(x.ratio - c.ratio) <= 0.004).map((x) => x.k));
          if (ks.size > sop || (ks.size === sop && c.rango.length === 1)) { sop = ks.size; mejor = c.ratio; }
        }
        const grupos = new Set(cs.map((c) => c.k)).size;
        if (mejor && sop >= 3 && sop >= grupos * 0.3) {
          tarjetas.tasa[pas] = mediana(cs.filter((x) => Math.abs(x.ratio - mejor) <= 0.004).map((x) => x.ratio));
          tarjetas.soporte = { ...(tarjetas.soporte || {}), [pas]: sop };
        }
      }
      const dist = (c) => (tarjetas.tasa[c.pas] ? Math.abs(c.ratio - tarjetas.tasa[c.pas]) : 9) + c.rango.length * 0.002;
      cands.sort((a, b) => dist(a) - dist(b));
      const usadoB = new Set(), usadoD = new Set();
      for (const c of cands) {
        if (!tarjetas.tasa[c.pas] || usadoB.has(c.k) || c.rango.some((d) => usadoD.has(d))) continue;
        if (Math.abs(c.ratio - tarjetas.tasa[c.pas]) > 0.012) continue;
        usadoB.add(c.k); c.rango.forEach((d) => usadoD.add(d));
        const ls = c.rango.flatMap((d) => porDiaV.get(d));
        unir(ls, c.bs, "tarjetas", { pasarela: c.pas, nota: `${c.pas}: ventas del ${c.rango.map((d) => d.slice(8) + "/" + d.slice(5, 7)).join(", ")} · neto ${(c.ratio * 100).toFixed(1)} %` });
      }
      // 7b · Abonos que cubren solo parte de las ventas de un día: subconjunto de ventas cuyo bruto × tasa ≈ neto.
      const aceptados = (pas) => cruces.filter((c) => c.regla === "tarjetas" && c.pasarela === pas).length;
      for (const b of libres(B).filter((x) => x.cat === "tarjetas" && x.valor > 0).sort((x, y) => x.fecha.localeCompare(y.fecha))) {
        const pas = pasarela(b.desc), tasa = tarjetas.tasa[pas];
        if (!tasa || aceptados(pas) < 2) continue;
        const cand = libres(L).filter((l) => l.valor > 0 && !l.ant && esVentaPOS(l) && l.fecha <= b.fecha && diasEntre(l.fecha, b.fecha) <= O.diasTarjeta).slice(0, 25);
        const obj = b.valor / tasa;
        if (azar(cand.length, 5, obj * 0.006, obj) > 0.6) continue;
        const s = subconjunto(cand.map((l) => ({ v: l.valor })), obj, obj * 0.006, 5, 40000, 1);
        if (s) { const ls = s.map((i) => cand[i]); const r = b.valor / ls.reduce((a, l) => a + l.valor, 0); unir(ls, [b], "tarjetas", { pasarela: pas, nota: `${pas}: ${ls.length} venta(s) · neto ${(r * 100).toFixed(1)} %` }); }
      }
    }

    // 8 · Diferencia en saldos iniciales: partidas del mes anterior que el banco registró este mes.
    const difAbierta = () => r2(r2(libro.saldoAnterior) - r2(extracto.saldoInicial ?? 0) - L.filter((x) => x.ant).reduce((s, x) => s + x.valor, 0) + B.filter((x) => x.ant).reduce((s, x) => s + x.valor, 0));
    const virtuales = [];
    const crearVirtual = (bs, valor, nota, regla) => {
      if (deshechos.has(clave([{ id: "LV" + virtuales.length }], bs))) return false;
      const v = { id: "LV" + virtuales.length, lado: "L", fecha: (libro.desde || extracto.desde || bs[0].fecha).slice(0, 8) + "01", valor: r2(valor), doc: "SALDO ANT.", nit: "", tercero: "", concepto: nota, factura: "", ant: true, virtual: true };
      virtuales.push(v); L.push(v); porId.set(v.id, v);
      return unir([v], bs, regla, { nota });
    };
    if (marcadosAnt.length) crearVirtual(marcadosAnt, marcadosAnt.reduce((s, b) => s + b.valor, 0), "Partidas del mes anterior marcadas manualmente", "anterior");
    {
      const dif = difAbierta();
      const ini = extracto.desde || libro.desde;
      if (Math.abs(dif) > O.tolerancia && ini) {
        const tempranos = libres(B).filter((b) => !b.ant && diasEntre(ini, b.fecha) <= O.diasTarjeta && Math.sign(b.valor) === Math.sign(dif) && !CAT_BANCARIAS.includes(b.cat) && b.cat !== "intereses");
        const exacto = subconjunto(tempranos.map((b) => ({ v: b.valor })), dif, O.tolerancia, 8, 60000, 1);
        if (exacto) crearVirtual(exacto.map((i) => tempranos[i]), dif, "Partidas del mes anterior (cuadran con la diferencia de saldos iniciales)", "anterior");
        else if (dif > 0) {
          // Abonos de tarjeta de los primeros días que corresponden a ventas del mes anterior
          const tb = tempranos.filter((b) => b.cat === "tarjetas");
          const dias = [...new Set(tb.map((b) => b.fecha))].sort();
          let acum = [];
          for (const d of dias) {
            acum = acum.concat(tb.filter((b) => b.fecha === d));
            const neto = acum.reduce((s, b) => s + b.valor, 0), ratio = neto / dif;
            if (ratio >= O.tarjetaMin && ratio <= 1) {
              const pas = pasarela(acum[0].desc);
              if (crearVirtual(acum.slice(), dif, `Abonos de ventas con tarjeta del mes anterior · neto ${(ratio * 100).toFixed(1)} %`, "tarjetas-anterior")) cruces.at(-1).pasarela = pas;
              break;
            }
          }
        }
      }
    }

    // 8b · Comprobante agrupado por concepto: un renglón del libro = todos los pendientes del banco de un concepto en el mes.
    for (const l of libres(L).filter((x) => !x.ant)) {
      const mes = l.fecha.slice(0, 7);
      const pend = libres(B).filter((b) => !b.ant && b.fecha.slice(0, 7) <= mes && Math.sign(b.valor) === Math.sign(l.valor));
      for (const cat of [...new Set(pend.map((b) => b.cat))]) {
        const bs = pend.filter((b) => b.cat === cat);
        if (bs.length < 2) continue;
        const t = r2(bs.reduce((s, b) => s + b.valor, 0));
        if (Math.abs(t - l.valor) <= Math.max(O.tolerancia, 1)) { unir([l], bs, "gastos-mes", { nota: `${bs.length} movimientos de «${NOMBRE_CAT[cat]}» en un comprobante` }); break; }
      }
    }

    // 9 · Ajustes ya registrados en libros: descuentos de tarjetas por pasarela y ajuste al peso neto.
    {
      const tol = Math.max(O.tolerancia, 1);
      const porPas = new Map();
      const yaCubre = new Set(cruces.filter((c) => c.cubre).map((c) => c.cubre));
      for (const c of cruces) if (["tarjetas", "tarjetas-anterior"].includes(c.regla) && c.dif < 0) porPas.set(c.pasarela || "Tarjetas", r2((porPas.get(c.pasarela || "Tarjetas") || 0) + c.dif));
      for (const c of cruces) if (c.regla === "bold") porPas.set("Bold", r2((porPas.get("Bold") || 0) - c.bold.ded));
      for (const k of [...porPas.keys()]) if (yaCubre.has("tarjetas:" + k)) porPas.delete(k);
      const sinAjuste = (c) => !["tarjetas", "tarjetas-anterior", "anterior", "bold"].includes(c.regla) && !c.gastoUnico;
      const peq = cruces.filter((c) => sinAjuste(c) && Math.abs(c.dif) >= 0.005 && Math.abs(c.dif) <= (O.ajusteMax ?? 1000));
      const netoAj = r2(peq.reduce((s, c) => s + c.dif, 0));
      const grandes = cruces.filter((c) => sinAjuste(c) && Math.abs(c.dif) > (O.ajusteMax ?? 1000));
      const metas = [...[...porPas].map(([p, v]) => ({ cubre: "tarjetas:" + p, v, nota: `Descuentos de ${p} ya registrados en libros` })),
        ...grandes.map((c) => ({ cubre: "dif:" + c.clave, v: c.dif, nota: "Diferencia de valor ya registrada en libros" })),
        ...(Math.abs(netoAj) >= 0.005 ? [{ cubre: "ajuste", v: netoAj, nota: "Ajuste al peso ya registrado en libros", tol: Math.max(tol, Math.min(500, Math.abs(netoAj) * 0.05)) }] : [])];
      for (const m of metas) {
        const l = libres(L).filter((x) => !x.ant && Math.abs(x.valor - m.v) <= (m.tol || tol)).sort((a, b) => Math.abs(a.valor - m.v) - Math.abs(b.valor - m.v) || b.fecha.localeCompare(a.fecha))[0];
        if (l) unir([l], [], "ajuste-registrado", { cubre: m.cubre, nota: m.nota });
      }
    }

    // Resultado
    const sum = (arr) => r2(arr.reduce((s, x) => s + x.valor, 0));
    const pendL = L.filter((x) => !x.par), pendB = B.filter((x) => !x.par);
    const P = {
      consignacionesTransito: pendL.filter((x) => x.valor > 0), egresosPendientes: pendL.filter((x) => x.valor < 0),
      ncNoRegistradas: pendB.filter((x) => x.valor > 0), ndNoRegistradas: pendB.filter((x) => x.valor < 0),
    };
    const difCruces = r2(cruces.reduce((s, c) => s + c.dif, 0)); // banco − libro en partidas cruzadas
    const saldoLibros = r2(libro.saldoFinal), saldoBanco = r2(extracto.saldoFinal);
    const librosAjustado = r2(saldoLibros + sum(P.ncNoRegistradas) + sum(P.ndNoRegistradas) + difCruces);
    const bancoAjustado = r2(saldoBanco + sum(P.consignacionesTransito) + sum(P.egresosPendientes));
    const difInicial = difAbierta();
    const diferencia = r2(librosAjustado - bancoAjustado);
    for (const c of cruces) c.items = [...c.libro, ...c.banco].map((i) => porId.get(i));
    return {
      opciones: O, L, B, cruces, porId, tarjetas, pasarela: pasarelaR,
      pendientes: P,
      saldos: { libros: saldoLibros, banco: saldoBanco, librosAjustado, bancoAjustado, inicialLibros: r2(libro.saldoAnterior), inicialBanco: r2(extracto.saldoInicial ?? 0),
        difInicial, difCruces, diferencia, nc: sum(P.ncNoRegistradas), nd: sum(P.ndNoRegistradas), transito: sum(P.consignacionesTransito), egresos: sum(P.egresosPendientes) },
      resumen: { movLibro: libro.movimientos.length, movBanco: extracto.movimientos.length, cruzadosLibro: L.filter((x) => x.par && !x.ant).length, cruzadosBanco: B.filter((x) => x.par && !x.ant).length },
    };
  }

  /* ------------------------------------------------------------ comprobantes sugeridos */
  const CTAS_DEF = {
    gmf: { cuenta: "53050503", nombre: "Gravamen movimientos financieros" },
    comision: { cuenta: "53050502", nombre: "Comisiones bancarias" },
    cuota: { cuenta: "53050502", nombre: "Comisiones bancarias (cuota de manejo)" },
    iva: { cuenta: "24080302", nombre: "IVA gastos 19 %" },
    retencion: { cuenta: "135515", nombre: "Retención en la fuente" },
    intereses: { cuenta: "421005", nombre: "Intereses" },
    tarjetaComision: { cuenta: "530515", nombre: "Comisiones (ventas con tarjeta)" },
    tarjetaIva: { cuenta: "24080302", nombre: "IVA gastos 19 % (comisión tarjetas)" },
    tarjetaRetefuente: { cuenta: "135515", nombre: "Retención en la fuente (tarjetas)" },
    tarjetaReteica: { cuenta: "135518", nombre: "Retención de ICA (tarjetas)" },
    tarjetaReteiva: { cuenta: "135517", nombre: "Retención de IVA (tarjetas)" },
    ajusteIngreso: { cuenta: "429581", nombre: "Ajuste al peso" },
    ajusteGasto: { cuenta: "539595", nombre: "Ajuste al peso" },
    abonoSinIdentificar: { cuenta: "280505", nombre: "Anticipo clientes (abono por identificar)" },
    cargoSinIdentificar: { cuenta: "138020", nombre: "Cuentas por cobrar a terceros (cargo por legalizar)" },
    credito: { cuenta: "2105", nombre: "Obligaciones financieras (asigne la subcuenta)" },
    impuestos: { cuenta: "2365", nombre: "Impuestos por pagar (asigne la subcuenta)" },
    nomina: { cuenta: "2505", nombre: "Salarios por pagar (asigne la subcuenta)" },
    proveedores: { cuenta: "2205", nombre: "Proveedores (asigne la subcuenta)" },
    reversion: { cuenta: "138020", nombre: "Cuentas por cobrar a terceros (reversión por aclarar)" },
  };
  const TARJ_DEF = { retefuente: 1.5, reteica: 0, reteiva: 0, ivaComision: 19, ajusteMax: 1000 };

  /**
   * Arma los comprobantes que faltan en libros.
   * R: resultado de conciliar · cuenta: {codigo,nombre} de la cuenta bancaria · cfg: {ctas, tarjetas, nitBanco, centro, agrupar}
   */
  function comprobantes(R, cuenta, cfg = {}) {
    const C = { ...CTAS_DEF, ...(cfg.ctas || {}) };
    const T = { ...TARJ_DEF, ...(cfg.tarjetas || {}) };
    const nitB = cfg.nitBanco || "", nomB = cfg.nombreBanco || "";
    const centro = cfg.centro || "";
    const fechaCorte = cfg.fecha;
    const lineas = [];
    const banco = { cuenta: cuenta.codigo, nombre: cuenta.nombre };
    const add = (grupo, fecha, cta, detalle, deb, cre, extra = {}) => {
      if (Math.abs(deb) < 0.005 && Math.abs(cre) < 0.005) return;
      lineas.push({ grupo, fecha, cuenta: cta.cuenta, nombreCuenta: cta.nombre, nit: extra.nit ?? nitB, tercero: extra.tercero ?? nomB, centro, detalle, debito: r2(deb), credito: r2(cre), base: r2(extra.base || 0), revisar: Boolean(extra.revisar), estimado: Boolean(extra.estimado), origen: extra.origen || [] });
    };
    const P = R.pendientes;
    const pend = [...P.ncNoRegistradas, ...P.ndNoRegistradas].filter((b) => !b.ant);
    // a) Cargos y abonos del banco no registrados
    const grupos = new Map();
    for (const b of pend) {
      const cat = b.cat;
      const k = cfg.agrupar === false ? b.id : cat;
      if (!grupos.has(k)) grupos.set(k, { cat, items: [] });
      grupos.get(k).items.push(b);
    }
    const orden = ["gmf", "comision", "cuota", "iva", "retencion", "intereses", "tarjetas", "transferencia", "consignacion", "otros_abonos", "credito", "impuestos", "nomina", "proveedores", "reversion", "otros_cargos"];
    for (const { cat, items } of [...grupos.values()].sort((a, b) => orden.indexOf(a.cat) - orden.indexOf(b.cat))) {
      const total = r2(items.reduce((s, b) => s + b.valor, 0));
      const fecha = cfg.agrupar === false ? items[0].fecha : fechaCorte || items.at(-1).fecha;
      const det = items.length === 1 ? `${items[0].desc} ${items[0].fecha.slice(8)}/${items[0].fecha.slice(5, 7)}` : `${NOMBRE_CAT[cat]} (${items.length} mov.)`;
      const origen = items.map((b) => b.id);
      const gr = NOMBRE_CAT[cat];
      const contra = C[cat] || (total > 0 ? C.abonoSinIdentificar : C.cargoSinIdentificar);
      const revisar = !["gmf", "comision", "cuota", "iva", "intereses", "retencion"].includes(cat);
      const terc = ["gmf", "comision", "cuota", "iva", "intereses", "retencion"].includes(cat) ? {} : { nit: "", tercero: "" };
      if (total < 0) { add(gr, fecha, contra, det, -total, 0, { origen, revisar, ...terc }); add(gr, fecha, banco, det, 0, -total, { origen }); }
      else { add(gr, fecha, banco, det, total, 0, { origen }); add(gr, fecha, cat === "tarjetas" ? C.abonoSinIdentificar : contra, det, 0, total, { origen, revisar, ...terc }); }
    }
    // b) Descuentos en abonos de tarjetas (bruto en libros − neto del banco)
    const cubiertos = new Set(R.cruces.filter((c) => c.cubre).map((c) => c.cubre));
    const porPas = new Map();
    for (const c of R.cruces) {
      if (!["tarjetas", "tarjetas-anterior"].includes(c.regla) || c.dif >= 0) continue;
      const k = c.pasarela || "Tarjetas";
      if (cubiertos.has("tarjetas:" + k)) continue;
      if (!porPas.has(k)) porPas.set(k, { bruto: 0, neto: 0, cruces: [] });
      const g = porPas.get(k); g.bruto += c.valorLibro; g.neto += c.valorBanco; g.cruces.push(c);
    }
    for (const [pas, g] of porPas) {
      const desc = r2(g.bruto - g.neto), bruto = r2(g.bruto);
      let rf = r2(bruto * T.retefuente / 100), ri = r2(bruto * T.reteica / 1000);
      const alcanza = desc - rf - ri >= 0;
      if (!alcanza) { rf = 0; ri = 0; } // el descuento no alcanza para las retenciones esperadas: todo a comisión, para revisar
      const comTotal = r2(desc - rf - ri);
      const comision = T.ivaComision ? r2(comTotal / (1 + T.ivaComision / 100)) : comTotal;
      const iva = r2(comTotal - comision);
      const riva = r2(iva * T.reteiva / 100);
      const gr = `Descuentos de ${pas} sobre ventas con tarjeta`;
      const det = `${pas}: bruto ${bruto.toFixed(0)} − neto ${r2(g.neto).toFixed(0)} (${g.cruces.length} abonos)`;
      const fecha = fechaCorte || g.cruces.at(-1).items.at(-1).fecha;
      const t = { nit: "", tercero: pas, estimado: true, revisar: !alcanza };
      const origen = g.cruces.map((c) => c.id);
      add(gr, fecha, C.tarjetaComision, det + " · comisión", comision - riva, 0, { ...t, origen, base: bruto });
      add(gr, fecha, C.tarjetaIva, det + " · IVA comisión", iva, 0, { ...t, origen, base: comision });
      if (riva) add(gr, fecha, C.tarjetaReteiva, det + " · reteIVA", riva, 0, { ...t, origen });
      if (!alcanza) add(gr, fecha, C.tarjetaComision, det + " · el descuento es menor que la retención esperada: revise la liquidación", 0, 0, { ...t, origen });
      add(gr, fecha, C.tarjetaRetefuente, det + ` · retefuente ${T.retefuente} %`, rf, 0, { ...t, origen, base: bruto });
      if (ri) add(gr, fecha, C.tarjetaReteica, det + ` · reteICA ${T.reteica} ‰`, ri, 0, { ...t, origen, base: bruto });
      add(gr, fecha, banco, det, 0, desc, { origen, estimado: true });
    }
    // b2) Datáfono Bold: descuentos exactos según el reporte de transacciones, ventas sin registrar y redondeo de centavos.
    {
      const bc = R.cruces.filter((c) => c.regla === "bold");
      if (bc.length) {
        const sum = (k) => r2(bc.reduce((a, c) => a + c.bold[k], 0));
        const det = { n: sum("n"), bruto: sum("bruto"), compra: sum("compra"), rf: sum("rf"), riva: sum("riva"), rica: sum("rica"), com: sum("com"), fija: sum("fija"), ded: sum("ded"), neto: sum("neto"), redondeo: sum("redondeo") };
        const fecha = fechaCorte || bc.at(-1).items.at(-1).fecha;
        const origen = bc.map((c) => c.id);
        const t = { nit: cfg.nitBold || "", tercero: "Bold.Co S.A.S", origen };
        const res = `Bold: ${det.n} ventas, bruto ${det.bruto.toFixed(0)}, ${bc.length} abonos por ${det.neto.toFixed(2)}`;
        if (!cubiertos.has("tarjetas:Bold")) {
          const gr = "Datáfono Bold: descuentos según el reporte de transacciones";
          const comTotal = r2(det.com + det.fija);
          const comision = T.ivaComision ? r2(comTotal / (1 + T.ivaComision / 100)) : comTotal;
          const ivaCom = r2(comTotal - comision);
          add(gr, fecha, C.tarjetaComision, `${res} · comisión (${det.com.toFixed(2)} + fija ${det.fija.toFixed(2)})`, comision, 0, { ...t, base: det.bruto });
          if (ivaCom) add(gr, fecha, C.tarjetaIva, `${res} · IVA incluido en la comisión (${T.ivaComision} %)`, ivaCom, 0, { ...t, base: comision });
          add(gr, fecha, C.tarjetaRetefuente, `${res} · retención en la fuente`, det.rf, 0, { ...t, base: det.compra });
          add(gr, fecha, C.tarjetaReteiva, `${res} · retención de IVA`, det.riva, 0, { ...t });
          add(gr, fecha, C.tarjetaReteica, `${res} · retención de ICA`, det.rica, 0, { ...t, base: det.compra });
          add(gr, fecha, banco, `${res} · total deducido por Bold`, 0, det.ded, { ...t });
        }
        const faltan = bc.flatMap((c) => c.bold.faltan);
        if (faltan.length) {
          const gr = "Datáfono Bold: ventas abonadas que no están en el libro";
          for (const f of faltan) { const d = `Venta Bold ${f.id} del ${f.fecha.slice(8)}/${f.fecha.slice(5, 7)}${f.pagador ? " · " + f.pagador : ""} (${f.canal || "datáfono"})`; add(gr, fecha, banco, d, f.bruto, 0, { nit: "", tercero: "", origen }); add(gr, fecha, C.abonoSinIdentificar, d, 0, f.bruto, { nit: "", tercero: "", revisar: true, origen }); }
        }
        if (Math.abs(det.redondeo) >= 0.005) {
          const gr = "Datáfono Bold: centavos entre el libro y Bold", d = `Diferencia de centavos entre las ventas del libro y el valor cobrado por Bold (${det.n} ventas)`;
          if (det.redondeo > 0) { add(gr, fecha, banco, d, det.redondeo, 0, { nit: "", tercero: "", origen }); add(gr, fecha, C.ajusteIngreso, d, 0, det.redondeo, { nit: "", tercero: "", origen }); }
          else { add(gr, fecha, C.ajusteGasto, d, -det.redondeo, 0, { nit: "", tercero: "", origen }); add(gr, fecha, banco, d, 0, -det.redondeo, { nit: "", tercero: "", origen }); }
        }
      }
    }
    // b3) Comprobante único de gastos bancarios registrado por un valor distinto al real: se propone solo la diferencia.
    for (const c of R.cruces.filter((x) => x.gastoUnico)) {
      const resto = r2(c.dif - (c.cubreValor || 0));
      if (Math.abs(resto) < 0.005) continue;
      const l = c.items.find((x) => x.lado === "L");
      const gr = "Diferencia en el comprobante único de gastos bancarios", fecha = fechaCorte || l?.fecha;
      const d = `${l?.doc || ""} registró ${(-c.valorLibro).toFixed(2)}; cargos del banco${c.cubreValor ? " + descuentos de Bold" : ""} suman ${(-c.valorBanco + (c.cubreValor || 0)).toFixed(2)}`.trim();
      if (resto < 0) { add(gr, fecha, C.comision, d + " · falta registrar", -resto, 0, { revisar: true, origen: [c.id] }); add(gr, fecha, banco, d + " · falta registrar", 0, -resto, { origen: [c.id] }); }
      else { add(gr, fecha, banco, d + " · registrado de más", resto, 0, { origen: [c.id] }); add(gr, fecha, C.comision, d + " · registrado de más", 0, resto, { revisar: true, origen: [c.id] }); }
    }
    // c) Diferencias en partidas cruzadas por valor aproximado (ajuste al peso o mayor/menor valor recibido)
    const aj = R.cruces.filter((c) => !["tarjetas", "tarjetas-anterior", "anterior", "ajuste-registrado", "bold"].includes(c.regla) && !c.gastoUnico && Math.abs(c.dif) >= 0.005 && !(cubiertos.has("ajuste") && Math.abs(c.dif) <= T.ajusteMax));
    {
      // Ajuste al peso ya registrado: si lo registrado no es exactamente el neto actual, se propone solo la diferencia.
      const reg = R.cruces.find((c) => c.regla === "ajuste-registrado" && c.cubre === "ajuste");
      if (reg) {
        const neto = r2(R.cruces.filter((c) => !["tarjetas", "tarjetas-anterior", "anterior", "ajuste-registrado", "bold"].includes(c.regla) && !c.gastoUnico && Math.abs(c.dif) >= 0.005 && Math.abs(c.dif) <= T.ajusteMax).reduce((s, c) => s + c.dif, 0));
        const resto = r2(neto - reg.valorLibro), gr = "Diferencias de valor en partidas cruzadas", fecha = fechaCorte || reg.items[0].fecha;
        if (resto > 0.004) { add(gr, fecha, banco, "Diferencia en el ajuste al peso ya registrado", resto, 0, { nit: "", tercero: "" }); add(gr, fecha, C.ajusteIngreso, "Diferencia en el ajuste al peso ya registrado", 0, resto, { nit: "", tercero: "" }); }
        else if (resto < -0.004) { add(gr, fecha, C.ajusteGasto, "Diferencia en el ajuste al peso ya registrado", -resto, 0, { nit: "", tercero: "" }); add(gr, fecha, banco, "Diferencia en el ajuste al peso ya registrado", 0, -resto, { nit: "", tercero: "" }); }
      }
    }
    if (aj.length) {
      const peq = aj.filter((c) => Math.abs(c.dif) <= T.ajusteMax), grandes = aj.filter((c) => Math.abs(c.dif) > T.ajusteMax && !cubiertos.has("dif:" + c.clave));
      const fecha = fechaCorte || aj.at(-1).items.at(-1).fecha;
      const ing = r2(peq.filter((c) => c.dif > 0).reduce((s, c) => s + c.dif, 0)), gas = r2(-peq.filter((c) => c.dif < 0).reduce((s, c) => s + c.dif, 0));
      const gr = "Diferencias de valor en partidas cruzadas";
      const neto = r2(ing - gas), nPeq = peq.length, orig = peq.map((c) => c.id);
      // Se registra el neto: las diferencias a favor y en contra se compensan entre sí.
      if (neto > 0) { add(gr, fecha, banco, `Ajuste al peso neto (${nPeq} partidas: +${ing.toFixed(2)} −${gas.toFixed(2)})`, neto, 0, { nit: "", tercero: "", origen: orig }); add(gr, fecha, C.ajusteIngreso, "Ajuste al peso neto (mayor valor recibido)", 0, neto, { nit: "", tercero: "" }); }
      else if (neto < 0) { add(gr, fecha, C.ajusteGasto, `Ajuste al peso neto (${nPeq} partidas: +${ing.toFixed(2)} −${gas.toFixed(2)})`, -neto, 0, { nit: "", tercero: "", origen: orig }); add(gr, fecha, banco, "Ajuste al peso neto (menor valor recibido)", 0, -neto, { nit: "", tercero: "" }); }
      for (const c of grandes) {
        const l = c.items.find((x) => x.lado === "L");
        const det = `Diferencia ${l?.doc || ""} ${l?.tercero || ""}`.trim();
        if (c.dif > 0) { add(gr, fecha, banco, det, c.dif, 0, { nit: l?.nit || "", tercero: l?.tercero || "", origen: [c.id] }); add(gr, fecha, C.abonoSinIdentificar, det, 0, c.dif, { nit: l?.nit || "", tercero: l?.tercero || "", revisar: true, origen: [c.id] }); }
        else { add(gr, fecha, C.cargoSinIdentificar, det, -c.dif, 0, { nit: l?.nit || "", tercero: l?.tercero || "", revisar: true, origen: [c.id] }); add(gr, fecha, banco, det, 0, -c.dif, { nit: l?.nit || "", tercero: l?.tercero || "", origen: [c.id] }); }
      }
    }
    const deb = r2(lineas.reduce((s, x) => s + x.debito, 0)), cre = r2(lineas.reduce((s, x) => s + x.credito, 0));
    const efectoBanco = r2(lineas.filter((x) => x.cuenta === banco.cuenta).reduce((s, x) => s + x.debito - x.credito, 0));
    return { lineas, debitos: deb, creditos: cre, efectoBanco };
  }

  /** Resumen informativo de los gastos bancarios del extracto: cuánto cobró el banco y cuánto falta registrar en libros. */
  function gastosBancarios(R) {
    const cats = ["gmf", "comision", "cuota", "iva", "retencion", "intereses"];
    const filas = cats.map((cat) => {
      const its = R.B.filter((b) => !b.ant && b.cat === cat);
      const total = r2(its.reduce((s, b) => s + b.valor, 0)), pend = its.filter((b) => !b.par);
      return { cat, nombre: NOMBRE_CAT[cat], n: its.length, total, registrado: r2(total - pend.reduce((s, b) => s + b.valor, 0)), pendiente: r2(pend.reduce((s, b) => s + b.valor, 0)), nPend: pend.length };
    }).filter((f) => f.n);
    const tarj = R.cruces.filter((c) => ["tarjetas", "tarjetas-anterior"].includes(c.regla) && c.dif < 0);
    const descTarj = r2(tarj.reduce((s, c) => s - c.dif, 0));
    const cub = new Set(R.cruces.filter((c) => c.cubre).map((c) => c.cubre));
    const descTarjPend = r2(tarj.filter((c) => !cub.has("tarjetas:" + (c.pasarela || "Tarjetas"))).reduce((s, c) => s - c.dif, 0));
    const bc = R.cruces.filter((c) => c.regla === "bold");
    const bold = bc.length ? { n: bc.length, ventas: bc.reduce((a, c) => a + c.bold.n, 0), ded: r2(bc.reduce((a, c) => a + c.bold.ded, 0)), registrado: cub.has("tarjetas:Bold") } : null;
    const boldPend = bold && !bold.registrado ? bold.ded : 0;
    const unico = R.cruces.find((c) => c.gastoUnico) || null;
    const difUnico = unico ? r2(unico.dif - (unico.cubreValor || 0)) : 0;
    const cargos = filas.filter((f) => f.cat !== "intereses");
    return { filas, descTarj, descTarjPend, nTarj: tarj.length, bold, boldPend, unico, difUnico,
      totalCargos: r2(-cargos.reduce((s, f) => s + f.total, 0)), pendienteCargos: r2(-cargos.reduce((s, f) => s + f.pendiente, 0)),
      intereses: filas.find((f) => f.cat === "intereses") || null, completo: filas.every((f) => !f.nPend) && descTarjPend < 1 && boldPend < 1 && Math.abs(difUnico) < 1 };
  }

  /** Partidas que quedan pendientes, en forma compacta para arrastrarlas al mes siguiente. */
  function pendientesParaSiguiente(R) {
    const P = R.pendientes;
    const lib = [...P.consignacionesTransito, ...P.egresosPendientes].filter((x) => !x.virtual).map(({ fecha, valor, doc, nit, tercero, concepto, factura }) => ({ fecha, valor, doc, nit, tercero, concepto, factura }));
    const ban = [...P.ncNoRegistradas, ...P.ndNoRegistradas].map(({ fecha, valor, desc, doc, cat }) => ({ fecha, valor, desc, doc, cat }));
    return { libro: lib, banco: ban };
  }

  /* ------------------------------------------------------------ guardado compacto (base de datos) */
  const limpio = (v) => String(v ?? "").replace(/[\t\n\r]+/g, " ");
  function libroADoc(k, meta = {}) {
    return { cuenta: k.cuenta, nombre: k.nombre, saldoAnterior: k.saldoAnterior, saldoFinal: k.saldoFinal, totales: k.totales || null, avisos: k.avisos || [], desde: meta.desde || null, hasta: meta.hasta || null, archivo: meta.archivo || "", fuente: meta.fuente || "",
      filas: k.movimientos.map((m) => [m.fecha, m.doc, m.nit, m.tercero, m.concepto, m.factura, m.debito, m.credito, m.saldo ?? ""].map(limpio).join("\t")) };
  }
  function libroDeDoc(d) {
    const movimientos = (d.filas || []).map((f) => { const p = f.split("\t"); return { fecha: p[0], doc: p[1], nit: p[2], tercero: p[3], concepto: p[4], factura: p[5], debito: Number(p[6]) || 0, credito: Number(p[7]) || 0, saldo: p[8] === "" ? null : Number(p[8]) }; });
    return { ...d, filas: undefined, movimientos };
  }
  function extractoADoc(e, meta = {}) {
    const { movimientos, ...cab } = e;
    return { ...cab, archivo: meta.archivo || "", filas: movimientos.map((m) => [m.fecha, m.desc, m.doc || "", m.valor, m.saldo ?? "", m.cod || "", m.sucursal || ""].map(limpio).join("\t")) };
  }
  function extractoDeDoc(d) {

<script>
/* =====================================================================
   PROVEEDORES — cuentas por pagar por antigüedad.

   Proveedores Acumulado" de MantisWeb (PDF), los valida entre sí y arma
   el informe de saldos pendientes por pagar a la fecha de corte.
   Funciones puras: no tocan el DOM.
   ===================================================================== */
const Proveedores = (() => {
  "use strict";
  const r2 = (v) => Math.round(v * 100) / 100;
  const num = (t) => {
    const s = String(t).trim().replace(/\s/g, "");

  };
  const fechaCorta = (t) => { const m = String(t).match(/^(\d{2})\/(\d{2})\/(\d{2}|\d{4})$/); if (!m) return null; const a = m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3]); return `${a}-${m[2]}-${m[1]}`; };
  const diasEntre = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
  const sumarDias = (f, n) => new Date(Date.parse(f) + n * 864e5).toISOString().slice(0, 10);

  const rangoDe = (dias) => (dias <= 0 ? 0 : dias <= 30 ? 1 : dias <= 60 ? 2 : dias <= 90 ? 3 : dias <= 180 ? 4 : dias <= 360 ? 5 : 6);

  function renglones(items, tol = 3) {
    const filas = [];
    for (const it of items.filter((i) => i.str && i.str.trim()).sort((a, b) => b.y - a.y)) {
      let f = filas.find((r) => Math.abs(r.y - it.y) <= tol);
      if (!f) { f = { y: it.y, c: [] }; filas.push(f); }
      f.c.push({ t: it.str.trim(), x: it.x });

  }
  const textoPDF = (paginas) => paginas.flat().map((i) => i.str).join(" ");
  function fechaDeCorte(paginas) {
    for (const f of renglones(paginas[0] || [])) {
      const t = f.c.map((x) => x.t);
      if (t.some((x) => /Fecha\s*(de\s*)?corte/i.test(x))) { const d = t.find((x) => /^\d{2}\/\d{2}\/\d{2,4}$/.test(x)); if (d) return fechaCorta(d); }

  }

  /** Detallado por factura. */
  function leerDetallado(paginas) {
    const todo = textoPDF(paginas);
    const corte = fechaDeCorte(paginas);

          const ns = t.map(num).filter((v) => v != null);
          if (prov && ns.length >= 8) prov.totalReporte = { saldo: ns.at(-8), b: ns.slice(-7) };

        // Encabezado de proveedor: NIT + nombre, sin fechas
