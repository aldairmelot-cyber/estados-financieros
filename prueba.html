  function clicBancos(t) {
    const a = t.dataset.bc;
    if (t.dataset.bctab) { BC.tab = t.dataset.bctab; BC.verTodos = false; return render(); }
    if (t.dataset.bcexp) return exportarBancos(t.dataset.bcexp);
    if (a === "ir-cargar") { BC.vista = "cargar"; return render(); }
    if (a === "volver") { BC.vista = "resumen"; BC.confirmar = null; BC.marcados.clear(); return render(); }
    if (a === "abrir") { BC.ultimaAct = null; BC.sel = t.dataset.id; BC.vista = "detalle"; BC.tab = "formato"; BC.marcados.clear(); BC.filtro = ""; BC.verTodos = false; render(); window.scrollTo({ top: 0 }); return; }
    if (a === "conciliar") return conciliarCola(Number(t.dataset.i));
    if (a === "subir-libro") return $("#archivo-bc-libro").click();
    if (a === "actualizar-cola") { const l = BC.cola.find((q) => q.tipo === "libro" && q.archivo === t.dataset.arch && q.k.cuenta === t.dataset.cta); if (!l) return; const id = idConc(l.k.cuenta, (l.k.hasta || "").slice(0, 7)); return actualizarLibro(id, l); }
    if (a === "conciliar-todo") { (async () => { let i; while ((i = BC.cola.filter((x) => x.tipo === "extracto").findIndex((q) => q.libro)) >= 0) await conciliarCola(i); BC.vista = "resumen"; render(); })(); return; }
    if (a === "limpiar-cola") { BC.cola = []; BC.pares = []; BC.error = null; return render(); }
    if (a === "quitar-cola") { BC.cola = BC.cola.filter((q) => q.archivo !== t.dataset.arch); emparejar(); return render(); }
    if (a === "ver-todos") { BC.verTodos = true; return render(); }
    if (a === "limpiar-sel") { BC.marcados.clear(); return render(); }
    if (a === "cruzar") { const ids = [...BC.marcados]; return guardarManual(BC.sel, (m) => { m.cruces.push([ids.filter((i) => i.startsWith("L")), ids.filter((i) => i.startsWith("B"))]); }); }
    if (a === "anterior") { const ids = [...BC.marcados]; return guardarManual(BC.sel, (m) => { m.anteriores.push(...ids.filter((i) => i.startsWith("B"))); }); }
    if (a === "deshacer") {
      const k = t.dataset.clave, regla = t.dataset.regla;
      return guardarManual(BC.sel, (m) => {
        const [ls, bs] = k.split(",|,").map((x) => x ? x.split(",").filter(Boolean) : []);
        const igual = (cr) => cr[0].join(",") === ls.join(",") && cr[1].join(",") === bs.join(",");
        const antes = m.cruces.length;
        m.cruces = m.cruces.filter((cr) => !igual(cr));
        if (regla === "anterior" && ls.some((i) => i.startsWith("LV"))) m.anteriores = m.anteriores.filter((i) => !bs.includes(i));
        if (m.cruces.length === antes) m.deshacer.push(k);
      });
    }
    if (a === "agrupar" || a === "detallar") { const n = clon(BC.cfg); n.agrupar = a === "agrupar"; BC.cfg = n; if (S.db) S.db.doc("config/bancos").set(n).catch(() => {}); return render(); }
    if (a === "pedir-borrar") { BC.confirmar = "borrar"; return render(); }
    if (a === "pedir-borrar-pas") { BC.confirmar = "pas:" + t.dataset.id; return render(); }
    if (a === "borrar-pas") { BC.confirmar = null; return borrarPasarela(t.dataset.id); }

    db.collection("conciliaciones").onSnapshot((snap) => {
      S.bc.conc = new Map(snap.docs.map((d) => [d.id, d.data()]));
      if (!S.cargando && !(S.tab === "bancos" && S.bc.sucio)) render();
    }, () => {});
    db.collection("concPasarela").onSnapshot((snap) => {
      S.bc.pas = new Map(snap.docs.map((d) => [d.id, d.data()]));
      if (!S.cargando && S.tab === "bancos" && !S.bc.sucio) render();
    }, () => {});
    db.doc("config/bancos").onSnapshot((snap) => {
      if (snap.exists) S.bc.cfg = { ...clon(BC_CFG_DEF), ...snap.data() };
      if (!S.cargando && !(S.tab === "bancos" && S.bc.sucio)) render();
    }, () => {});
    db.collection("declaraciones").onSnapshot((snap) => {
      S.decl = new Map(snap.docs.map((d) => [d.id, d.data()]));
      if (!S.cargando && !(S.tab === "config" && S.sucio)) render();
    }, () => {});
    db.doc("config/general").onSnapshot((snap) => {
      if (snap.exists) {
        const datos = snap.data();
        const cfg = mezclar(CFG_DEF, { ...datos, version: datos.version || 1 });
        if (migrar(cfg)) db.doc("config/general").set(clon(cfg)).catch(() => {});
        S.cfg = cfg;
      }
      cfgListo = true;
      if (!S.cargando && !(S.tab === "config" && S.sucio)) { S.borrador = null; render(); }
      listo();
    }, () => { cfgListo = true; listo(); });
  }
  window.__app = { bc: { actualizarLibro, resolver, BC }, S, render, cargarFilas: (filas, nombre) => { const b = Motor.interpretar(filas, nombre); b.cargado = new Date().toISOString(); S.hist.set(b.periodo, b); S.periodo = b.periodo; S.cargando = false; render(); } };
  iniciar();
})();

</script>
